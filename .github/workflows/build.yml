---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      working-directory: code/projects/windows
      run: msbuild imm.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

    - name: Upload Unity Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Windows-${{ matrix.platform }}
        path: |
          code/appImmUnity/exe/ImmUnityPlugin.dll
        if-no-files-found: error

    - name: Upload Viewer Executable
      uses: actions/upload-artifact@v4
      with:
        name: appImmViewer-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          code/appImmViewer/exe/appImmViewer_${{ matrix.configuration }}.exe
          code/appImmViewer/exe/settings.json
          code/appImmViewer/exe/*.dll
        if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;26.1.10909125"

    - name: Build libImmCore
      working-directory: code/projects/android
      run: |
        chmod +x gradlew
        ./gradlew :libImmCore:assembleDebug

    - name: Build libImmImporter
      working-directory: code/projects/android
      run: ./gradlew :libImmImporter:assembleDebug

    - name: Build libImmPlayer
      working-directory: code/projects/android
      run: ./gradlew :libImmPlayer:assembleDebug

    - name: Build appImmUnity
      working-directory: code/projects/android
      run: ./gradlew :appImmUnity:assembleDebug

    - name: Upload Unity Plugin SO
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Android-arm64-v8a
        path: |
          code/appImmUnity/Projects/Android/app/build/intermediates/cxx/Debug/*/obj/arm64-v8a/libImmUnityPlugin.so
        if-no-files-found: warn

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Android-AAR
        path: |
          code/appImmUnity/Projects/Android/app/build/outputs/aar/*.aar
        if-no-files-found: warn
