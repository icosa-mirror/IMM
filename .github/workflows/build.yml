---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      working-directory: code/projects/windows
      run: msbuild imm.sln /p:Configuration=Release /p:Platform=x64 /m

    - name: Upload Stroke Reader DLL
      uses: actions/upload-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-Windows
        path: |
          code/appImmStrokeReader/exe/ImmStrokeReader.dll
        if-no-files-found: error
        retention-days: 1

    - name: Upload Unity Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewerPlugin-Windows
        path: |
          code/appImmUnity/exe/ImmUnityPlugin.dll
        if-no-files-found: error
        retention-days: 1

    - name: Package Viewer Artifact
      shell: pwsh
      run: |
        $staging = "viewer_artifact"
        New-Item -ItemType Directory -Force $staging | Out-Null
        Copy-Item code/appImmViewer/exe/appImmViewer_Release.exe $staging
        Copy-Item code/appImmViewer/exe/settings.json $staging
        Copy-Item code/appImmViewer/exe/*.dll $staging
        Copy-Item docs/viewer_settings.md $staging

    - name: Package Viewer Artifact (VR)
      shell: pwsh
      run: |
        $staging = "viewer_artifact_vr"
        New-Item -ItemType Directory -Force $staging | Out-Null
        Copy-Item code/appImmViewer/exe/appImmViewer_Release.exe $staging
        Copy-Item code/appImmViewer/exe/settings.json $staging
        Copy-Item code/appImmViewer/exe/*.dll $staging
        Copy-Item docs/viewer_settings.md $staging
        $settingsPath = Join-Path $staging "settings.json"
        $json = Get-Content $settingsPath -Raw | ConvertFrom-Json
        $json.Rendering.EnableVR = $true
        $json.Rendering.RenderingAPI = "OpenGL"
        $json | ConvertTo-Json -Depth 6 | Set-Content $settingsPath -Encoding UTF8

    - name: Upload Viewer Executable
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Windows
        path: viewer_artifact
        if-no-files-found: error
    - name: Upload Viewer Executable (VR)
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Windows-VR
        path: viewer_artifact_vr
        if-no-files-found: error
    - name: Upload Sample IMM
      uses: actions/upload-artifact@v4
      with:
        name: sample1-imm
        path: exampleImmFiles/sample1.imm
        if-no-files-found: error

  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        key: ndk-${{ runner.os }}-26.1.10909125

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;26.1.10909125"

    - name: Build libImmCore
      working-directory: code/projects/android
      run: |
        chmod +x gradlew
        ./gradlew :libImmCore:assembleDebug

    - name: Build libImmImporter
      working-directory: code/projects/android
      run: ./gradlew :libImmImporter:assembleDebug

    - name: Build libImmPlayer
      working-directory: code/projects/android
      run: ./gradlew :libImmPlayer:assembleDebug

    - name: Build appImmUnity
      working-directory: code/projects/android
      run: ./gradlew :appImmUnity:assembleDebug

    - name: Build appImmViewer
      working-directory: code/projects/android
      run: ./gradlew :appImmViewer:assembleDebug

    - name: Build appImmViewer (VR)
      working-directory: code/projects/android
      run: ./gradlew :libImmCore:assembleDebug :libImmImporter:assembleDebug :libImmPlayer:assembleDebug -PimmBuildDir=build_vr && ./gradlew :appImmViewer:assembleDebug -PimmNonVr=OFF -PimmBuildDir=build_vr

    - name: Build appImmStrokeReader
      working-directory: code/projects/android
      run: ./gradlew :appImmStrokeReader:assembleDebug

    - name: Upload Unity Plugin
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts/ImmViewerPlugin-Android
        so_file=$(ls code/appImmUnity/Projects/Android/app/build/intermediates/cxx/Debug/*/obj/arm64-v8a/libImmUnityPlugin.so | head -n 1)
        cp "$so_file" artifacts/ImmViewerPlugin-Android/libImmUnityPlugin.so

    - name: Upload Unity Plugin
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewerPlugin-Android
        path: artifacts/ImmViewerPlugin-Android/libImmUnityPlugin.so
        if-no-files-found: error
        retention-days: 1

    - name: Upload Stroke Reader
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p artifacts/ImmStrokeReaderPlugin-Android
        so_file=$(ls code/appImmStrokeReader/Projects/Android/build/intermediates/cxx/Debug/*/obj/arm64-v8a/libImmStrokeReader.so | head -n 1)
        cp "$so_file" artifacts/ImmStrokeReaderPlugin-Android/libImmStrokeReader.so

    - name: Upload Stroke Reader
      uses: actions/upload-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-Android
        path: artifacts/ImmStrokeReaderPlugin-Android/libImmStrokeReader.so
        if-no-files-found: error
        retention-days: 1

    - name: Upload Android Viewer
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Android
        path: |
          code/projects/android/appImmViewer/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload Android Viewer VR
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Android-VR
        path: |
          code/projects/android/appImmViewer/build_vr/outputs/apk/debug/*.apk
        if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CMake
      run: brew install cmake

    - name: Configure macOS build
      run: cmake -S code/projects/macos -B build/macos -DIMM_BUILD_VIEWER=OFF

    - name: Build macOS Unity plugin
      if: false
      run: cmake --build build/macos --config Release

    - name: Build macOS Stroke Reader plugin
      run: cmake --build build/macos --target ImmStrokeReader --config Release

    - name: Upload Unity Plugin Bundle
      if: false
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewerPlugin-macOS
        path: |
          code/ImmUnitySampleProject/Assets/Plugins/OSX/ImmUnityPlugin.bundle
        if-no-files-found: error

    - name: Upload Stroke Reader dylib
      uses: actions/upload-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-macOS
        path: |
          code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/macOS/libImmStrokeReader.dylib
        if-no-files-found: error
        retention-days: 1

  build-ios:
    name: iOS
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CMake
      run: brew install cmake

    - name: Configure iOS build
      run: |
        cmake -S code/projects/ios -B build/ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_ARCHITECTURES=arm64

    - name: Build iOS Stroke Reader
      run: cmake --build build/ios --target ImmStrokeReader --config Release

    - name: Upload Stroke Reader (iOS)
      uses: actions/upload-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-iOS
        path: |
          build/ios/stroke-reader/libImmStrokeReader.a
        if-no-files-found: error
        retention-days: 1

  package-unity-plugins:
    name: Package Unity Plugins
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
      - build-macos
      - build-ios
    permissions:
      actions: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download Windows Stroke Reader
      uses: actions/download-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-Windows
        path: artifacts/ImmStrokeReaderPlugin-Windows

    - name: Download Android Stroke Reader
      uses: actions/download-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-Android
        path: artifacts/ImmStrokeReaderPlugin-Android

    - name: Download macOS Stroke Reader
      uses: actions/download-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-macOS
        path: artifacts/ImmStrokeReaderPlugin-macOS

    - name: Download iOS Stroke Reader
      uses: actions/download-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-iOS
        path: artifacts/ImmStrokeReaderPlugin-iOS

    - name: Download Windows ImmUnity Plugin
      uses: actions/download-artifact@v4
      with:
        name: ImmViewerPlugin-Windows
        path: artifacts/ImmViewerPlugin-Windows

    - name: Download Android ImmUnity Plugin
      uses: actions/download-artifact@v4
      with:
        name: ImmViewerPlugin-Android
        path: artifacts/ImmViewerPlugin-Android

    - name: Sync stroke reader package binaries
      shell: bash
      run: |
        set -euo pipefail
        stroke_pkg="code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader"
        mkdir -p "$stroke_pkg/Plugins/x86_64" "$stroke_pkg/Plugins/Android/arm64-v8a" "$stroke_pkg/Plugins/macOS" "$stroke_pkg/Plugins/iOS"
        cp artifacts/ImmStrokeReaderPlugin-Windows/ImmStrokeReader.dll "$stroke_pkg/Plugins/x86_64/ImmStrokeReader.dll"
        shopt -s nullglob globstar
        android_so=(artifacts/ImmStrokeReaderPlugin-Android/**/libImmStrokeReader.so)
        if [ ${#android_so[@]} -eq 0 ]; then
          echo "Missing libImmStrokeReader.so in ImmStrokeReaderPlugin-Android artifact"
          exit 1
        fi
        cp "${android_so[0]}" "$stroke_pkg/Plugins/Android/arm64-v8a/libImmStrokeReader.so"
        cp artifacts/ImmStrokeReaderPlugin-macOS/libImmStrokeReader.dylib "$stroke_pkg/Plugins/macOS/libImmStrokeReader.dylib"
        cp artifacts/ImmStrokeReaderPlugin-iOS/libImmStrokeReader.a "$stroke_pkg/Plugins/iOS/libImmStrokeReader.a"

    - name: Sync ImmUnity package binaries
      shell: bash
      run: |
        set -euo pipefail
        unity_pkg="code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity"
        mkdir -p "$unity_pkg/Plugins/x86_64" "$unity_pkg/Plugins/Android/libs/arm64-v8a"
        cp artifacts/ImmViewerPlugin-Windows/ImmUnityPlugin.dll "$unity_pkg/Plugins/x86_64/ImmUnityPlugin.dll"
        shopt -s nullglob globstar
        android_unity_so=(artifacts/ImmViewerPlugin-Android/**/libImmUnityPlugin.so)
        if [ ${#android_unity_so[@]} -eq 0 ]; then
          echo "Missing libImmUnityPlugin.so in ImmViewerPlugin-Android artifact"
          exit 1
        fi
        cp "${android_unity_so[0]}" "$unity_pkg/Plugins/Android/libs/arm64-v8a/libImmUnityPlugin.so"

    - name: Archive stroke reader UPM package
      shell: bash
      run: |
        set -euo pipefail
        cd code/ImmUnitySampleProject/Packages
        zip -r "$GITHUB_WORKSPACE/ImmStrokeReaderPlugin-UPM.zip" com.immersive-foundation.imm-stroke-reader

    - name: Archive ImmUnity UPM package
      shell: bash
      run: |
        set -euo pipefail
        cd code/ImmUnitySampleProject/Packages
        zip -r "$GITHUB_WORKSPACE/ImmViewerPlugin-UPM.zip" com.immersive-foundation.imm-unity

    - name: Upload stroke reader UPM package
      uses: actions/upload-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-UPM
        path: ImmStrokeReaderPlugin-UPM.zip
        if-no-files-found: error

    - name: Upload ImmUnity UPM package
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewerPlugin-UPM
        path: ImmViewerPlugin-UPM.zip
        if-no-files-found: error

    - name: Delete intermediate plugin artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const targetNames = new Set([
            'ImmStrokeReaderPlugin-Windows',
            'ImmStrokeReaderPlugin-Android',
            'ImmStrokeReaderPlugin-macOS',
            'ImmStrokeReaderPlugin-iOS',
            'ImmViewerPlugin-Windows',
            'ImmViewerPlugin-Android',
          ]);
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const run_id = context.runId;
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner,
            repo,
            run_id,
          });
          for (const artifact of artifacts) {
            if (targetNames.has(artifact.name)) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }
          }

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
      - package-unity-plugins
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[RELEASE]')
    permissions:
      contents: write
      actions: read

    steps:
    - name: Download UPM packages
      uses: actions/download-artifact@v4
      with:
        name: ImmStrokeReaderPlugin-UPM
        path: release-assets/upm

    - name: Download UPM packages (ImmViewer)
      uses: actions/download-artifact@v4
      with:
        name: ImmViewerPlugin-UPM
        path: release-assets/upm

    - name: Download Windows viewer
      uses: actions/download-artifact@v4
      with:
        name: ImmViewer-Windows
        path: release-assets/ImmViewer-Windows

    - name: Download Windows viewer (VR)
      uses: actions/download-artifact@v4
      with:
        name: ImmViewer-Windows-VR
        path: release-assets/ImmViewer-Windows-VR

    - name: Download Android viewer
      uses: actions/download-artifact@v4
      with:
        name: ImmViewer-Android
        path: release-assets/ImmViewer-Android

    - name: Download Android viewer (VR)
      uses: actions/download-artifact@v4
      with:
        name: ImmViewer-Android-VR
        path: release-assets/ImmViewer-Android-VR

    - name: Download sample IMM
      uses: actions/download-artifact@v4
      with:
        name: sample1-imm
        path: release-assets/sample1-imm

    - name: Zip Windows viewer artifacts
      shell: bash
      run: |
        set -euo pipefail
        cd release-assets
        zip -r ImmViewer-Windows.zip ImmViewer-Windows
        zip -r ImmViewer-Windows-VR.zip ImmViewer-Windows-VR

    - name: Normalize Android APK names
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        apk=(release-assets/ImmViewer-Android/*.apk)
        apk_vr=(release-assets/ImmViewer-Android-VR/*.apk)
        if [ ${#apk[@]} -eq 0 ]; then
          echo "Missing Android APK in ImmViewer-Android artifact"
          exit 1
        fi
        if [ ${#apk_vr[@]} -eq 0 ]; then
          echo "Missing Android APK in ImmViewer-Android-VR artifact"
          exit 1
        fi
        cp "${apk[0]}" release-assets/ImmViewer-Android.apk
        cp "${apk_vr[0]}" release-assets/ImmViewer-Android-VR.apk

    - name: Create GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="release-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
        gh release create "$tag" \
          --repo "${GITHUB_REPOSITORY}" \
          --title "$tag" \
          --generate-notes \
          release-assets/upm/ImmStrokeReaderPlugin-UPM.zip \
          release-assets/upm/ImmViewerPlugin-UPM.zip \
          release-assets/ImmViewer-Windows.zip \
          release-assets/ImmViewer-Windows-VR.zip \
          release-assets/ImmViewer-Android.apk \
          release-assets/ImmViewer-Android-VR.apk \
          release-assets/sample1-imm/sample1.imm
