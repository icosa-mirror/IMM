---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      working-directory: code/projects/windows
      run: msbuild imm.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

    - name: Upload Unity Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Windows-${{ matrix.platform }}
        path: |
          code/appImmUnity/exe/ImmUnityPlugin.dll
        if-no-files-found: error

    - name: Package Viewer Artifact
      shell: pwsh
      run: |
        $staging = "viewer_artifact"
        New-Item -ItemType Directory -Force $staging | Out-Null
        Copy-Item code/appImmViewer/exe/appImmViewer_${{ matrix.configuration }}.exe $staging
        Copy-Item code/appImmViewer/exe/settings.json $staging
        Copy-Item code/appImmViewer/exe/*.dll $staging
        Copy-Item docs/viewer_settings.md $staging
        Compress-Archive -Path "$staging\\*" -DestinationPath "ImmViewer-${{ matrix.configuration }}-${{ matrix.platform }}.zip" -Force

    - name: Upload Viewer Executable
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-${{ matrix.configuration }}-${{ matrix.platform }}
        path: ImmViewer-${{ matrix.configuration }}-${{ matrix.platform }}.zip
        if-no-files-found: error
    - name: Upload Sample IMM
      uses: actions/upload-artifact@v4
      with:
        name: sample1-imm
        path: exampleImmFiles/sample1.imm
        if-no-files-found: error

  build-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Android NDK
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        key: ndk-${{ runner.os }}-26.1.10909125

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;26.1.10909125"

    - name: Build libImmCore
      working-directory: code/projects/android
      run: |
        chmod +x gradlew
        ./gradlew :libImmCore:assembleDebug

    - name: Build libImmImporter
      working-directory: code/projects/android
      run: ./gradlew :libImmImporter:assembleDebug

    - name: Build libImmPlayer
      working-directory: code/projects/android
      run: ./gradlew :libImmPlayer:assembleDebug

    - name: Build appImmUnity
      working-directory: code/projects/android
      run: ./gradlew :appImmUnity:assembleDebug

    - name: Build appImmViewer
      working-directory: code/projects/android
      run: ./gradlew :appImmViewer:assembleDebug

    - name: Build appImmViewer (VR)
      working-directory: code/projects/android
      run: ./gradlew :libImmCore:assembleDebug :libImmImporter:assembleDebug :libImmPlayer:assembleDebug -PimmBuildDir=build_vr && ./gradlew :appImmViewer:assembleDebug -PimmNonVr=OFF -PimmBuildDir=build_vr

    - name: Upload Unity Plugin SO
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Android-arm64-v8a
        path: |
          code/appImmUnity/Projects/Android/app/build/intermediates/cxx/Debug/*/obj/arm64-v8a/libImmUnityPlugin.so
        if-no-files-found: warn

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-Android-AAR
        path: |
          code/appImmUnity/Projects/Android/app/build/outputs/aar/*.aar
        if-no-files-found: warn

    - name: Upload Android Viewer APK
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Android-APK
        path: |
          code/projects/android/appImmViewer/build/outputs/apk/debug/*.apk
        if-no-files-found: error

    - name: Upload Android Viewer VR APK
      uses: actions/upload-artifact@v4
      with:
        name: ImmViewer-Android-APK-VR
        path: |
          code/projects/android/appImmViewer/build_vr/outputs/apk/debug/*.apk
        if-no-files-found: error

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install CMake
      run: brew install cmake

    - name: Configure macOS build
      run: cmake -S code/projects/macos -B build/macos

    - name: Build macOS Unity plugin
      run: cmake --build build/macos --config Release

    - name: Upload Unity Plugin Bundle
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-macOS
        path: |
          code/ImmUnitySampleProject/Assets/Plugins/OSX/ImmUnityPlugin.bundle
        if-no-files-found: error
