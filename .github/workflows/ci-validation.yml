---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select how much of the pipeline to run.
        required: true
        default: full
        type: choice
        options:
          - quick
          - build
          - full
          - release
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
      - develop
      - feature/**
      - experiment/**
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'quick') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      contains(github.event.head_commit.message, '[CI BUILD]') ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/build.yml
    permissions:
      actions: read
      contents: write
    with:
      mode: build
    secrets: inherit

  core:
    name: Core
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  device:
    name: Device
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'device-ci')) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-device.yml
    secrets: inherit

  engine:
    name: Engine
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'engine-ci')) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-engine.yml
    secrets: inherit

  gpu:
    name: GPU
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'gpu-ci')) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-gpu.yml
    secrets: inherit

  validation-evidence:
    name: Validation Evidence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - core
      - device
      - engine
      - gpu
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download matrix evidence artifacts
        uses: actions/download-artifact@v4
        with:
          name: CoreMatrixEvidence
          path: artifacts/validation-evidence/input/CoreMatrixEvidence

      - name: Download device matrix evidence
        if: needs.device.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: DeviceMatrixEvidence
          path: artifacts/validation-evidence/input/DeviceMatrixEvidence

      - name: Download engine matrix evidence
        if: needs.engine.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: EngineValidationEvidence
          path: artifacts/validation-evidence/input/EngineValidationEvidence

      - name: Download GPU matrix evidence
        if: needs.gpu.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: GPUMatrixEvidence
          path: artifacts/validation-evidence/input/GPUMatrixEvidence

      - name: Write validation visual evidence report
        run: >
          python tests/tools/write_visual_evidence_report.py
          --input-root artifacts/validation-evidence/input
          --output-dir artifacts/validation-evidence/view
          --matrix-status tests/matrix_status.json
          --markdown-output artifacts/validation-evidence/view/VALIDATION_REPORT.md

      - name: Verify full depth validation evidence
        if: needs.engine.result != 'skipped' && needs.gpu.result != 'skipped'
        run: >
          python tests/tools/verify_full_depth_evidence_report.py
          --report artifacts/validation-evidence/view/VALIDATION_REPORT.md

      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: CIValidationEvidence
          path: artifacts/validation-evidence/view
          if-no-files-found: error
          retention-days: 14

      - name: Hide matrix implementation artifacts
        if: ${{ always() && vars.CI_VALIDATION_DEBUG_ARTIFACTS != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python tests/tools/delete_ci_artifacts.py
          --name CoreMatrixEvidence
          --name DeviceMatrixEvidence
          --name EngineValidationEvidence
          --name EngineMatrixDebugArtifacts
          --name GPUMatrixEvidence

  publish:
    name: Publish
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.core.result == 'success' &&
      (needs.device.result == 'success' || needs.device.result == 'skipped') &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped') &&
      (needs.gpu.result == 'success' || needs.gpu.result == 'skipped') &&
      needs.validation-evidence.result == 'success' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release')
      )
    needs:
      - build
      - core
      - device
      - engine
      - gpu
      - validation-evidence
    uses: ./.github/workflows/build.yml
    permissions:
      actions: read
      contents: write
    with:
      mode: publish
      sync_binaries: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      release: ${{ github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[RELEASE]') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
    secrets: inherit
