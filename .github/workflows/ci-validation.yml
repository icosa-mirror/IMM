---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build and Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Select pipeline depth; hardware is the only mode that can use self-hosted runners.
        required: true
        default: full
        type: choice
        options:
          - quick
          - build
          - full
          - hardware
          - release
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
      - develop
      - feature/**
      - experiment/**
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: write
  contents: read

jobs:
  build:
    name: Build
    if: >-
      !contains(github.event.head_commit.message, '[CI IOS]') &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'quick') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      contains(github.event.head_commit.message, '[CI BUILD]') ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]'))
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
      contents: write
    with:
      mode: build
    secrets: inherit

  web:
    name: Web
    if: >-
      !contains(github.event.head_commit.message, '[CI IOS]') &&
      (github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'quick') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      contains(github.event.head_commit.message, '[CI BUILD]') ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]'))
    uses: ./.github/workflows/web-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  core:
    name: Core
    if: ${{ !contains(github.event.head_commit.message, '[CI IOS]') }}
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit

  device:
    name: Device
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'hardware' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'device-ci')) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-device.yml
    with:
      hardware: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' }}
      evidence_scope: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' && 'all-supported' || 'hosted' }}
    secrets: inherit

  engine:
    name: Engine
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'hardware' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'engine-ci') ||
      contains(github.event.pull_request.labels.*.name, 'device-ci'))) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-engine.yml
    with:
      hardware: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' }}
      evidence_scope: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' && 'all-supported' || 'hosted' }}
    secrets: inherit

  gpu:
    name: GPU
    needs: build
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'hardware' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'gpu-ci')) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-gpu.yml
    with:
      hardware: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' }}
      evidence_scope: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' && 'all-supported' || 'hosted' }}
    secrets: inherit

  ios:
    name: iOS Visual
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'hardware' || inputs.mode == 'release')) ||
      (github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'engine-ci') ||
      contains(github.event.pull_request.labels.*.name, 'device-ci'))) ||
      contains(github.event.head_commit.message, '[CI VALIDATION]') ||
      contains(github.event.head_commit.message, '[RELEASE]')
    uses: ./.github/workflows/ci-ios.yml
    secrets: inherit

  validation-evidence:
    name: Validation Evidence
    if: ${{ always() && !contains(github.event.head_commit.message, '[CI IOS]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - core
      - device
      - engine
      - gpu
      - ios
      - web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download matrix evidence artifacts
        uses: actions/download-artifact@v4
        with:
          name: CoreMatrixEvidence
          path: artifacts/validation-evidence/input/CoreMatrixEvidence

      - name: Download device matrix evidence
        if: needs.device.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: DeviceMatrixEvidence
          path: artifacts/validation-evidence/input/DeviceMatrixEvidence

      - name: Download engine matrix evidence
        if: needs.engine.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: EngineValidationEvidence
          path: artifacts/validation-evidence/input/EngineValidationEvidence

      - name: Download GPU matrix evidence
        if: needs.gpu.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: GPUMatrixEvidence
          path: artifacts/validation-evidence/input/GPUMatrixEvidence

      - name: Download WebAssembly player evidence
        if: needs.web.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: WebPlayerValidationEvidence
          path: artifacts/validation-evidence/input/WebPlayerValidationEvidence

      - name: Download standalone iOS Metal evidence
        if: needs.ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: iOSStandaloneMetal
          path: artifacts/validation-evidence/input/iOSStandaloneMetal

      - name: Download Unity iOS Metal evidence
        if: needs.ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: UnityIOSMetalComposition
          path: artifacts/validation-evidence/input/UnityIOSMetalComposition

      - name: Download Godot iOS Metal evidence
        if: needs.ios.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          name: GodotIOSMetal
          path: artifacts/validation-evidence/input/GodotIOSMetal

      - name: Write validation visual evidence report
        env:
          VALIDATION_EVIDENCE_SCOPE: >-
            ${{
              (github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' && 'all') ||
              (
                (
                  github.event_name == 'schedule' ||
                  (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'release')) ||
                  contains(github.event.head_commit.message, '[CI VALIDATION]') ||
                  contains(github.event.head_commit.message, '[RELEASE]')
                ) &&
                'hosted'
              ) ||
              'none'
            }}
        run: |
          python tests/tools/write_visual_evidence_report.py \
            --input-root artifacts/validation-evidence/input \
            --output-dir artifacts/validation-evidence/view \
            --matrix-status tests/matrix_status.json \
            --required-evidence-scope "$VALIDATION_EVIDENCE_SCOPE" \
            --markdown-output artifacts/validation-evidence/view/VALIDATION_REPORT.md

      - name: Verify full depth validation evidence
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'hardware' && needs.engine.result != 'skipped' && needs.gpu.result != 'skipped'
        run: >
          python tests/tools/verify_full_depth_evidence_report.py
          --report artifacts/validation-evidence/view/VALIDATION_REPORT.md

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIValidationEvidence
          path: artifacts/validation-evidence/view
          if-no-files-found: error
          retention-days: 14

      - name: Hide matrix implementation artifacts
        if: ${{ success() && vars.CI_VALIDATION_DEBUG_ARTIFACTS != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python tests/tools/delete_ci_artifacts.py
          --name CoreMatrixEvidence
          --name DeviceMatrixEvidence
          --name EngineValidationEvidence
          --name EngineMatrixDebugArtifacts
          --name GPUMatrixEvidence
          --name iOSStandaloneMetal
          --name UnityIOSMetalComposition

  deploy-pages:
    name: Deploy Web Player Pages
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.web.result == 'success' &&
      needs.core.result == 'success' &&
      (needs.device.result == 'success' || needs.device.result == 'skipped') &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped') &&
      (needs.gpu.result == 'success' || needs.gpu.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'skipped') &&
      needs.validation-evidence.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode != 'quick')
      )
    needs:
      - build
      - web
      - core
      - device
      - engine
      - gpu
      - ios
      - validation-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: web-player-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    name: Publish
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.web.result == 'success' &&
      needs.core.result == 'success' &&
      (needs.device.result == 'success' || needs.device.result == 'skipped') &&
      (needs.engine.result == 'success' || needs.engine.result == 'skipped') &&
      (needs.gpu.result == 'success' || needs.gpu.result == 'skipped') &&
      needs.validation-evidence.result == 'success' &&
      (
        (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'release')
      )
    needs:
      - build
      - web
      - core
      - device
      - engine
      - gpu
      - validation-evidence
    uses: ./.github/workflows/build.yml
    permissions:
      actions: write
      contents: write
    with:
      mode: publish
      sync_binaries: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      release: ${{ github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[RELEASE]') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
    secrets: inherit
