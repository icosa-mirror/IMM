name: Retry isolated Unity startup kill

on:
  workflow_run:
    workflows: [Build and Validation Pipeline]
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: unity-startup-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-startup-kill:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Use trusted default-branch code, never the triggering run's checkout/artifacts.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Retry one isolated infrastructure failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/tools/retry_unity_startup_kill.py
