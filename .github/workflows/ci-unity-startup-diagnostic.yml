name: Investigate Unity startup kills

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Windows cold/warm starts or Android starts from the existing CI cache
        type: choice
        default: windows
        options: [windows, android, inspect]
      sanitize:
        description: Remove restored compiler PID records before starting Unity
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  startup:
    name: Startup trial ${{ matrix.trial }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trial: ${{ fromJSON(inputs.profile == 'android' && '[1,2,3,4]' || inputs.profile == 'inspect' && '[1]' || '[1,2]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare startup-only entry point and existing CI license configuration
        shell: bash
        env:
          IMM_STARTUP_PROFILE: ${{ inputs.profile }}
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path('.github/workflows/ci-engine.yml').read_text())['env']
          android = os.environ['IMM_STARTUP_PROFILE'] != 'windows'
          project = 'code/ImmUnitySampleProject'
          if android:
              project = '.ci-workspace/unity-android-openxr-quest'
              subprocess.run([sys.executable, 'tests/tools/prepare_unity_ci_project.py',
                              '--source', 'code/ImmUnitySampleProject', '--output', project,
                              '--preserve-xr'], check=True)
          version = config['UNITY_ANDROID_VULKAN_VERSION' if android else 'UNITY_VERSION']
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f"UNITY_VERSION={version}\n")
              stream.write(f"IMM_STARTUP_PROJECT={project}\n")
              stream.write(f"IMM_STARTUP_TARGET={'Android' if android else 'StandaloneWindows64'}\n")
              stream.write(f"IMM_STARTUP_CACHE={'UnityLibrary-android-openxr-quest' if android else 'UnityLibrary-windows-directx'}\n")
              stream.write(f"IMM_STARTUP_IMAGE=unityci/editor:ubuntu-{version}-{'android' if android else 'windows-mono'}-3\n")
              stream.write(f"IMM_UNITY_FALLBACK_LICENSE<<IMM_LICENSE_END\n{config['IMM_UNITY_FALLBACK_LICENSE']}\nIMM_LICENSE_END\n")
          path = Path(project) / 'Assets/Editor/ImmStartupDiagnostic.cs'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text('''using UnityEditor;
          public static class ImmStartupDiagnostic {
              public static void Run() {
                  UnityEngine.Debug.Log("[IMM_STARTUP_DIAGNOSTIC] Entry point reached");
                  EditorApplication.Exit(0);
              }
          }
          ''')
          PY

      # Intentionally retain legacy whole-Library keys for root-cause reproduction.
      # Production uses UnityLibrary-allowlist-v1-* and explicit paths instead.
      - name: Restore the legacy whole-Library cache for diagnosis
        id: library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: ${{ env.IMM_STARTUP_PROJECT }}/Library
          key: ${{ env.IMM_STARTUP_CACHE }}-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            ${{ env.IMM_STARTUP_CACHE }}-${{ env.UNITY_VERSION }}-

      - name: Require the exact restored-cache condition for Android trials
        if: inputs.profile != 'windows' && steps.library.outputs.cache-hit != 'true'
        run: |
          echo 'The Android CI Library cache was unavailable; refusing a cold-start substitute.'
          exit 1

      - name: Record compiler PIDs preserved in the restored Library
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          library = Path(os.environ['IMM_STARTUP_PROJECT']) / 'Library'
          records = {}
          for name in ('burst.pid', 'ilpp.pid'):
              path = library / name
              if path.exists():
                  text = path.read_text().strip()
                  records[name] = int(text) if text.isdecimal() else 'not a numeric PID'
          output = Path('artifacts/unity-startup/restored-compiler-pids.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(records, indent=2))
          PY

      - name: Apply the compiler PID cache fix
        if: inputs.sanitize && inputs.profile != 'inspect'
        run: python3 tests/tools/sanitize_unity_library_cache.py --project "${{ env.IMM_STARTUP_PROJECT }}"

      - name: Start signal and resource diagnostics
        if: inputs.profile != 'inspect'
        shell: bash
        run: |
          mkdir -p artifacts/unity-startup
          nohup python3 tests/tools/monitor_unity_build_memory.py --output artifacts/unity-startup/memory.jsonl --workspace "$GITHUB_WORKSPACE" > artifacts/unity-startup/monitor.log 2>&1 &
          echo $! > artifacts/unity-startup/monitor.pid

      - name: Activate and launch the sample project without building a player
        if: inputs.profile != 'inspect'
        uses: game-ci/unity-builder@v4
        timeout-minutes: 20
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: ${{ env.IMM_STARTUP_PROJECT }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.IMM_STARTUP_TARGET }}
          versioning: None
          buildMethod: ImmStartupDiagnostic.Run
          customParameters: -nographics -job-worker-count 2 -desiredWorkerCount 1 -standbyWorkerCount 1 -logFile /github/workspace/artifacts/unity-startup/editor.log

      - name: Restart against the populated Library (warm start 1)
        if: success() && inputs.profile == 'windows'
        uses: game-ci/unity-builder@v4
        timeout-minutes: 5
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          versioning: None
          buildMethod: ImmStartupDiagnostic.Run
          customParameters: -nographics -job-worker-count 2 -desiredWorkerCount 1 -standbyWorkerCount 1 -logFile /github/workspace/artifacts/unity-startup/editor-warm-1.log

      - name: Restart against the populated Library (warm start 2)
        if: success() && inputs.profile == 'windows'
        uses: game-ci/unity-builder@v4
        timeout-minutes: 5
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          versioning: None
          buildMethod: ImmStartupDiagnostic.Run
          customParameters: -nographics -job-worker-count 2 -desiredWorkerCount 1 -standbyWorkerCount 1 -logFile /github/workspace/artifacts/unity-startup/editor-warm-2.log

      - name: Restart against the populated Library (warm start 3)
        if: success() && inputs.profile == 'windows'
        uses: game-ci/unity-builder@v4
        timeout-minutes: 5
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          versioning: None
          buildMethod: ImmStartupDiagnostic.Run
          customParameters: -nographics -job-worker-count 2 -desiredWorkerCount 1 -standbyWorkerCount 1 -logFile /github/workspace/artifacts/unity-startup/editor-warm-3.log

      - name: Stop and flush diagnostics
        if: always()
        shell: bash
        run: python3 tests/tools/monitor_unity_build_memory.py --stop artifacts/unity-startup/monitor.pid --output artifacts/unity-startup/memory.jsonl

      - name: Resolve Unity kill stacks against the exact Editor image
        if: failure() && (inputs.profile == 'windows' || steps.library.outputs.cache-hit == 'true')
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          docker run --rm --entrypoint python3 \
            -v "$PWD/artifacts/unity-startup:/evidence:ro" \
            -v "$PWD/tests/tools:/tools:ro" \
            "$IMM_STARTUP_IMAGE" \
            /tools/resolve_unity_kill_stack.py /evidence/memory-signals.jsonl \
            > artifacts/unity-startup/resolved-kill-stacks.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UnityStartupTrial-${{ matrix.trial }}
          path: artifacts/unity-startup
          retention-days: 14
