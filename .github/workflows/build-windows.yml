name: Build Windows

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      working-directory: code/projects/windows
      run: msbuild imm.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /m

    - name: Upload Unity Plugin DLL
      uses: actions/upload-artifact@v4
      with:
        name: ImmUnityPlugin-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          code/appImmUnity/exe/ImmUnityPlugin.dll
        if-no-files-found: error

    - name: Upload Viewer Executable
      uses: actions/upload-artifact@v4
      with:
        name: appImmViewer-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          code/appImmViewer/exe/appImmViewer_${{ matrix.configuration }}.exe
          code/appImmViewer/exe/settings.json
        if-no-files-found: error

    - name: Upload Core Libraries
      uses: actions/upload-artifact@v4
      with:
        name: IMM-Libraries-${{ matrix.configuration }}-${{ matrix.platform }}
        path: |
          code/libImmCore/bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.lib
          code/libImmImporter/bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.lib
          code/libImmExporter/bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.lib
          code/libImmPlayer/bin/${{ matrix.platform }}/${{ matrix.configuration }}/*.lib
        if-no-files-found: warn
