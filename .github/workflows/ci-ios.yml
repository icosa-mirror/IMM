---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI iOS Iteration

on:
  workflow_call:
    inputs:
      run_validation:
        description: Run the iOS validation lane when called by the aggregate workflow
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/**
      - experiment/**

permissions:
  contents: read

env:
  UNITY_VERSION: "6000.3.18f1"
  IMM_UNITY_FALLBACK_LICENSE: |
    <?xml version="1.0" encoding="UTF-8"?><root><TimeStamp Value="chxldhvc0zh5Vw=="/>
        <License id="Terms">
            <MachineBindings>
                <Binding Key="1" Value="C372866C-B44C-5E48-806F-7583B55F04FB"/>
                <Binding Key="2" Value="C02F32Y5ML85"/>
            </MachineBindings>
            <MachineID Value="LcL/yxIaeUG12OSX31mKDtxcVx8="/>
            <SerialHash Value="e25c63636985259e763d40cc9253cdfe6a862ceb"/>
            <Features>
                <Feature Value="33"/><Feature Value="1"/><Feature Value="12"/><Feature Value="2"/><Feature Value="24"/><Feature Value="3"/><Feature Value="36"/><Feature Value="17"/><Feature Value="19"/><Feature Value="62"/>
            </Features>
            <DeveloperData Value="AQAAAEY0LUtFWUItMzYyOC0zWEI3LVBZVVEtTUI5VQ=="/>
            <SerialMasked Value="F4-KEYB-3628-3XB7-PYUQ-XXXX"/>
            <StartDate Value="2023-11-21T00:00:00"/>
            <UpdateDate Value="2023-11-22T06:03:23"/>
            <InitialActivationDate Value="2023-11-21T06:03:21"/>
            <LicenseVersion Value="6.x"/>
            <ClientProvidedVersion Value="2017.2.0"/>
            <AlwaysOnline Value="false"/>
            <Entitlements><Entitlement Ns="unity_editor" Tag="UnityPersonal" Type="EDITOR" ValidTo="9999-12-31T00:00:00"/><Entitlement Ns="unity_editor" Tag="DarkSkin" Type="EDITOR_FEATURE" ValidTo="9999-12-31T00:00:00"/></Entitlements>
        </License><Signature xmlns="http://www.w3.org/2000/09/xmldsig#"><SignedInfo><CanonicalizationMethod Algorithm="http://www.w3.org/2001/REC-xml-c14n-20010315#WithComments"/><SignatureMethod Algorithm="http://www.w3.org/2000/09/xmldsig#rsa-sha1"/><Reference URI="#Terms"><Transforms><Transform Algorithm="http://www.w3.org/2000/09/xmldsig#enveloped-signature"/></Transforms><DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha1"/><DigestValue>9DZF11miRAzx7TIuCxih78B6CXU=</DigestValue></Reference></SignedInfo><SignatureValue></SignatureValue></Signature></root>

jobs:
  unity-ios-player-build:
    name: Unity iOS Metal Simulator Validation
    if: inputs.run_validation == true || github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[CI IOS]') && !contains(github.event.head_commit.message, '[CI IOS GODOT]'))
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Build iOS Simulator native libraries
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) simulator_arch=x86_64 ;;
            ARM64) simulator_arch=arm64 ;;
            *) echo "Unsupported macOS runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "SIMULATOR_ARCH=$simulator_arch" >> "$GITHUB_ENV"
          cmake -S code/projects/ios -B build/ios-simulator-native \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$simulator_arch"
          cmake --build build/ios-simulator-native --target ImmStrokeReader --config Release
          cmake --build build/ios-simulator-native --target ImmUnity --config Release
          cp build/ios-simulator-native/unity/libImmUnityPlugin.a code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          cp build/ios-simulator-native/stroke-reader/libImmStrokeReader.a code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a
          test -s code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          test -s code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a
          lipo -info code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          lipo -info code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a

      - name: Restore Unity iOS Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-

      - name: Prepare compact diagnostic artifact
        run: mkdir -p artifacts/unity-ios-player-build

      - name: Export Unity iOS Metal Simulator Xcode project
        id: unity_ios_simulator_export
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          versioning: None
          buildMethod: ImmPlayer.Editor.BuildAutomation.BuildIOSSimulatorCIPlayer
          allowDirtyBuild: true
          cacheUnityInstallationOnMac: true
          customParameters: -logFile ${{ github.workspace }}/artifacts/unity-ios-player-build/unity-editor.log -immIosPlayerPath ${{ github.workspace }}/build/unity-ios-player/simulator-xcode

      - name: Verify generated Unity iOS Simulator project contract
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj/project.pbxproj
          grep -R -q 'libImmUnityPlugin.a' build/unity-ios-player/simulator-xcode
          grep -R -q 'libImmStrokeReader.a' build/unity-ios-player/simulator-xcode
          grep -q 'libz.tbd' build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj/project.pbxproj
          printf '%s\n' 'target=iOS Simulator' 'renderer=Metal' 'scene=Assets/Scenes/SampleScene.unity' 'xrStartup=disabled' 'visualEvidence=required' > artifacts/unity-ios-player-build/generated-project-contract.txt

      - name: Compile generated Unity iOS Simulator application
        id: unity_ios_simulator_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${{ runner.temp }}/unity-ios-simulator-derived-data" \
            ARCHS="$SIMULATOR_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee artifacts/unity-ios-player-build/xcodebuild.log

      - name: Boot deterministic iOS Simulator
        id: ios_simulator_boot
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/unity-ios-player-build/available-simulators.json
          python3 tests/tools/select_ios_simulator.py \
            --input artifacts/unity-ios-player-build/available-simulators.json \
            --output artifacts/unity-ios-player-build/simulator-selection.json
          runtime_id="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["runtime_id"])')"
          simulator_udid="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["udid"])')"
          device_name="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["device_name"])')"
          test -n "$runtime_id"
          test -n "$simulator_udid"
          xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          printf '%s\n' "runtime=$runtime_id" "deviceName=$device_name" "udid=$simulator_udid" > artifacts/unity-ios-player-build/simulator-contract.txt
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Run Unity iOS Metal visual smokes
        id: unity_ios_simulator_smoke
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          artifact_dir="$PWD/artifacts/unity-ios-player-build"
          app="$(find "${{ runner.temp }}/unity-ios-simulator-derived-data/Build/Products" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          container="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$bundle_id" data)"
          capture_dir="$container/Documents/imm-ci"
          mkdir -p "$capture_dir"
          printf '%s\n' "app=$app" "bundleId=$bundle_id" "container=$container" >> "$artifact_dir/simulator-contract.txt"

          run_smoke() {
            local label="$1"
            local capture_name="$2"
            local render_name="$3"
            local capture_path="$capture_dir/$capture_name"
            local render_path="$capture_dir/$render_name"
            local log_path="$artifact_dir/unity-ios-$label-player.log"
            rm -f "$capture_path"
            rm -f "$render_path"
            SIMCTL_CHILD_IMM_UNITY_SMOKE_FREEZE_PLAYBACK=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_OVERLAY_FIXTURE="${IMM_IOS_OVERLAY_FIXTURE:-0}" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_CAPTURE_PATH="$capture_path" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_RENDER_CAPTURE_PATH="$render_path" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_FRAMES=120 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_QUIT=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_COMPOSITION_PROBE=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_OVERLAY_PROBE="${IMM_IOS_OVERLAY_PROBE:-0}" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_MIN_ORDERED_OVERLAY_IMM_UNIQUE_COLORS=3000 \
            SIMCTL_CHILD_IMM_UNITY_EXPECT_GRAPHICS_API=Metal \
            xcrun simctl launch --console --terminate-running-process \
              "$SIMULATOR_UDID" "$bundle_id" > "$log_path" 2>&1 &
            local launch_pid=$!
            local captured=0
            for _ in $(seq 1 240); do
              if [ -s "$capture_path" ] && [ -s "$render_path" ]; then
                captured=1
                break
              fi
              if ! kill -0 "$launch_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            xcrun simctl terminate "$SIMULATOR_UDID" "$bundle_id" >/dev/null 2>&1 || true
            wait "$launch_pid" || true
            test "$captured" -eq 1
            cp "$capture_path" "$artifact_dir/$capture_name"
            cp "$render_path" "$artifact_dir/$render_name"
          }

          unset IMM_IOS_OVERLAY_FIXTURE
          unset IMM_IOS_OVERLAY_PROBE
          run_smoke full-depth unity-ios-metal-full-depth.png unity-ios-metal-render.png
          export IMM_IOS_OVERLAY_FIXTURE=1
          export IMM_IOS_OVERLAY_PROBE=1
          run_smoke ordered-overlay unity-ios-metal-ordered-overlay.png unity-ios-metal-ordered-overlay-render.png

      - name: Shut down iOS Simulator
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Record Unity iOS Metal render metrics
        if: always()
        continue-on-error: true
        run: |
          status=0
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-render.png \
            --reference tests/baselines/render/unity-windows-directx-sample1.png \
            --contract tests/baselines/render/unity-macos-metal-sample1.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-render-metrics.json || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-full-depth.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-full-depth.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-full-depth-metrics.json \
            --diagnostic-overlay-output artifacts/unity-ios-player-build/unity-ios-metal-full-depth-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-ordered-overlay.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-metrics.json \
            --diagnostic-overlay-output artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-diagnostic.png || status=$?
          exit "$status"

      - name: Classify Unity iOS Metal evidence
        if: always()
        run: >
          python3 tests/tools/classify_unity_ios_metal.py
          --artifact-dir artifacts/unity-ios-player-build
          --simulator-outcome "${{ steps.unity_ios_simulator_smoke.outcome }}"
          --output artifacts/unity-ios-player-build/unity-ios-metal-status.json
          --full-depth-status-output artifacts/unity-ios-player-build/full-depth-status.json
          --ordered-overlay-status-output artifacts/unity-ios-player-build/ordered-overlay-status.json

      - name: Write Unity iOS Metal render reports
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-render-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-render.png \
            --output-dir artifacts/unity-ios-player-build/captures/render \
            --markdown-output artifacts/unity-ios-player-build/render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-full-depth-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-full-depth.png \
            --status-json artifacts/unity-ios-player-build/full-depth-status.json \
            --output-dir artifacts/unity-ios-player-build/captures/full-depth \
            --markdown-output artifacts/unity-ios-player-build/full-depth-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay.png \
            --status-json artifacts/unity-ios-player-build/ordered-overlay-status.json \
            --output-dir artifacts/unity-ios-player-build/captures/ordered-overlay \
            --markdown-output artifacts/unity-ios-player-build/ordered-overlay-render-report.md

      - name: Write Unity iOS Metal visual manifest
        if: always()
        run: >
          python3 tests/tools/write_ci_manifest.py
          --status "${{ job.status }}"
          --classification-json artifacts/unity-ios-player-build/unity-ios-metal-status.json
          --output artifacts/unity-ios-player-build/manifest.json
          --product unity
          --platform-name ios
          --mode non-vr
          --renderer metal
          --include artifacts/unity-ios-player-build

      - name: Collect compact diagnostic summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/unity-ios-player-build --require-manifest --output artifacts/unity-ios-player-build/artifact-summary.json

      - name: Save Unity iOS Library cache
        if: always() && steps.cache_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload compact Unity iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityIOSMetalComposition
          path: artifacts/unity-ios-player-build
          if-no-files-found: error
          retention-days: 14

  godot-ios-package:
    name: Godot iOS Package and Metal Validation
    if: inputs.run_validation == true || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[CI IOS GODOT]')
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.6-stable
      GODOT_CPP_REF: godot-4.5-stable
      FTL_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
      FTL_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot iOS build tools
        run: |
          set -euo pipefail
          brew install cmake
          python3 -m venv "$RUNNER_TEMP/imm-godot-ios-scons"
          "$RUNNER_TEMP/imm-godot-ios-scons/bin/python" -m pip install --disable-pip-version-check SCons
          echo "SCONS_PYTHON=$RUNNER_TEMP/imm-godot-ios-scons/bin/python" >> "$GITHUB_ENV"

      - name: Restore Godot iOS native build cache
        id: godot_ios_native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            thirdparty/godot-cpp
            build/godot-ios-native
          key: godot-ios-native-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('code/projects/ios/CMakeLists.txt', 'code/appImmGodotGDExtension/src/**', 'code/appImmGodot/src/**', 'code/appImmShared/src/**') }}
          restore-keys: |
            godot-ios-native-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-

      - name: Build Godot iOS static GDExtension
        id: godot_ios_extension
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-ios-metal
          if [ ! -d thirdparty/godot-cpp/.git ]; then
            git clone --depth 1 --branch "$GODOT_CPP_REF" https://github.com/godotengine/godot-cpp.git thirdparty/godot-cpp
          fi
          "$SCONS_PYTHON" -m SCons -C thirdparty/godot-cpp \
            platform=ios target=template_debug arch=arm64 ios_simulator=no generate_bindings=yes
          godot_cpp_lib="$(find thirdparty/godot-cpp/bin -maxdepth 1 -type f -name 'libgodot-cpp.ios.template_debug*.a' | head -n 1)"
          test -n "$godot_cpp_lib"
          test -s "$godot_cpp_lib"
          cmake -S code/projects/ios -B build/godot-ios-native \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DIMM_GODOT_CPP_ROOT="$PWD/thirdparty/godot-cpp" \
            -DIMM_GODOT_CPP_LIBRARY="$PWD/$godot_cpp_lib"
          cmake --build build/godot-ios-native --target ImmGodotIOSGDExtension --config Debug \
            2>&1 | tee artifacts/godot-ios-metal/native-build.log
          archive="$PWD/build/godot-ios-native/godot/libimm_godot_extension.a"
          framework="$PWD/code/ImmGodotSampleProject/addons/imm_viewer/bin/ios/debug/libimm_godot_extension.ios.template_debug.xcframework"
          test -s "$archive"
          rm -rf "$framework"
          mkdir -p "$(dirname "$framework")"
          xcodebuild -create-xcframework -library "$archive" -output "$framework" \
            2>&1 | tee artifacts/godot-ios-metal/xcframework-build.log
          test -d "$framework"
          find "$framework" -type f -maxdepth 3 -print > artifacts/godot-ios-metal/xcframework-layout.txt
          grep -q 'libimm_godot_extension.a' artifacts/godot-ios-metal/xcframework-layout.txt
          lipo -info "$archive" | tee artifacts/godot-ios-metal/archive-architecture.txt

      - name: Save Godot iOS native build cache
        if: steps.godot_ios_extension.outcome == 'success' && steps.godot_ios_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            thirdparty/godot-cpp
            build/godot-ios-native
          key: godot-ios-native-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('code/projects/ios/CMakeLists.txt', 'code/appImmGodotGDExtension/src/**', 'code/appImmGodot/src/**', 'code/appImmShared/src/**') }}

      - name: Download Godot 4.6 and iOS export templates
        id: godot_ios_tools
        continue-on-error: true
        run: |
          set -euo pipefail
          zip_name="Godot_v${GODOT_VERSION}_macos.universal.zip"
          templates_name="Godot_v${GODOT_VERSION}_export_templates.tpz"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$release_url/$zip_name" -o "$RUNNER_TEMP/$zip_name"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$release_url/$templates_name" -o "$RUNNER_TEMP/$templates_name"
          mkdir -p "$RUNNER_TEMP/godot-ios-editor" "$RUNNER_TEMP/godot-ios-templates"
          unzip -q "$RUNNER_TEMP/$zip_name" -d "$RUNNER_TEMP/godot-ios-editor"
          unzip -q "$RUNNER_TEMP/$templates_name" -d "$RUNNER_TEMP/godot-ios-templates"
          godot_exe="$(find "$RUNNER_TEMP/godot-ios-editor" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -n 1)"
          test -n "$godot_exe"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/4.6.stable"
          mkdir -p "$template_dir"
          cp -R "$RUNNER_TEMP/godot-ios-templates/templates/." "$template_dir/"
          test -s "$template_dir/ios.zip"
          echo "GODOT_IOS_EXE=$godot_exe" >> "$GITHUB_ENV"
          "$godot_exe" --version | tee artifacts/godot-ios-metal/godot-version.txt

      - name: Export ordinary Godot sample to iOS Xcode project
        id: godot_ios_export
        continue-on-error: true
        run: |
          set -euo pipefail
          cp exampleImmFiles/sample1.imm code/ImmGodotSampleProject/sample1.imm
          mkdir -p build/godot-ios-export
          "$GODOT_IOS_EXE" --headless --path code/ImmGodotSampleProject --import \
            > artifacts/godot-ios-metal/godot-import.log 2>&1
          "$GODOT_IOS_EXE" --headless --path code/ImmGodotSampleProject \
            --export-debug "iOS Development" "$PWD/build/godot-ios-export/ImmGodotSample.xcodeproj" \
            > artifacts/godot-ios-metal/godot-export.log 2>&1
          project="$(find build/godot-ios-export -maxdepth 2 -name '*.xcodeproj' -type d | head -n 1)"
          test -n "$project"
          test -f "$project/project.pbxproj"
          grep -R -q 'libimm_godot_extension.ios.template_debug.xcframework' build/godot-ios-export
          echo "GODOT_IOS_XCODE_PROJECT=$PWD/$project" >> "$GITHUB_ENV"
          xcodebuild -project "$project" -list -json > artifacts/godot-ios-metal/xcode-project-list.json

      - name: Compile exported Godot iOS application without signing
        id: godot_ios_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          scheme="$(python3 -c 'import json; d=json.load(open("artifacts/godot-ios-metal/xcode-project-list.json")); print(d["project"]["schemes"][0])')"
          test -n "$scheme"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/godot-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee artifacts/godot-ios-metal/xcodebuild.log
          app="$(find "$RUNNER_TEMP/godot-ios-derived-data/Build/Products" -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -d "$app"
          printf '%s\n' "project=$GODOT_IOS_XCODE_PROJECT" "scheme=$scheme" "app=$app" "renderer=Metal" "mainScene=res://scenes/SampleScene.tscn" > artifacts/godot-ios-metal/application-build-contract.txt
          echo "GODOT_IOS_APP=$app" >> "$GITHUB_ENV"
          echo "GODOT_IOS_SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Package Godot iOS application for Firebase Test Lab
        id: godot_ios_package
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${GODOT_IOS_APP:?missing compiled iOS application}"
          app="$GODOT_IOS_APP"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$bundle_id"
          test -n "$executable"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app" \
            > artifacts/godot-ios-metal/codesign-verify.log 2>&1
          plutil -p "$app/Info.plist" > artifacts/godot-ios-metal/application-info-plist.txt
          file "$app/$executable" > artifacts/godot-ios-metal/application-executable-format.txt
          xcrun vtool -show-build "$app/$executable" > artifacts/godot-ios-metal/application-build-version.txt
          payload="$RUNNER_TEMP/godot-ios-payload/Payload"
          mkdir -p "$payload"
          cp -R "$app" "$payload/"
          ipa="$PWD/artifacts/godot-ios-metal/ImmGodotSample.ipa"
          (cd "$(dirname "$payload")" && ditto -c -k --sequesterRsrc --keepParent Payload "$ipa")
          test -s "$ipa"
          printf '%s\n' \
            "runtime=firebase-test-lab-ios-robo" \
            "bundle_id=$bundle_id" \
            "executable=$executable" \
            "renderer=Metal" \
            > artifacts/godot-ios-metal/runtime-launch-contract.txt
          echo "GODOT_IOS_IPA=$ipa" >> "$GITHUB_ENV"

      - name: Check Firebase Test Lab configuration
        env:
          FTL_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FTL_PROJECT_ID:-}"
          test -n "${FTL_RESULTS_BUCKET:-}"
          test -n "${FTL_SERVICE_ACCOUNT_JSON:-}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Run ordinary Godot iOS sample on Firebase Test Lab
        id: godot_ios_ftl
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          : "${GODOT_IOS_IPA:?missing packaged iOS application}"
          results_dir="imm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-godot-ios-metal"
          echo "FTL_IOS_RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          set +e
          gcloud alpha firebase test ios run \
            --project "$FTL_PROJECT_ID" \
            --type robo \
            --app "$GODOT_IOS_IPA" \
            --robo-script tests/fixtures/firebase/godot_ios_wait.roboscript \
            --timeout 3m \
            --results-bucket "$FTL_RESULTS_BUCKET" \
            --results-dir "$results_dir" \
            --client-details matrixLabel="IMM Godot iOS Metal" \
            --format=json \
            > artifacts/godot-ios-metal/gcloud-firebase-test.stdout.json \
            2> artifacts/godot-ios-metal/gcloud-firebase-test.stderr.txt
          status=$?
          set -e
          printf '%s\n' "$status" > artifacts/godot-ios-metal/gcloud-exit-code.txt
          gcloud storage cp --recursive \
            "gs://${FTL_RESULTS_BUCKET}/${results_dir}" \
            artifacts/godot-ios-metal/ftl-results \
            > artifacts/godot-ios-metal/gcloud-storage-cp.stdout.txt \
            2> artifacts/godot-ios-metal/gcloud-storage-cp.stderr.txt || true
          exit "$status"

      - name: Record Godot iOS Metal render metrics
        id: godot_ios_metrics
        if: always()
        continue-on-error: true
        run: |
          status=0
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-render.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/macos-metal-sample1.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-render-metrics.json || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-full-depth.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-full-depth.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-full-depth-metrics.json \
            --diagnostic-overlay-output artifacts/godot-ios-metal/godot-ios-metal-full-depth-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-ordered-overlay.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-metrics.json \
            --diagnostic-overlay-output artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-sample-play.png \
            --reference tests/baselines/render/godot-windows-vulkan-sample-play.png \
            --contract tests/baselines/render/godot-windows-vulkan-sample-play.json \
            --json-output artifacts/godot-ios-metal/godot-ios-sample-play-metrics.json || status=$?
          exit "$status"

      - name: Classify Godot iOS Metal evidence
        id: godot_ios_classification
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/classify_godot_ios_metal.py \
            --artifact-dir artifacts/godot-ios-metal \
            --runtime-outcome "${{ steps.godot_ios_ftl.outcome }}" \
            --output artifacts/godot-ios-metal/godot-ios-metal-status.json \
            --full-depth-status-output artifacts/godot-ios-metal/full-depth-status.json \
            --ordered-overlay-status-output artifacts/godot-ios-metal/ordered-overlay-status.json

      - name: Write Godot iOS Metal render reports
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-render-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-render.png \
            --output-dir artifacts/godot-ios-metal/captures/render \
            --markdown-output artifacts/godot-ios-metal/render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-full-depth-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-full-depth.png \
            --status-json artifacts/godot-ios-metal/full-depth-status.json \
            --output-dir artifacts/godot-ios-metal/captures/full-depth \
            --markdown-output artifacts/godot-ios-metal/full-depth-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay.png \
            --status-json artifacts/godot-ios-metal/ordered-overlay-status.json \
            --output-dir artifacts/godot-ios-metal/captures/ordered-overlay \
            --markdown-output artifacts/godot-ios-metal/ordered-overlay-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-sample-play-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-sample-play.png \
            --output-dir artifacts/godot-ios-metal/captures/sample-play \
            --markdown-output artifacts/godot-ios-metal/sample-play-render-report.md

      - name: Write Godot iOS package manifest
        if: always()
        run: |
          result=passed
          failure_class=''
          if [ "${{ steps.godot_ios_extension.outcome }}" != success ] || [ "${{ steps.godot_ios_tools.outcome }}" != success ] || [ "${{ steps.godot_ios_export.outcome }}" != success ] || [ "${{ steps.godot_ios_compile.outcome }}" != success ]; then
            result=failed
            failure_class=packaging
          fi
          python3 tests/tools/write_ci_manifest.py \
            --status "$result" \
            --failure-class "$failure_class" \
            --output artifacts/godot-ios-metal/application-build/manifest.json \
            --product godot \
            --platform-name ios \
            --mode application-build \
            --renderer metal \
            --include artifacts/godot-ios-metal/application-build-contract.txt \
            --include artifacts/godot-ios-metal/godot-export.log \
            --include artifacts/godot-ios-metal/xcodebuild.log

      - name: Write Godot iOS Metal visual manifest
        if: always()
        run: |
          python3 tests/tools/write_ci_manifest.py \
            --status "${{ steps.godot_ios_classification.outcome }}" \
            --classification-json artifacts/godot-ios-metal/godot-ios-metal-status.json \
            --output artifacts/godot-ios-metal/manifest.json \
            --product godot \
            --platform-name ios \
            --mode non-vr \
            --renderer metal \
            --include artifacts/godot-ios-metal

      - name: Collect Godot iOS diagnostics
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/godot-ios-metal --require-manifest --output artifacts/godot-ios-metal/artifact-summary.json

      - name: Upload Godot iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GodotIOSMetal
          path: artifacts/godot-ios-metal
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Godot iOS package result
        if: always()
        run: |
          test "${{ steps.godot_ios_extension.outcome }}" = success
          test "${{ steps.godot_ios_tools.outcome }}" = success
          test "${{ steps.godot_ios_export.outcome }}" = success
          test "${{ steps.godot_ios_compile.outcome }}" = success
          test "${{ steps.godot_ios_package.outcome }}" = success
          test "${{ steps.godot_ios_ftl.outcome }}" = success
          test "${{ steps.godot_ios_metrics.outcome }}" = success
          test "${{ steps.godot_ios_classification.outcome }}" = success
