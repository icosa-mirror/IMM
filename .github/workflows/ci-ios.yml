---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI iOS Iteration

on:
  workflow_call:
    inputs:
      run_validation:
        description: Run the iOS validation lane when called by the aggregate workflow
        required: false
        type: boolean
        default: true
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - feature/**
      - experiment/**

permissions:
  contents: read

env:
  UNITY_VERSION: "6000.3.18f1"
  IMM_UNITY_FALLBACK_LICENSE: |
    <?xml version="1.0" encoding="UTF-8"?><root><TimeStamp Value="chxldhvc0zh5Vw=="/>
        <License id="Terms">
            <MachineBindings>
                <Binding Key="1" Value="C372866C-B44C-5E48-806F-7583B55F04FB"/>
                <Binding Key="2" Value="C02F32Y5ML85"/>
            </MachineBindings>
            <MachineID Value="LcL/yxIaeUG12OSX31mKDtxcVx8="/>
            <SerialHash Value="e25c63636985259e763d40cc9253cdfe6a862ceb"/>
            <Features>
                <Feature Value="33"/><Feature Value="1"/><Feature Value="12"/><Feature Value="2"/><Feature Value="24"/><Feature Value="3"/><Feature Value="36"/><Feature Value="17"/><Feature Value="19"/><Feature Value="62"/>
            </Features>
            <DeveloperData Value="AQAAAEY0LUtFWUItMzYyOC0zWEI3LVBZVVEtTUI5VQ=="/>
            <SerialMasked Value="F4-KEYB-3628-3XB7-PYUQ-XXXX"/>
            <StartDate Value="2023-11-21T00:00:00"/>
            <UpdateDate Value="2023-11-22T06:03:23"/>
            <InitialActivationDate Value="2023-11-21T06:03:21"/>
            <LicenseVersion Value="6.x"/>
            <ClientProvidedVersion Value="2017.2.0"/>
            <AlwaysOnline Value="false"/>
            <Entitlements><Entitlement Ns="unity_editor" Tag="UnityPersonal" Type="EDITOR" ValidTo="9999-12-31T00:00:00"/><Entitlement Ns="unity_editor" Tag="DarkSkin" Type="EDITOR_FEATURE" ValidTo="9999-12-31T00:00:00"/></Entitlements>
        </License><Signature xmlns="http://www.w3.org/2000/09/xmldsig#"><SignedInfo><CanonicalizationMethod Algorithm="http://www.w3.org/2001/REC-xml-c14n-20010315#WithComments"/><SignatureMethod Algorithm="http://www.w3.org/2000/09/xmldsig#rsa-sha1"/><Reference URI="#Terms"><Transforms><Transform Algorithm="http://www.w3.org/2000/09/xmldsig#enveloped-signature"/></Transforms><DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha1"/><DigestValue>9DZF11miRAzx7TIuCxih78B6CXU=</DigestValue></Reference></SignedInfo><SignatureValue></SignatureValue></Signature></root>

jobs:
  standalone-ios-metal:
    name: Standalone iOS Metal Validation
    if: inputs.run_validation == true || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[CI IOS STANDALONE]')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare standalone iOS artifact directory
        run: mkdir -p artifacts/standalone-ios-metal

      - name: Configure standalone iOS Simulator application
        id: standalone_ios_configure
        continue-on-error: true
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) simulator_arch=x86_64 ;;
            ARM64) simulator_arch=arm64 ;;
            *) echo "Unsupported macOS runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "STANDALONE_IOS_ARCH=$simulator_arch" >> "$GITHUB_ENV"
          cmake -S code/projects/ios -B build/standalone-ios-simulator \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$simulator_arch" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee artifacts/standalone-ios-metal/cmake-configure.log

      - name: Compile standalone iOS application without signing
        id: standalone_ios_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          cmake --build build/standalone-ios-simulator \
            --target appImmViewerIOS \
            --config Release \
            2>&1 | tee artifacts/standalone-ios-metal/xcodebuild.log
          app="$(find build/standalone-ios-simulator -type d -name appImmViewerIOS.app -print -quit)"
          test -n "$app"
          test -d "$app"
          test -s "$app/sample1.imm"
          test -s "$app/appImmViewerIOS-settings.json"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test -s "$app/$executable"
          test "$bundle_id" = com.immersivefoundation.imm.viewer.ios
          plutil -p "$app/Info.plist" > artifacts/standalone-ios-metal/application-info-plist.txt
          file "$app/$executable" > artifacts/standalone-ios-metal/application-executable.txt
          printf '%s\n' \
            "app=$app" \
            "bundle_id=$bundle_id" \
            "minimum_ios=15.0" \
            "renderer=Metal" \
            "signing=disabled" \
            > artifacts/standalone-ios-metal/application-build-contract.txt
          echo "STANDALONE_IOS_APP=$app" >> "$GITHUB_ENV"
          echo "STANDALONE_IOS_BUNDLE_ID=$bundle_id" >> "$GITHUB_ENV"

      - name: Boot deterministic iOS Simulator for standalone viewer
        id: standalone_ios_boot
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/standalone-ios-metal/available-simulators.json
          python3 tests/tools/select_ios_simulator.py \
            --input artifacts/standalone-ios-metal/available-simulators.json \
            --output artifacts/standalone-ios-metal/simulator-selection.json
          simulator_udid="$(python3 -c 'import json; print(json.load(open("artifacts/standalone-ios-metal/simulator-selection.json"))["udid"])')"
          test -n "$simulator_udid"
          xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          echo "STANDALONE_IOS_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run standalone iOS Metal visual and lifecycle validation
        id: standalone_ios_runtime
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          : "${STANDALONE_IOS_APP:?missing standalone iOS app}"
          : "${STANDALONE_IOS_BUNDLE_ID:?missing standalone iOS bundle identifier}"
          : "${STANDALONE_IOS_UDID:?missing iOS Simulator destination}"
          artifact_dir="$PWD/artifacts/standalone-ios-metal"
          xcrun simctl install "$STANDALONE_IOS_UDID" "$STANDALONE_IOS_APP"
          container="$(xcrun simctl get_app_container "$STANDALONE_IOS_UDID" "$STANDALONE_IOS_BUNDLE_ID" data)"
          test -d "$container"
          xcrun simctl launch --console --terminate-running-process \
            "$STANDALONE_IOS_UDID" "$STANDALONE_IOS_BUNDLE_ID" \
            --imm-ios-validation --imm-ios-lifecycle-smoke \
            > "$artifact_dir/runtime-launch.log" 2>&1 &
          launch_pid=$!
          result_file=''
          for _second in $(seq 1 120); do
            result_file="$(find "$container" -type f -name standalone-ios-result.log -print -quit 2>/dev/null || true)"
            if [ -n "$result_file" ] && [ -s "$result_file" ]; then
              break
            fi
            if ! kill -0 "$launch_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          xcrun simctl spawn "$STANDALONE_IOS_UDID" log show --style compact --last 3m \
            --predicate 'process == "appImmViewerIOS"' \
            > "$artifact_dir/system.log" 2>&1 || true
          capture_file="$(find "$container" -type f -name standalone-ios-metal-render.png -print -quit 2>/dev/null || true)"
          offscreen_file="$(find "$container" -type f -name standalone-ios-metal-offscreen.png -print -quit 2>/dev/null || true)"
          if [ -z "$result_file" ] || [ -z "$capture_file" ] || [ -z "$offscreen_file" ]; then
            xcrun simctl io "$STANDALONE_IOS_UDID" screenshot "$artifact_dir/standalone-ios-simulator-screen.png" || true
          fi
          test -n "$result_file"
          test -s "$result_file"
          test -n "$capture_file"
          test -s "$capture_file"
          test -n "$offscreen_file"
          test -s "$offscreen_file"
          cp "$result_file" "$artifact_dir/standalone-ios-result.log"
          cp "$capture_file" "$artifact_dir/standalone-ios-metal-render.png"
          cp "$offscreen_file" "$artifact_dir/standalone-ios-metal-offscreen.png"
          grep -q '^phase=render status=passed$' "$artifact_dir/standalone-ios-result.log"
          grep -q '^phase=document status=passed path=sample1.imm$' "$artifact_dir/standalone-ios-result.log"
          grep -q '^phase=lifecycle status=passed$' "$artifact_dir/standalone-ios-result.log"
          grep -q 'IMM_IOS_STANDALONE phase=lifecycle status=passed' "$artifact_dir/system.log"
          xcrun simctl terminate "$STANDALONE_IOS_UDID" "$STANDALONE_IOS_BUNDLE_ID" >/dev/null 2>&1 || true
          kill "$launch_pid" 2>/dev/null || true
          wait "$launch_pid" 2>/dev/null || true
          xcrun simctl shutdown "$STANDALONE_IOS_UDID" >/dev/null 2>&1 || true

      - name: Compare standalone iOS Metal render evidence
        id: standalone_ios_metrics
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/compare_render_metrics.py \
            artifacts/standalone-ios-metal/standalone-ios-metal-render.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/ios-standalone-metal-sample1.json \
            --json-output artifacts/standalone-ios-metal/standalone-ios-metal-render-metrics.json

      - name: Write standalone iOS Metal render report
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/standalone-ios-metal/standalone-ios-metal-render-metrics.json \
            --candidate-capture artifacts/standalone-ios-metal/standalone-ios-metal-render.png \
            --output-dir artifacts/standalone-ios-metal/captures/render \
            --markdown-output artifacts/standalone-ios-metal/render-report.md

      - name: Package standalone iOS arm64 release input after visual validation
        id: standalone_ios_package
        if: steps.standalone_ios_runtime.outcome == 'success' && steps.standalone_ios_metrics.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          artifact_dir="$PWD/artifacts/standalone-ios-metal"
          cmake -S code/projects/ios -B build/standalone-ios-device \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            2>&1 | tee "$artifact_dir/device-cmake-configure.log"
          cmake --build build/standalone-ios-device \
            --target appImmViewerIOS \
            --config Release \
            2>&1 | tee "$artifact_dir/device-build.log"
          app="$(find build/standalone-ios-device -type d -name appImmViewerIOS.app -print -quit)"
          test -n "$app"
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -s "$app/$executable"
          file "$app/$executable" | tee "$artifact_dir/device-application-executable.txt"
          grep -q 'arm64' "$artifact_dir/device-application-executable.txt"
          staging="$PWD/build/standalone-ios-device-package"
          rm -rf "$staging"
          mkdir -p "$staging/Payload"
          /usr/bin/ditto "$app" "$staging/Payload/appImmViewerIOS.app"
          ipa="$artifact_dir/appImmViewerIOS-unsigned-arm64.ipa"
          (cd "$staging" && /usr/bin/zip -qry "$ipa" Payload)
          test -s "$ipa"
          unzip -Z1 "$ipa" > "$artifact_dir/device-ipa-contents.txt"
          grep -q '^Payload/appImmViewerIOS.app/Info.plist$' "$artifact_dir/device-ipa-contents.txt"
          printf '%s\n' \
            'platform=iphoneos' \
            'architecture=arm64' \
            'minimum_ios=15.0' \
            'format=ipa' \
            'signing=unsigned-release-input' \
            > "$artifact_dir/device-release-package-contract.txt"

      - name: Write standalone iOS Metal visual manifest
        if: always()
        run: |
          result=passed
          failure_class=''
          if [ "${{ steps.standalone_ios_configure.outcome }}" != success ] || [ "${{ steps.standalone_ios_compile.outcome }}" != success ]; then
            result=failed
            failure_class=build
          elif [ "${{ steps.standalone_ios_boot.outcome }}" != success ]; then
            result=failed
            failure_class=infrastructure
          elif [ "${{ steps.standalone_ios_runtime.outcome }}" != success ]; then
            if test -s artifacts/standalone-ios-metal/system.log && \
               grep -q 'IMM_IOS_STANDALONE phase=startup status=passed' artifacts/standalone-ios-metal/system.log && \
               { test ! -s artifacts/standalone-ios-metal/standalone-ios-result.log || \
                 test ! -s artifacts/standalone-ios-metal/standalone-ios-metal-render.png || \
                 test ! -s artifacts/standalone-ios-metal/standalone-ios-metal-offscreen.png; }; then
              result=evidence_incomplete
              failure_class=evidence
            else
              result=failed
              failure_class=runtime
            fi
          elif [ "${{ steps.standalone_ios_metrics.outcome }}" != success ]; then
            if test ! -s artifacts/standalone-ios-metal/standalone-ios-metal-render.png || \
               test ! -s artifacts/standalone-ios-metal/standalone-ios-metal-render-metrics.json; then
              result=evidence_incomplete
              failure_class=evidence
            else
              result=failed
              failure_class=rendering
            fi
          elif [ "${{ steps.standalone_ios_package.outcome }}" != success ]; then
            result=failed
            failure_class=packaging
          fi
          python3 tests/tools/write_ci_manifest.py \
            --status "$result" \
            --failure-class "$failure_class" \
            --output artifacts/standalone-ios-metal/manifest.json \
            --product standalone \
            --platform-name ios \
            --mode non-vr \
            --renderer metal \
            --include artifacts/standalone-ios-metal

      - name: Collect standalone iOS Metal evidence
        if: always()
        run: |
          python3 tests/tools/collect_ci_artifacts.py \
            --artifact-dir artifacts/standalone-ios-metal \
            --require-manifest \
            --output artifacts/standalone-ios-metal/artifact-summary.json

      - name: Upload standalone iOS Metal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSStandaloneMetal
          path: artifacts/standalone-ios-metal
          if-no-files-found: error

      - name: Enforce standalone iOS Metal result
        if: always()
        run: |
          test "${{ steps.standalone_ios_configure.outcome }}" = success
          test "${{ steps.standalone_ios_compile.outcome }}" = success
          test "${{ steps.standalone_ios_boot.outcome }}" = success
          test "${{ steps.standalone_ios_runtime.outcome }}" = success
          test "${{ steps.standalone_ios_metrics.outcome }}" = success
          test "${{ steps.standalone_ios_package.outcome }}" = success

  unity-ios-player-build:
    name: Unity iOS Metal Simulator Validation
    if: inputs.run_validation == true || github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[CI IOS]') && !contains(github.event.head_commit.message, '[CI IOS GODOT]'))
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Build iOS Simulator native libraries
        run: |
          set -euo pipefail
          case "${RUNNER_ARCH}" in
            X64) simulator_arch=x86_64 ;;
            ARM64) simulator_arch=arm64 ;;
            *) echo "Unsupported macOS runner architecture: ${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "SIMULATOR_ARCH=$simulator_arch" >> "$GITHUB_ENV"
          cmake -S code/projects/ios -B build/ios-simulator-native \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="$simulator_arch"
          cmake --build build/ios-simulator-native --target ImmStrokeReader --config Release
          cmake --build build/ios-simulator-native --target ImmUnity --config Release
          cp build/ios-simulator-native/unity/libImmUnityPlugin.a code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          cp build/ios-simulator-native/stroke-reader/libImmStrokeReader.a code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a
          test -s code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          test -s code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a
          lipo -info code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/iOS/libImmUnityPlugin.a
          lipo -info code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader/Plugins/iOS/libImmStrokeReader.a

      - name: Restore Unity iOS Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-

      - name: Prepare compact diagnostic artifact
        run: mkdir -p artifacts/unity-ios-player-build

      - name: Export Unity iOS Metal Simulator Xcode project
        id: unity_ios_simulator_export
        continue-on-error: true
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          versioning: None
          buildMethod: ImmPlayer.Editor.BuildAutomation.BuildIOSSimulatorCIPlayer
          allowDirtyBuild: true
          cacheUnityInstallationOnMac: true
          customParameters: -logFile ${{ github.workspace }}/artifacts/unity-ios-player-build/unity-editor.log -immIosPlayerPath ${{ github.workspace }}/build/unity-ios-player/simulator-xcode

      - name: Verify generated Unity iOS Simulator project contract
        continue-on-error: true
        run: |
          set -euo pipefail
          test -f build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj/project.pbxproj
          grep -R -q 'libImmUnityPlugin.a' build/unity-ios-player/simulator-xcode
          grep -R -q 'libImmStrokeReader.a' build/unity-ios-player/simulator-xcode
          grep -q 'libz.tbd' build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj/project.pbxproj
          printf '%s\n' 'target=iOS Simulator' 'renderer=Metal' 'scene=Assets/Scenes/SampleScene.unity' 'xrStartup=disabled' 'visualEvidence=required' > artifacts/unity-ios-player-build/generated-project-contract.txt

      - name: Compile generated Unity iOS Simulator application
        id: unity_ios_simulator_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/unity-ios-player/simulator-xcode/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${{ runner.temp }}/unity-ios-simulator-derived-data" \
            ARCHS="$SIMULATOR_ARCH" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee artifacts/unity-ios-player-build/xcodebuild.log

      - name: Boot deterministic iOS Simulator
        id: ios_simulator_boot
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/unity-ios-player-build/available-simulators.json
          python3 tests/tools/select_ios_simulator.py \
            --input artifacts/unity-ios-player-build/available-simulators.json \
            --output artifacts/unity-ios-player-build/simulator-selection.json
          runtime_id="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["runtime_id"])')"
          simulator_udid="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["udid"])')"
          device_name="$(python3 -c 'import json; print(json.load(open("artifacts/unity-ios-player-build/simulator-selection.json"))["device_name"])')"
          test -n "$runtime_id"
          test -n "$simulator_udid"
          xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          echo "SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"
          printf '%s\n' "runtime=$runtime_id" "deviceName=$device_name" "udid=$simulator_udid" > artifacts/unity-ios-player-build/simulator-contract.txt
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b

      - name: Run Unity iOS Metal visual smokes
        id: unity_ios_simulator_smoke
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          artifact_dir="$PWD/artifacts/unity-ios-player-build"
          app="$(find "${{ runner.temp }}/unity-ios-simulator-derived-data/Build/Products" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -d "$app"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          container="$(xcrun simctl get_app_container "$SIMULATOR_UDID" "$bundle_id" data)"
          capture_dir="$container/Documents/imm-ci"
          mkdir -p "$capture_dir"
          printf '%s\n' "app=$app" "bundleId=$bundle_id" "container=$container" >> "$artifact_dir/simulator-contract.txt"

          run_smoke() {
            local label="$1"
            local capture_name="$2"
            local render_name="$3"
            local capture_path="$capture_dir/$capture_name"
            local render_path="$capture_dir/$render_name"
            local log_path="$artifact_dir/unity-ios-$label-player.log"
            rm -f "$capture_path"
            rm -f "$render_path"
            SIMCTL_CHILD_IMM_UNITY_SMOKE_FREEZE_PLAYBACK=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_OVERLAY_FIXTURE="${IMM_IOS_OVERLAY_FIXTURE:-0}" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_CAPTURE_PATH="$capture_path" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_RENDER_CAPTURE_PATH="$render_path" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_FRAMES=120 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_QUIT=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_COMPOSITION_PROBE=1 \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_OVERLAY_PROBE="${IMM_IOS_OVERLAY_PROBE:-0}" \
            SIMCTL_CHILD_IMM_UNITY_SMOKE_MIN_ORDERED_OVERLAY_IMM_UNIQUE_COLORS=3000 \
            SIMCTL_CHILD_IMM_UNITY_EXPECT_GRAPHICS_API=Metal \
            xcrun simctl launch --console --terminate-running-process \
              "$SIMULATOR_UDID" "$bundle_id" > "$log_path" 2>&1 &
            local launch_pid=$!
            local captured=0
            for _ in $(seq 1 240); do
              if [ -s "$capture_path" ] && [ -s "$render_path" ]; then
                captured=1
                break
              fi
              if ! kill -0 "$launch_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            xcrun simctl terminate "$SIMULATOR_UDID" "$bundle_id" >/dev/null 2>&1 || true
            wait "$launch_pid" || true
            test "$captured" -eq 1
            cp "$capture_path" "$artifact_dir/$capture_name"
            cp "$render_path" "$artifact_dir/$render_name"
          }

          unset IMM_IOS_OVERLAY_FIXTURE
          unset IMM_IOS_OVERLAY_PROBE
          run_smoke full-depth unity-ios-metal-full-depth.png unity-ios-metal-render.png
          export IMM_IOS_OVERLAY_FIXTURE=1
          export IMM_IOS_OVERLAY_PROBE=1
          run_smoke ordered-overlay unity-ios-metal-ordered-overlay.png unity-ios-metal-ordered-overlay-render.png

      - name: Shut down iOS Simulator
        if: always()
        continue-on-error: true
        run: |
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR_UDID" || true
          fi

      - name: Record Unity iOS Metal render metrics
        if: always()
        continue-on-error: true
        run: |
          status=0
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-render.png \
            --reference tests/baselines/render/unity-windows-directx-sample1.png \
            --contract tests/baselines/render/unity-macos-metal-sample1.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-render-metrics.json || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-full-depth.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-full-depth.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-full-depth-metrics.json \
            --diagnostic-overlay-output artifacts/unity-ios-player-build/unity-ios-metal-full-depth-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-ordered-overlay.json \
            --json-output artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-metrics.json \
            --diagnostic-overlay-output artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-diagnostic.png || status=$?
          exit "$status"

      - name: Classify Unity iOS Metal evidence
        if: always()
        run: >
          python3 tests/tools/classify_unity_ios_metal.py
          --artifact-dir artifacts/unity-ios-player-build
          --simulator-outcome "${{ steps.unity_ios_simulator_smoke.outcome }}"
          --output artifacts/unity-ios-player-build/unity-ios-metal-status.json
          --full-depth-status-output artifacts/unity-ios-player-build/full-depth-status.json
          --ordered-overlay-status-output artifacts/unity-ios-player-build/ordered-overlay-status.json

      - name: Write Unity iOS Metal render reports
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-render-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-render.png \
            --output-dir artifacts/unity-ios-player-build/captures/render \
            --markdown-output artifacts/unity-ios-player-build/render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-full-depth-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-full-depth.png \
            --status-json artifacts/unity-ios-player-build/full-depth-status.json \
            --output-dir artifacts/unity-ios-player-build/captures/full-depth \
            --markdown-output artifacts/unity-ios-player-build/full-depth-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay-metrics.json \
            --candidate-capture artifacts/unity-ios-player-build/unity-ios-metal-ordered-overlay.png \
            --status-json artifacts/unity-ios-player-build/ordered-overlay-status.json \
            --output-dir artifacts/unity-ios-player-build/captures/ordered-overlay \
            --markdown-output artifacts/unity-ios-player-build/ordered-overlay-render-report.md

      - name: Write Unity iOS Metal visual manifest
        if: always()
        run: >
          python3 tests/tools/write_ci_manifest.py
          --status "${{ job.status }}"
          --classification-json artifacts/unity-ios-player-build/unity-ios-metal-status.json
          --output artifacts/unity-ios-player-build/manifest.json
          --product unity
          --platform-name ios
          --mode non-vr
          --renderer metal
          --include artifacts/unity-ios-player-build

      - name: Collect compact diagnostic summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/unity-ios-player-build --require-manifest --output artifacts/unity-ios-player-build/artifact-summary.json

      - name: Save Unity iOS Library cache
        if: always() && steps.cache_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-ios-simulator-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload compact Unity iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityIOSMetalComposition
          path: artifacts/unity-ios-player-build
          if-no-files-found: error
          retention-days: 14

  godot-ios-package:
    name: Godot iOS Package and Metal Validation
    if: inputs.run_validation == true || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[CI IOS GODOT]') || contains(github.event.head_commit.message, '[CI IOS GODOT SIMULATOR]') || contains(github.event.head_commit.message, '[CI IOS GODOT DEVICE]')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT_CPP_REF: godot-4.5-stable
      GODOT_IOS_METAL_SIMULATOR_ENGINE_REF: 4.7.1-stable
      FTL_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
      FTL_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET }}
      FTL_IOS_DEVICE: ${{ vars.FIREBASE_TEST_LAB_IOS_GODOT_DEVICE || 'model=iphonese3,version=18.4,locale=en,orientation=landscape' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot iOS build tools
        run: |
          set -euo pipefail
          brew install cmake
          python3 -m venv "$RUNNER_TEMP/imm-godot-ios-scons"
          "$RUNNER_TEMP/imm-godot-ios-scons/bin/python" -m pip install --disable-pip-version-check SCons
          echo "SCONS_PYTHON=$RUNNER_TEMP/imm-godot-ios-scons/bin/python" >> "$GITHUB_ENV"

      - name: Restore Godot iOS Metal Simulator engine cache
        id: godot_ios_metal_simulator_engine_cache
        uses: actions/cache/restore@v4
        with:
          path: build/godot-ios-metal-simulator-engine/libgodot.a
          key: godot-ios-metal-simulator-engine-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_IOS_METAL_SIMULATOR_ENGINE_REF }}-simulator-present-fallback-v3

      - name: Build Godot arm64 iOS Simulator engine with Metal
        id: godot_ios_metal_simulator_engine
        run: |
          set -euo pipefail
          artifact_dir="$PWD/artifacts/godot-ios-metal"
          engine_dir="$PWD/build/godot-ios-metal-simulator-engine"
          engine_archive="$engine_dir/libgodot.a"
          mkdir -p "$artifact_dir" "$engine_dir"
          if [ ! -s "$engine_archive" ]; then
            source_dir="$RUNNER_TEMP/godot-ios-metal-simulator-source"
            git clone --depth 1 --branch "$GODOT_IOS_METAL_SIMULATOR_ENGINE_REF" \
              https://github.com/godotengine/godot.git "$source_dir"
            python3 - "$source_dir/platform/ios/detect.py" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          guard = re.compile(
              r'(?m)^(?P<indent>[ \t]*)if env\["metal"\] and env\["simulator"\]:\r?\n'
              r'(?P=indent)[ \t]+print_warning\([^\n]+\)\r?\n'
              r'(?P=indent)[ \t]+env\["metal"\] = False\r?\n'
          )
          matches = list(guard.finditer(source))
          if len(matches) != 1:
              raise SystemExit("Godot iOS Metal Simulator guard did not match exactly once")
          indent = matches[0].group("indent")
          replacement = (
              f'{indent}if env["metal"] and env["simulator"]:\n'
              f'{indent}    print_warning("IMM simulator probe: retaining the Metal rendering driver")\n'
          )
          patched = guard.sub(replacement, source, count=1)
          if 'env["metal"] = False' in patched:
              raise SystemExit("Godot iOS Metal disable assignment remains after patch")
          path.write_text(patched, encoding="utf-8")
          PY
            python3 - "$source_dir/drivers/metal/rendering_device_driver_metal.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          needle = "\tif (device_properties->features.highestFamily < MTL::GPUFamilyApple4) {"
          replacement = "\tif (!TARGET_OS_SIMULATOR && device_properties->features.highestFamily < MTL::GPUFamilyApple4) {"
          if source.count(needle) != 1:
              raise SystemExit("Godot Metal Apple4 startup guard did not match exactly once")
          patched = source.replace(needle, replacement, 1)
          if patched.count(replacement) != 1:
              raise SystemExit("Godot Metal Simulator Apple4 bypass was not applied exactly once")
          path.write_text(patched, encoding="utf-8")
          PY
            python3 - "$source_dir/servers/rendering/renderer_rd/storage_rd/texture_storage.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          include_needle = '#include "core/config/engine.h"\n'
          include_replacement = (
              '#include "core/config/engine.h"\n'
              '#if defined(IOS_ENABLED)\n'
              '#include <TargetConditionals.h>\n'
              '#endif\n'
          )
          block_start = '\t{ //create default black cubemap array\n'
          next_block = '\t{ //create default black cubemap\n'
          if source.count(include_needle) != 1:
              raise SystemExit("Godot TextureStorage Engine include did not match exactly once")
          if source.count(block_start) != 1 or source.count(next_block) != 1:
              raise SystemExit("Godot default cube-array texture block boundaries did not match exactly once")
          patched = source.replace(include_needle, include_replacement, 1)
          patched = patched.replace(
              block_start,
              '#if !defined(IOS_ENABLED) || !TARGET_OS_SIMULATOR\n' + block_start,
              1,
          )
          patched = patched.replace(next_block, '#endif\n' + next_block, 1)
          if patched.count('#if !defined(IOS_ENABLED) || !TARGET_OS_SIMULATOR') != 1:
              raise SystemExit("Godot Simulator cube-array fallback omission was not applied exactly once")
          path.write_text(patched, encoding="utf-8")
          PY
            python3 - "$source_dir/drivers/metal/rendering_device_driver_metal3.cpp" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          include_needle = '#include "drivers/metal/rendering_context_driver_metal.h"\n'
          include_replacement = (
              '#include "drivers/metal/rendering_context_driver_metal.h"\n'
              '#include <TargetConditionals.h>\n'
          )
          present_needle = '\t\t\t\t\t\tdr.drawable->presentAfterMinimumDuration(dr.duration);\n'
          present_replacement = (
              '#if TARGET_OS_SIMULATOR\n'
              '\t\t\t\t\t\tdr.drawable->present();\n'
              '#else\n'
              '\t\t\t\t\t\tdr.drawable->presentAfterMinimumDuration(dr.duration);\n'
              '#endif\n'
          )
          if source.count(include_needle) != 1:
              raise SystemExit("Godot Metal3 context include did not match exactly once")
          if source.count(present_needle) != 1:
              raise SystemExit("Godot Metal3 timed-present call did not match exactly once")
          patched = source.replace(include_needle, include_replacement, 1)
          patched = patched.replace(present_needle, present_replacement, 1)
          if patched.count('#if TARGET_OS_SIMULATOR') != 1:
              raise SystemExit("Godot Simulator untimed-present fallback was not applied exactly once")
          path.write_text(patched, encoding="utf-8")
          PY
            "$SCONS_PYTHON" -m SCons -C "$source_dir" \
              platform=ios \
              target=template_debug \
              arch=arm64 \
              ios_simulator=yes \
              metal=yes \
              vulkan=no \
              opengl3=yes \
              2>&1 | tee "$artifact_dir/godot-metal-simulator-engine-build.log"
            built_archive="$(find "$source_dir/bin" -maxdepth 1 -type f -name 'libgodot.ios.template_debug.arm64.simulator.a' -print -quit)"
            test -n "$built_archive"
            test -s "$built_archive"
            cp "$built_archive" "$engine_archive"
          else
            printf '%s\n' "Reused Godot Metal Simulator engine cache: $engine_archive" \
              | tee "$artifact_dir/godot-metal-simulator-engine-build.log"
          fi
          test -s "$engine_archive"
          lipo -info "$engine_archive" | tee "$artifact_dir/godot-metal-simulator-engine-architecture.txt"
          nm -gU "$engine_archive" > "$artifact_dir/godot-metal-simulator-engine-symbols.txt"
          grep -Eq '[[:space:]]_main$' "$artifact_dir/godot-metal-simulator-engine-symbols.txt"
          printf '%s\n' \
            "godot_ref=$GODOT_IOS_METAL_SIMULATOR_ENGINE_REF" \
            "architecture=arm64" \
            "platform=iOS Simulator" \
            "metal_guard=removed-for-runtime-probe" \
            "apple4_startup_guard=physical-only" \
            "image_cube_array_reporting=unchanged" \
            "default_cube_array_fallbacks=omitted-on-simulator" \
            "timed_present=ordinary-present-on-simulator" \
            > "$artifact_dir/godot-metal-simulator-engine-contract.txt"

      - name: Save Godot iOS Metal Simulator engine cache
        if: steps.godot_ios_metal_simulator_engine.outcome == 'success' && steps.godot_ios_metal_simulator_engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/godot-ios-metal-simulator-engine/libgodot.a
          key: godot-ios-metal-simulator-engine-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_IOS_METAL_SIMULATOR_ENGINE_REF }}-simulator-present-fallback-v3

      - name: Restore stock Godot iOS Compatibility Simulator engine cache
        id: godot_ios_compatibility_simulator_engine_cache
        if: contains(github.event.head_commit.message, '[CI IOS GODOT COMPAT]')
        uses: actions/cache/restore@v4
        with:
          path: build/godot-ios-compatibility-simulator-engine/libgodot.a
          key: godot-ios-compatibility-simulator-engine-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_IOS_METAL_SIMULATOR_ENGINE_REF }}-v1

      - name: Build stock Godot arm64 iOS Compatibility Simulator engine
        id: godot_ios_compatibility_simulator_engine
        if: contains(github.event.head_commit.message, '[CI IOS GODOT COMPAT]')
        run: |
          set -euo pipefail
          artifact_dir="$PWD/artifacts/godot-ios-metal"
          engine_dir="$PWD/build/godot-ios-compatibility-simulator-engine"
          engine_archive="$engine_dir/libgodot.a"
          mkdir -p "$artifact_dir" "$engine_dir"
          if [ ! -s "$engine_archive" ]; then
            source_dir="$RUNNER_TEMP/godot-ios-compatibility-simulator-source"
            git clone --depth 1 --branch "$GODOT_IOS_METAL_SIMULATOR_ENGINE_REF" \
              https://github.com/godotengine/godot.git "$source_dir"
            "$SCONS_PYTHON" -m SCons -C "$source_dir" \
              platform=ios \
              target=template_debug \
              arch=arm64 \
              ios_simulator=yes \
              metal=no \
              vulkan=no \
              opengl3=yes \
              2>&1 | tee "$artifact_dir/godot-compatibility-simulator-engine-build.log"
            built_archive="$(find "$source_dir/bin" -maxdepth 1 -type f -name 'libgodot.ios.template_debug.arm64.simulator.a' -print -quit)"
            test -n "$built_archive"
            test -s "$built_archive"
            cp "$built_archive" "$engine_archive"
          else
            printf '%s\n' "Reused stock Godot Compatibility Simulator engine cache: $engine_archive" \
              | tee "$artifact_dir/godot-compatibility-simulator-engine-build.log"
          fi
          test -s "$engine_archive"
          lipo -info "$engine_archive" | tee "$artifact_dir/godot-compatibility-simulator-engine-architecture.txt"
          nm -gU "$engine_archive" > "$artifact_dir/godot-compatibility-simulator-engine-symbols.txt"
          grep -Eq '[[:space:]]_main$' "$artifact_dir/godot-compatibility-simulator-engine-symbols.txt"
          if grep -q 'RenderingDeviceDriverMetal' "$artifact_dir/godot-compatibility-simulator-engine-symbols.txt"; then
            echo "Compatibility-only engine unexpectedly contains the Metal RenderingDevice driver" >&2
            exit 1
          fi
          printf '%s\n' \
            "godot_ref=$GODOT_IOS_METAL_SIMULATOR_ENGINE_REF" \
            "architecture=arm64" \
            "platform=iOS Simulator" \
            "metal=no" \
            "opengl3=yes" \
            > "$artifact_dir/godot-compatibility-simulator-engine-contract.txt"

      - name: Save stock Godot iOS Compatibility Simulator engine cache
        if: contains(github.event.head_commit.message, '[CI IOS GODOT COMPAT]') && steps.godot_ios_compatibility_simulator_engine.outcome == 'success' && steps.godot_ios_compatibility_simulator_engine_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/godot-ios-compatibility-simulator-engine/libgodot.a
          key: godot-ios-compatibility-simulator-engine-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_IOS_METAL_SIMULATOR_ENGINE_REF }}-v1

      - name: Restore Godot iOS native build cache
        id: godot_ios_native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            thirdparty/godot-cpp
            build/godot-ios-native
            build/godot-ios-simulator-native
          key: godot-ios-native-simulator-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('code/projects/ios/CMakeLists.txt', 'code/appImmGodotGDExtension/src/**', 'code/appImmGodot/src/**', 'code/appImmShared/src/**') }}
          restore-keys: |
            godot-ios-native-simulator-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-
            godot-ios-native-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-

      - name: Build Godot iOS static GDExtension
        id: godot_ios_extension
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/godot-ios-metal
          device_archive="$PWD/build/godot-ios-native/godot/libimm_godot_extension.a"
          simulator_archive="$PWD/build/godot-ios-simulator-native/godot/libimm_godot_extension.a"
          if [ ! -d thirdparty/godot-cpp/.git ]; then
            git clone --depth 1 --branch "$GODOT_CPP_REF" https://github.com/godotengine/godot-cpp.git thirdparty/godot-cpp
          fi
          if [ ! -s "$device_archive" ]; then
            "$SCONS_PYTHON" -m SCons -C thirdparty/godot-cpp \
              platform=ios target=template_debug arch=arm64 ios_simulator=no generate_bindings=yes
            godot_cpp_device_lib="$(find thirdparty/godot-cpp/bin -maxdepth 1 -type f -name 'libgodot-cpp.ios.template_debug.arm64.a' -print -quit)"
            test -n "$godot_cpp_device_lib"
            test -s "$godot_cpp_device_lib"
            cmake -S code/projects/ios -B build/godot-ios-native \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DIMM_GODOT_CPP_ROOT="$PWD/thirdparty/godot-cpp" \
              -DIMM_GODOT_CPP_LIBRARY="$PWD/$godot_cpp_device_lib"
            cmake --build build/godot-ios-native --target ImmGodotIOSGDExtension --config Debug \
              2>&1 | tee artifacts/godot-ios-metal/native-build.log
          else
            printf '%s\n' "Reused Godot iOS device cache: $device_archive" \
              | tee artifacts/godot-ios-metal/native-build.log
          fi
          if [ ! -s "$simulator_archive" ]; then
            "$SCONS_PYTHON" -m SCons -C thirdparty/godot-cpp \
              platform=ios target=template_debug arch=arm64 ios_simulator=yes generate_bindings=yes
            godot_cpp_simulator_lib="$(find thirdparty/godot-cpp/bin -maxdepth 1 -type f -name 'libgodot-cpp.ios.template_debug.arm64.simulator.a' -print -quit)"
            test -n "$godot_cpp_simulator_lib"
            test -s "$godot_cpp_simulator_lib"
            cmake -S code/projects/ios -B build/godot-ios-simulator-native \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphonesimulator \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DIMM_GODOT_CPP_ROOT="$PWD/thirdparty/godot-cpp" \
              -DIMM_GODOT_CPP_LIBRARY="$PWD/$godot_cpp_simulator_lib"
            cmake --build build/godot-ios-simulator-native --target ImmGodotIOSGDExtension --config Debug \
              2>&1 | tee artifacts/godot-ios-metal/simulator-native-build.log
          else
            printf '%s\n' "Reused Godot iOS simulator cache: $simulator_archive" \
              | tee artifacts/godot-ios-metal/simulator-native-build.log
          fi
          framework="$PWD/code/ImmGodotSampleProject/addons/imm_viewer/bin/ios/debug/libimm_godot_extension.ios.template_debug.xcframework"
          test -s "$device_archive"
          test -s "$simulator_archive"
          rm -rf "$framework"
          mkdir -p "$(dirname "$framework")"
          xcodebuild -create-xcframework \
            -library "$device_archive" \
            -library "$simulator_archive" \
            -output "$framework" \
            2>&1 | tee artifacts/godot-ios-metal/xcframework-build.log
          test -d "$framework"
          find "$framework" -type f -maxdepth 3 -print > artifacts/godot-ios-metal/xcframework-layout.txt
          grep -q 'libimm_godot_extension.a' artifacts/godot-ios-metal/xcframework-layout.txt
          grep -q 'ios-arm64-simulator' artifacts/godot-ios-metal/xcframework-layout.txt
          lipo -info "$device_archive" | tee artifacts/godot-ios-metal/archive-architecture.txt
          lipo -info "$simulator_archive" | tee artifacts/godot-ios-metal/simulator-archive-architecture.txt

      - name: Save Godot iOS native build cache
        if: steps.godot_ios_extension.outcome == 'success' && steps.godot_ios_native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            thirdparty/godot-cpp
            build/godot-ios-native
            build/godot-ios-simulator-native
          key: godot-ios-native-simulator-xcode16-${{ runner.os }}-${{ runner.arch }}-${{ env.GODOT_CPP_REF }}-${{ hashFiles('code/projects/ios/CMakeLists.txt', 'code/appImmGodotGDExtension/src/**', 'code/appImmGodot/src/**', 'code/appImmShared/src/**') }}

      - name: Download Godot and iOS export templates
        id: godot_ios_tools
        continue-on-error: true
        run: |
          set -euo pipefail
          zip_name="Godot_v${GODOT_VERSION}_macos.universal.zip"
          templates_name="Godot_v${GODOT_VERSION}_export_templates.tpz"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$release_url/$zip_name" -o "$RUNNER_TEMP/$zip_name"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$release_url/$templates_name" -o "$RUNNER_TEMP/$templates_name"
          mkdir -p "$RUNNER_TEMP/godot-ios-editor" "$RUNNER_TEMP/godot-ios-templates"
          unzip -q "$RUNNER_TEMP/$zip_name" -d "$RUNNER_TEMP/godot-ios-editor"
          unzip -q "$RUNNER_TEMP/$templates_name" -d "$RUNNER_TEMP/godot-ios-templates"
          godot_exe="$(find "$RUNNER_TEMP/godot-ios-editor" -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -n 1)"
          test -n "$godot_exe"
          template_version="${GODOT_VERSION/-/.}"
          template_dir="$HOME/Library/Application Support/Godot/export_templates/$template_version"
          mkdir -p "$template_dir"
          cp -R "$RUNNER_TEMP/godot-ios-templates/templates/." "$template_dir/"
          test -s "$template_dir/ios.zip"
          echo "GODOT_IOS_EXE=$godot_exe" >> "$GITHUB_ENV"
          "$godot_exe" --version | tee artifacts/godot-ios-metal/godot-version.txt

      - name: Export ordinary Godot sample to iOS Xcode project
        id: godot_ios_export
        continue-on-error: true
        run: |
          set -euo pipefail
          cp exampleImmFiles/sample1.imm code/ImmGodotSampleProject/sample1.imm
          mkdir -p build/godot-ios-export
          "$GODOT_IOS_EXE" --headless --path code/ImmGodotSampleProject --import \
            > artifacts/godot-ios-metal/godot-import.log 2>&1
          "$GODOT_IOS_EXE" --headless --path code/ImmGodotSampleProject \
            --export-debug "iOS Development" "$PWD/build/godot-ios-export/ImmGodotSample.xcodeproj" \
            > artifacts/godot-ios-metal/godot-export.log 2>&1
          project="$(find build/godot-ios-export -maxdepth 2 -name '*.xcodeproj' -type d | head -n 1)"
          test -n "$project"
          test -f "$project/project.pbxproj"
          grep -R -q 'libimm_godot_extension.ios.template_debug.xcframework' build/godot-ios-export
          echo "GODOT_IOS_XCODE_PROJECT=$PWD/$project" >> "$GITHUB_ENV"
          xcodebuild -project "$project" -list -json > artifacts/godot-ios-metal/xcode-project-list.json

      - name: Install Metal-enabled arm64 Godot engine into Simulator export
        id: godot_ios_metal_simulator_engine_install
        run: |
          set -euo pipefail
          engine_archive="$PWD/build/godot-ios-metal-simulator-engine/libgodot.a"
          test -s "$engine_archive"
          simulator_archives="$(find build/godot-ios-export \
            -type f \
            -name libgodot.a \
            -path '*simulator*' \
            -print)"
          test -n "$simulator_archives"
          while IFS= read -r simulator_archive; do
            cp "$engine_archive" "$simulator_archive"
            lipo -info "$simulator_archive"
          done <<< "$simulator_archives"
          python3 - "$GODOT_IOS_XCODE_PROJECT/project.pbxproj" <<'PY'
          from pathlib import Path
          import sys

          project_file = Path(sys.argv[1])
          export_root = project_file.parent.parent
          dummy_cpp_files = list(export_root.rglob("dummy.cpp"))
          if len(dummy_cpp_files) != 1:
              raise SystemExit(f"Expected exactly one exported dummy.cpp, found {len(dummy_cpp_files)}")
          dummy_cpp = dummy_cpp_files[0]
          bootstrap = dummy_cpp.read_text(encoding="utf-8")
          bootstrap += '''

          extern "C" {
          void *MTLIOErrorDomain = nullptr;
          void *MTLTensorDomain = nullptr;
          }
          '''
          dummy_cpp.write_text(bootstrap, encoding="utf-8")
          print(f"IMM_GODOT_IOS_SIM_METAL shimmed={dummy_cpp}")
          PY
          printf '%s\n' "$simulator_archives" \
            > artifacts/godot-ios-metal/replaced-simulator-engine-archives.txt

      - name: Compile exported Godot iOS application without signing
        id: godot_ios_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          scheme="$(python3 -c 'import json; d=json.load(open("artifacts/godot-ios-metal/xcode-project-list.json")); print(d["project"]["schemes"][0])')"
          test -n "$scheme"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/godot-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee artifacts/godot-ios-metal/xcodebuild.log
          app="$(find "$RUNNER_TEMP/godot-ios-derived-data/Build/Products" -type d -name '*.app' | head -n 1)"
          test -n "$app"
          test -d "$app"
          printf '%s\n' "project=$GODOT_IOS_XCODE_PROJECT" "scheme=$scheme" "app=$app" "renderer=Metal" "mainScene=res://scenes/SampleScene.tscn" > artifacts/godot-ios-metal/application-build-contract.txt
          echo "GODOT_IOS_APP=$app" >> "$GITHUB_ENV"
          echo "GODOT_IOS_SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Probe Apple-silicon iOS-on-Mac runtime
        id: godot_ios_on_mac_probe
        if: ${{ false }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          : "${GODOT_IOS_XCODE_PROJECT:?missing exported Xcode project}"
          : "${GODOT_IOS_SCHEME:?missing exported Xcode scheme}"
          test "$(uname -m)" = arm64

          artifact_dir="$PWD/artifacts/godot-ios-metal"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$GODOT_IOS_SCHEME" \
            -showdestinations \
            > "$artifact_dir/xcode-destinations.txt" 2>&1
          grep -q 'variant:Designed for \[iPad,iPhone\]' "$artifact_dir/xcode-destinations.txt"
          destination_id="$(python3 -c 'import re; text=open("artifacts/godot-ios-metal/xcode-destinations.txt", encoding="utf-8").read(); match=re.search(r"\{ platform:macOS,.*?id:([^,}]+)", text); print(match.group(1).strip() if match else "")')"
          test -n "$destination_id"
          printf '%s\n' \
            "IMM_IOS_ON_MAC_PROBE destination_id=$destination_id" \
            "IMM_IOS_ON_MAC_PROBE host_arch=$(uname -m)" \
            "IMM_IOS_ON_MAC_PROBE host_product=$(sysctl -n hw.model)" \
            > "$artifact_dir/ios-on-mac-probe.log"
          security find-identity -v -p codesigning \
            > "$artifact_dir/codesigning-identities.txt" 2>&1 || true
          xcrun xcdevice list \
            > "$artifact_dir/xcdevice-list.json" 2>&1 || true
          xcrun devicectl list devices \
            > "$artifact_dir/devicectl-devices.txt" 2>&1 || true

          designed_data="$RUNNER_TEMP/godot-ios-designed-for-ipad-derived-data"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$GODOT_IOS_SCHEME" \
            -configuration Debug \
            -destination "id=$destination_id" \
            -derivedDataPath "$designed_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build \
            2>&1 | tee "$artifact_dir/xcodebuild-designed-for-ipad.log"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$GODOT_IOS_SCHEME" \
            -configuration Debug \
            -destination "id=$destination_id" \
            -showBuildSettings \
            > "$artifact_dir/xcodebuild-designed-for-ipad-settings.txt" 2>&1

          app="$(find "$designed_data/Build/Products/Debug-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test -s "$app/$executable"
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=4 "$app" \
            > "$artifact_dir/godot-ios-on-mac-codesign-verify.txt" 2>&1
          codesign -d --verbose=4 --entitlements :- "$app" \
            > "$artifact_dir/godot-ios-on-mac-codesign-details.txt" 2>&1 || true
          file "$app/$executable" > "$artifact_dir/godot-ios-on-mac-executable.txt"
          xcrun vtool -show-build "$app/$executable" \
            > "$artifact_dir/godot-ios-on-mac-build-version.txt"
          plutil -p "$app/Info.plist" > "$artifact_dir/godot-ios-on-mac-info-plist.txt"
          printf '%s\n' \
            "IMM_IOS_ON_MAC_PROBE godot_app=$app" \
            "IMM_IOS_ON_MAC_PROBE godot_bundle_id=$bundle_id" \
            >> "$artifact_dir/ios-on-mac-probe.log"
          echo "GODOT_IOS_ON_MAC_APP=$app" >> "$GITHUB_ENV"

          control_root="$RUNNER_TEMP/imm-ios-on-mac-control"
          control_app="$control_root/ImmIOSOnMacControl.app"
          mkdir -p "$control_app"
          cp tests/fixtures/ios-on-mac-control/main.m "$control_root/main.m"
          cp tests/fixtures/ios-on-mac-control/Info.plist "$control_app/Info.plist"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -isysroot "$sdk" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            "$control_root/main.m" \
            -framework UIKit \
            -framework Foundation \
            -o "$control_app/ImmIOSOnMacControl"
          codesign --force --deep --sign - --timestamp=none "$control_app"
          codesign --verify --deep --strict --verbose=4 "$control_app" \
            > "$artifact_dir/control-ios-on-mac-codesign-verify.txt" 2>&1
          codesign -d --verbose=4 --entitlements :- "$control_app" \
            > "$artifact_dir/control-ios-on-mac-codesign-details.txt" 2>&1 || true
          file "$control_app/ImmIOSOnMacControl" \
            > "$artifact_dir/control-ios-on-mac-executable.txt"
          xcrun vtool -show-build "$control_app/ImmIOSOnMacControl" \
            > "$artifact_dir/control-ios-on-mac-build-version.txt"

          open_status=0
          open -n "$control_app" \
            > "$artifact_dir/control-ios-on-mac-launch.txt" 2>&1 || open_status=$?
          marker=''
          for _second in $(seq 1 20); do
            marker="$(find "$HOME/Library" -type f -name 'imm-ios-on-mac-control.started' -print -quit 2>/dev/null || true)"
            if [ -n "$marker" ] && [ -s "$marker" ]; then
              break
            fi
            sleep 1
          done
          printf '%s\n' \
            "IMM_IOS_ON_MAC_PROBE control_open_status=$open_status" \
            "IMM_IOS_ON_MAC_PROBE control_marker=$marker" \
            >> "$artifact_dir/ios-on-mac-probe.log"
          /usr/bin/log show --last 2m --style compact \
            --predicate 'eventMessage CONTAINS[c] "ImmIOSOnMacControl" OR eventMessage CONTAINS[c] "org.linuxfoundation.imm.iosonmac.control"' \
            > "$artifact_dir/control-ios-on-mac-system.log" 2>&1 || true
          pkill -TERM -x ImmIOSOnMacControl 2>/dev/null || true
          test "$open_status" -eq 0
          test -n "$marker"
          test -s "$marker"

      - name: Run Godot iOS Metal application natively on Apple silicon
        id: godot_ios_on_mac_runtime
        if: steps.godot_ios_on_mac_probe.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          : "${GODOT_IOS_ON_MAC_APP:?missing Designed-for-iPad application}"
          app="$GODOT_IOS_ON_MAC_APP"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$executable"
          artifact_dir="$PWD/artifacts/godot-ios-metal"
          printf '%s\n' \
            "runtime=ios-on-mac" \
            "destination=My Mac (Designed for iPad)" \
            "host_arch=$(uname -m)" \
            "executable=$executable" \
            "renderer=Metal" \
            > "$artifact_dir/runtime-launch-contract.txt"

          /usr/bin/log stream --style compact --level debug --predicate "process == '$executable'" \
            > "$artifact_dir/godot-ios-system.log" 2>&1 &
          system_log_pid=$!
          trap 'kill "$system_log_pid" 2>/dev/null || true' EXIT

          run_app() {
            local label="$1"
            shift
            local launch_log="$artifact_dir/${label}-launch.log"
            local launcher_pid=''
            local status=0
            open -W -n "$app" --args "$@" > "$launch_log" 2>&1 &
            launcher_pid=$!
            for _second in $(seq 1 180); do
              if ! kill -0 "$launcher_pid" 2>/dev/null; then
                set +e
                wait "$launcher_pid"
                status=$?
                set -e
                return "$status"
              fi
              sleep 1
            done
            echo "Timed out waiting for $label" >> "$launch_log"
            pkill -TERM -x "$executable" 2>/dev/null || true
            kill "$launcher_pid" 2>/dev/null || true
            wait "$launcher_pid" 2>/dev/null || true
            return 124
          }

          collect_user_file() {
            local name="$1"
            local destination="$2"
            local source=''
            source="$(find "$HOME/Library" -type f -name "$name" -print -quit 2>/dev/null || true)"
            test -n "$source"
            test -s "$source"
            cp "$source" "$destination"
          }

          runtime_status=0
          run_app godot-ios-full-depth \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=visual-smoke \
            --imm-godot-visual-smoke \
            --imm-godot-visual-smoke-width=1024 \
            --imm-godot-visual-smoke-height=576 \
            --imm-godot-visual-smoke-use-spawn-area=1 \
            --imm-godot-render-graph-depth-composition=1 \
            --imm-godot-visual-smoke-composition-mode=full_depth \
            --imm-godot-visual-smoke-render-png=user://godot-ios-metal-render.png \
            --imm-godot-visual-smoke-png=user://godot-ios-metal-full-depth.png \
            --imm-godot-visual-smoke-result-log=user://godot-ios-full-depth-result.log || runtime_status=$?
          collect_user_file godot-ios-metal-render.png "$artifact_dir/godot-ios-metal-render.png" || runtime_status=1
          collect_user_file godot-ios-metal-full-depth.png "$artifact_dir/godot-ios-metal-full-depth.png" || runtime_status=1
          collect_user_file godot-ios-full-depth-result.log "$artifact_dir/godot-ios-full-depth-result.log" || runtime_status=1

          run_app godot-ios-ordered-overlay \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=visual-smoke \
            --imm-godot-visual-smoke \
            --imm-godot-visual-smoke-width=1024 \
            --imm-godot-visual-smoke-height=576 \
            --imm-godot-visual-smoke-use-spawn-area=1 \
            --imm-godot-render-graph-depth-composition=1 \
            --imm-godot-visual-smoke-composition-mode=ordered_overlay \
            --imm-godot-visual-smoke-render-png=user://godot-ios-metal-ordered-overlay-render.png \
            --imm-godot-visual-smoke-png=user://godot-ios-metal-ordered-overlay.png \
            --imm-godot-visual-smoke-result-log=user://godot-ios-ordered-overlay-result.log || runtime_status=$?
          collect_user_file godot-ios-metal-ordered-overlay-render.png "$artifact_dir/godot-ios-metal-ordered-overlay-render.png" || runtime_status=1
          collect_user_file godot-ios-metal-ordered-overlay.png "$artifact_dir/godot-ios-metal-ordered-overlay.png" || runtime_status=1
          collect_user_file godot-ios-ordered-overlay-result.log "$artifact_dir/godot-ios-ordered-overlay-result.log" || runtime_status=1

          run_app godot-ios-sample-play \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=sample \
            --imm-godot-sample-play-smoke=1 \
            --imm-godot-sample-play-capture=user://godot-ios-sample-play.png \
            --imm-godot-sample-play-log=user://godot-ios-sample-play.log || runtime_status=$?
          collect_user_file godot-ios-sample-play.png "$artifact_dir/godot-ios-sample-play.png" || runtime_status=1
          collect_user_file godot-ios-sample-play.log "$artifact_dir/godot-ios-sample-play.log" || runtime_status=1
          exit "$runtime_status"

      - name: Compile exported Godot iOS Simulator application
        id: godot_ios_simulator_compile
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${GODOT_IOS_XCODE_PROJECT:?missing exported Xcode project}"
          : "${GODOT_IOS_SCHEME:?missing exported Xcode scheme}"
          simulator_data="$RUNNER_TEMP/godot-ios-simulator-derived-data"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$GODOT_IOS_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$simulator_data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            OTHER_LDFLAGS='$(inherited) -framework Metal -framework MetalKit -framework QuartzCore -framework AVFoundation -lz' \
            build \
            2>&1 | tee artifacts/godot-ios-metal/xcodebuild-simulator.log
          app="$(find "$simulator_data/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -s "$app/$executable"
          file "$app/$executable" > artifacts/godot-ios-metal/simulator-application-executable.txt
          xcrun vtool -show-build "$app/$executable" > artifacts/godot-ios-metal/simulator-application-build-version.txt
          plutil -p "$app/Info.plist" > artifacts/godot-ios-metal/simulator-application-info-plist.txt
          printf '%s\n' \
            "app=$app" \
            "renderer=Metal" \
            "runtime=iOS Simulator" \
            > artifacts/godot-ios-metal/simulator-application-build-contract.txt
          echo "GODOT_IOS_SIMULATOR_APP=$app" >> "$GITHUB_ENV"

      - name: Install stock Compatibility engine into Simulator export
        id: godot_ios_compatibility_simulator_engine_install
        if: contains(github.event.head_commit.message, '[CI IOS GODOT COMPAT]')
        run: |
          set -euo pipefail
          engine_archive="$PWD/build/godot-ios-compatibility-simulator-engine/libgodot.a"
          test -s "$engine_archive"
          simulator_archives="$(find build/godot-ios-export \
            -type f \
            -name libgodot.a \
            -path '*simulator*' \
            -print)"
          test -n "$simulator_archives"
          while IFS= read -r simulator_archive; do
            cp "$engine_archive" "$simulator_archive"
            lipo -info "$simulator_archive"
          done <<< "$simulator_archives"
          printf '%s\n' "$simulator_archives" \
            > artifacts/godot-ios-metal/replaced-compatibility-simulator-engine-archives.txt

      - name: Compile stock Godot Compatibility Simulator application
        id: godot_ios_compatibility_simulator_compile
        if: contains(github.event.head_commit.message, '[CI IOS GODOT COMPAT]')
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${GODOT_IOS_XCODE_PROJECT:?missing exported Xcode project}"
          : "${GODOT_IOS_SCHEME:?missing exported Xcode scheme}"
          simulator_data="$RUNNER_TEMP/godot-ios-compatibility-simulator-derived-data"
          xcodebuild \
            -project "$GODOT_IOS_XCODE_PROJECT" \
            -scheme "$GODOT_IOS_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$simulator_data" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            OTHER_LDFLAGS='$(inherited) -framework Metal -framework MetalKit -framework QuartzCore -framework AVFoundation -lz' \
            build \
            2>&1 | tee artifacts/godot-ios-metal/xcodebuild-compatibility-simulator.log
          app="$(find "$simulator_data/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -d "$app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -s "$app/$executable"
          file "$app/$executable" > artifacts/godot-ios-metal/compatibility-simulator-application-executable.txt
          xcrun vtool -show-build "$app/$executable" > artifacts/godot-ios-metal/compatibility-simulator-application-build-version.txt
          printf '%s\n' \
            "app=$app" \
            "renderer=Compatibility" \
            "runtime=iOS Simulator" \
            > artifacts/godot-ios-metal/compatibility-simulator-application-build-contract.txt
          echo "GODOT_IOS_COMPATIBILITY_SIMULATOR_APP=$app" >> "$GITHUB_ENV"

      - name: Boot deterministic iOS Simulator for Godot
        id: godot_ios_simulator_boot
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > artifacts/godot-ios-metal/available-simulators.json
          python3 tests/tools/select_ios_simulator.py \
            --input artifacts/godot-ios-metal/available-simulators.json \
            --output artifacts/godot-ios-metal/simulator-selection.json
          simulator_udid="$(python3 -c 'import json; print(json.load(open("artifacts/godot-ios-metal/simulator-selection.json"))["udid"])')"
          runtime_id="$(python3 -c 'import json; print(json.load(open("artifacts/godot-ios-metal/simulator-selection.json"))["runtime_id"])')"
          device_name="$(python3 -c 'import json; print(json.load(open("artifacts/godot-ios-metal/simulator-selection.json"))["device_name"])')"
          test -n "$simulator_udid"
          xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          printf '%s\n' \
            "udid=$simulator_udid" \
            "runtime=$runtime_id" \
            "device=$device_name" \
            > artifacts/godot-ios-metal/simulator-runtime-contract.txt
          echo "GODOT_IOS_SIMULATOR_UDID=$simulator_udid" >> "$GITHUB_ENV"

      - name: Run pure Godot Compatibility probe in iOS Simulator
        id: godot_ios_compatibility_probe
        if: steps.godot_ios_compatibility_simulator_compile.outcome == 'success' && steps.godot_ios_simulator_boot.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          : "${GODOT_IOS_COMPATIBILITY_SIMULATOR_APP:?missing Compatibility iOS Simulator application}"
          : "${GODOT_IOS_SIMULATOR_UDID:?missing iOS Simulator destination}"
          app="$GODOT_IOS_COMPATIBILITY_SIMULATOR_APP"
          simulator_udid="$GODOT_IOS_SIMULATOR_UDID"
          artifact_dir="$PWD/artifacts/godot-ios-metal"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun simctl uninstall "$simulator_udid" "$bundle_id" >/dev/null 2>&1 || true
          xcrun simctl install "$simulator_udid" "$app"
          container="$(xcrun simctl get_app_container "$simulator_udid" "$bundle_id" data)"
          test -d "$container"
          xcrun simctl launch --console --terminate-running-process \
            "$simulator_udid" "$bundle_id" \
            --rendering-driver opengl3 \
            --rendering-method gl_compatibility \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=compatibility \
            > "$artifact_dir/godot-ios-compatibility-probe-launch.log" 2>&1 &
          launch_pid=$!
          app_pid=''
          for _second in $(seq 1 30); do
            result_file="$(find "$container" -type f -name godot-ios-compatibility-probe-result.log -print -quit)"
            png_file="$(find "$container" -type f -name godot-ios-compatibility-probe.png -print -quit)"
            if [ -n "$result_file" ] && [ -s "$result_file" ] && [ -n "$png_file" ] && [ -s "$png_file" ]; then
              break
            fi
            if [ -z "$app_pid" ]; then
              app_pid="$(sed -nE 's/.*: ([0-9]+)$/\1/p' "$artifact_dir/godot-ios-compatibility-probe-launch.log" | tail -n 1)"
            fi
            if [ "$_second" -eq 10 ]; then
              xcrun simctl io "$simulator_udid" screenshot \
                "$artifact_dir/godot-ios-compatibility-simulator-screen.png" || true
              if [ -n "$app_pid" ]; then
                sample "$app_pid" 5 -file \
                  "$artifact_dir/godot-ios-compatibility-process-sample.txt" || true
              fi
            fi
            if ! kill -0 "$launch_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          xcrun simctl spawn "$simulator_udid" log show --style compact --last 2m \
            --predicate "process == '$executable'" \
            > "$artifact_dir/godot-ios-compatibility-system.log" 2>&1 || true
          xcrun simctl terminate "$simulator_udid" "$bundle_id" >/dev/null 2>&1 || true
          kill "$launch_pid" 2>/dev/null || true
          wait "$launch_pid" 2>/dev/null || true
          result_file="$(find "$container" -type f -name godot-ios-compatibility-probe-result.log -print -quit)"
          png_file="$(find "$container" -type f -name godot-ios-compatibility-probe.png -print -quit)"
          test -n "$result_file"
          test -s "$result_file"
          test -n "$png_file"
          test -s "$png_file"
          cp "$result_file" "$artifact_dir/godot-ios-compatibility-probe-result.log"
          cp "$png_file" "$artifact_dir/godot-ios-compatibility-probe.png"
          grep -q 'phase=capture status=passed' "$artifact_dir/godot-ios-compatibility-probe-result.log"

      - name: Run Godot iOS Metal visual validation in Simulator
        id: godot_ios_runtime
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          : "${GODOT_IOS_SIMULATOR_APP:?missing iOS Simulator application}"
          : "${GODOT_IOS_SIMULATOR_UDID:?missing iOS Simulator destination}"
          app="$GODOT_IOS_SIMULATOR_APP"
          simulator_udid="$GODOT_IOS_SIMULATOR_UDID"
          artifact_dir="$PWD/artifacts/godot-ios-metal"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$bundle_id"
          test -n "$executable"
          xcrun simctl install "$simulator_udid" "$app"
          container="$(xcrun simctl get_app_container "$simulator_udid" "$bundle_id" data)"
          test -d "$container"
          find "$container" -type f -name 'godot-ios-*' -delete
          printf '%s\n' \
            "runtime=iOS Simulator" \
            "udid=$simulator_udid" \
            "bundle_id=$bundle_id" \
            "executable=$executable" \
            "renderer=Metal" \
            "vsync=disabled-for-simulator-present-compatibility" \
            > "$artifact_dir/runtime-launch-contract.txt"

          run_app() {
            local label="$1"
            local expected_result_name="$2"
            shift 2
            local log_path="$artifact_dir/${label}-launch.log"
            local launch_pid=''
            local app_pid=''
            local expected_result=''
            local status=0
            local attempt=0
            for attempt in 1 2; do
              expected_result="$(find "$container" -type f -name "$expected_result_name" -print -quit 2>/dev/null || true)"
              if [ -n "$expected_result" ]; then
                rm -f "$expected_result"
              fi
              if [ "$attempt" -eq 2 ]; then
                log_path="$artifact_dir/${label}-retry-launch.log"
              fi
              xcrun simctl launch --console --terminate-running-process \
                "$simulator_udid" "$bundle_id" "$@" > "$log_path" 2>&1 &
              launch_pid=$!
              status=0
              for _second in $(seq 1 60); do
                expected_result="$(find "$container" -type f -name "$expected_result_name" -print -quit 2>/dev/null || true)"
                if [ -n "$expected_result" ] && [ -s "$expected_result" ]; then
                  cp "$expected_result" "$artifact_dir/$expected_result_name"
                  xcrun simctl terminate "$simulator_udid" "$bundle_id" >/dev/null 2>&1 || true
                  kill "$launch_pid" 2>/dev/null || true
                  wait "$launch_pid" 2>/dev/null || true
                  return 0
                fi
                if ! kill -0 "$launch_pid" 2>/dev/null; then
                  set +e
                  wait "$launch_pid"
                  status=$?
                  set -e
                  if [ "$status" -eq 0 ]; then
                    status=1
                  fi
                  xcrun simctl io "$simulator_udid" screenshot \
                    "$artifact_dir/${label}-early-exit-attempt-${attempt}-screen.png" || true
                  xcrun simctl spawn "$simulator_udid" log show --style compact --last 1m \
                    --predicate "process == '$executable'" \
                    > "$artifact_dir/${label}-early-exit-attempt-${attempt}-system.log" 2>&1 || true
                  break
                fi
                if [ "$_second" -eq 10 ]; then
                  xcrun simctl io "$simulator_udid" screenshot \
                    "$artifact_dir/${label}-simulator-screen.png" || true
                  app_pid="$(pgrep -x "$executable" | tail -n 1 || true)"
                  if [ -n "$app_pid" ]; then
                    sample "$app_pid" 5 -file \
                      "$artifact_dir/${label}-process-sample.txt" || true
                  fi
                  xcrun simctl spawn "$simulator_udid" log show --style compact --last 1m \
                    --predicate "process == '$executable'" \
                    > "$artifact_dir/${label}-system.log" 2>&1 || true
                fi
                sleep 1
              done
              if kill -0 "$launch_pid" 2>/dev/null; then
                echo "Timed out waiting for $label (attempt $attempt)" >> "$log_path"
                status=124
              fi
              xcrun simctl terminate "$simulator_udid" "$bundle_id" >/dev/null 2>&1 || true
              kill "$launch_pid" 2>/dev/null || true
              wait "$launch_pid" 2>/dev/null || true
              if [ "$attempt" -eq 1 ]; then
                sleep 2
              fi
            done
            return "$status"
          }

          collect_user_file() {
            local name="$1"
            local destination="$2"
            local source=''
            if [ -s "$destination" ]; then
              return 0
            fi
            source="$(find "$container" -type f -name "$name" -print -quit 2>/dev/null || true)"
            test -n "$source"
            test -s "$source"
            cp "$source" "$destination"
          }

          runtime_status=0
          run_app godot-ios-full-depth godot-ios-full-depth-result.log \
            --rendering-driver metal \
            --rendering-method mobile \
            --disable-vsync \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=visual-smoke \
            --imm-godot-visual-smoke \
            --imm-godot-visual-renderer-api=4 \
            --imm-godot-visual-smoke-width=1024 \
            --imm-godot-visual-smoke-height=576 \
            --imm-godot-visual-smoke-use-spawn-area=1 \
            --imm-godot-render-graph-depth-composition=1 \
            --imm-godot-visual-smoke-composition-mode=full_depth \
            --imm-godot-visual-smoke-render-png=user://godot-ios-metal-render.png \
            --imm-godot-visual-smoke-png=user://godot-ios-metal-full-depth.png \
            --imm-godot-visual-smoke-result-log=user://godot-ios-full-depth-result.log || runtime_status=$?
          collect_user_file godot-ios-metal-render.png "$artifact_dir/godot-ios-metal-render.png" || runtime_status=1
          collect_user_file godot-ios-metal-full-depth.png "$artifact_dir/godot-ios-metal-full-depth.png" || runtime_status=1
          collect_user_file godot-ios-full-depth-result.log "$artifact_dir/godot-ios-full-depth-result.log" || runtime_status=1

          if [ "$runtime_status" -ne 0 ]; then
            xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
            exit "$runtime_status"
          fi

          run_app godot-ios-ordered-overlay godot-ios-ordered-overlay-result.log \
            --rendering-driver metal \
            --rendering-method mobile \
            --disable-vsync \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=visual-smoke \
            --imm-godot-visual-smoke \
            --imm-godot-visual-renderer-api=4 \
            --imm-godot-visual-smoke-width=1024 \
            --imm-godot-visual-smoke-height=576 \
            --imm-godot-visual-smoke-use-spawn-area=1 \
            --imm-godot-render-graph-depth-composition=1 \
            --imm-godot-visual-smoke-composition-mode=ordered_overlay \
            --imm-godot-visual-smoke-render-png=user://godot-ios-metal-ordered-overlay-render.png \
            --imm-godot-visual-smoke-png=user://godot-ios-metal-ordered-overlay.png \
            --imm-godot-visual-smoke-result-log=user://godot-ios-ordered-overlay-result.log || runtime_status=$?
          collect_user_file godot-ios-metal-ordered-overlay-render.png "$artifact_dir/godot-ios-metal-ordered-overlay-render.png" || runtime_status=1
          collect_user_file godot-ios-metal-ordered-overlay.png "$artifact_dir/godot-ios-metal-ordered-overlay.png" || runtime_status=1
          collect_user_file godot-ios-ordered-overlay-result.log "$artifact_dir/godot-ios-ordered-overlay-result.log" || runtime_status=1

          run_app godot-ios-sample-play godot-ios-sample-play.log \
            --rendering-driver metal \
            --rendering-method mobile \
            --disable-vsync \
            --fixed-fps 30 \
            -- \
            --imm-godot-ci-scene=sample \
            --imm-godot-sample-play-smoke=1 \
            --imm-godot-sample-play-capture=user://godot-ios-sample-play.png \
            --imm-godot-sample-play-log=user://godot-ios-sample-play.log || runtime_status=$?
          collect_user_file godot-ios-sample-play.png "$artifact_dir/godot-ios-sample-play.png" || runtime_status=1
          collect_user_file godot-ios-sample-play.log "$artifact_dir/godot-ios-sample-play.log" || runtime_status=1
          xcrun simctl shutdown "$simulator_udid" >/dev/null 2>&1 || true
          exit "$runtime_status"

      - name: Package Godot iOS application for Firebase Test Lab
        id: godot_ios_package
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${GODOT_IOS_APP:?missing compiled iOS application}"
          app="$GODOT_IOS_APP"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          test -n "$bundle_id"
          test -n "$executable"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              info = plistlib.load(stream)
          capabilities = info.get("UIRequiredDeviceCapabilities", [])
          info["UIRequiredDeviceCapabilities"] = [
              value
              for value in capabilities
              if value != "iphone-ipad-minimum-performance-a12"
          ]
          if "arm64" not in info["UIRequiredDeviceCapabilities"]:
              raise SystemExit("Expected arm64 iOS device capability")
          with path.open("wb") as stream:
              plistlib.dump(info, stream, fmt=plistlib.FMT_BINARY)
          PY
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes array' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0 dict' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLName string org.linuxfoundation.imm.firebase-game-loop' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes array' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string firebase-game-loop' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$app/Info.plist" \
            | grep -qx firebase-game-loop
          codesign --force --deep --sign - --timestamp=none "$app"
          codesign --verify --deep --strict --verbose=2 "$app" \
            > artifacts/godot-ios-metal/codesign-verify.log 2>&1
          codesign -d --verbose=4 "$app" \
            > artifacts/godot-ios-metal/codesign-details.txt 2>&1 || true
          if [ -f "$app/embedded.mobileprovision" ]; then
            security cms -D -i "$app/embedded.mobileprovision" \
              > artifacts/godot-ios-metal/embedded-mobileprovision.plist
          else
            printf '%s\n' 'embedded.mobileprovision=absent' \
              > artifacts/godot-ios-metal/embedded-mobileprovision.txt
          fi
          plutil -p "$app/Info.plist" > artifacts/godot-ios-metal/application-info-plist.txt
          file "$app/$executable" > artifacts/godot-ios-metal/application-executable-format.txt
          xcrun vtool -show-build "$app/$executable" > artifacts/godot-ios-metal/application-build-version.txt
          payload="$RUNNER_TEMP/godot-ios-payload/Payload"
          mkdir -p "$payload"
          cp -R "$app" "$payload/"
          ipa="$PWD/artifacts/godot-ios-metal/ImmGodotSample.ipa"
          (cd "$(dirname "$payload")" && ditto -c -k --sequesterRsrc --keepParent Payload "$ipa")
          test -s "$ipa"
          printf '%s\n' \
            "runtime=firebase-test-lab-ios-game-loop" \
            "bundle_id=$bundle_id" \
            "executable=$executable" \
            "renderer=Metal" \
            > artifacts/godot-ios-metal/runtime-launch-contract.txt
          echo "GODOT_IOS_IPA=$ipa" >> "$GITHUB_ENV"

      - name: Check Firebase Test Lab configuration
        id: godot_ios_ftl_config
        if: steps.godot_ios_package.outcome == 'success' && contains(github.event.head_commit.message, '[CI IOS GODOT DEVICE]')
        env:
          FTL_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "${FTL_PROJECT_ID:-}"
          test -n "${FTL_RESULTS_BUCKET:-}"
          test -n "${FTL_SERVICE_ACCOUNT_JSON:-}"

      - name: Authenticate to Google Cloud
        if: steps.godot_ios_ftl_config.outcome == 'success'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        if: steps.godot_ios_ftl_config.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run ordinary Godot iOS sample on Firebase Test Lab
        id: godot_ios_ftl
        if: steps.godot_ios_ftl_config.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          : "${GODOT_IOS_IPA:?missing packaged iOS application}"
          results_dir="imm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-godot-ios-metal"
          echo "FTL_IOS_RESULTS_DIR=$results_dir" >> "$GITHUB_ENV"
          gcloud firebase test ios models list --format=json \
            > artifacts/godot-ios-metal/firebase-ios-models.json
          gcloud firebase test ios versions list --format=json \
            > artifacts/godot-ios-metal/firebase-ios-versions.json
          printf '%s\n' "$FTL_IOS_DEVICE" \
            > artifacts/godot-ios-metal/firebase-ios-selected-device.txt
          set +e
          gcloud firebase test ios run \
            --project "$FTL_PROJECT_ID" \
            --type game-loop \
            --app "$GODOT_IOS_IPA" \
            --device "$FTL_IOS_DEVICE" \
            --timeout 3m \
            --results-bucket "$FTL_RESULTS_BUCKET" \
            --results-dir "$results_dir" \
            --client-details matrixLabel="IMM Godot iOS Metal" \
            --format=json \
            > artifacts/godot-ios-metal/gcloud-firebase-test.stdout.json \
            2> artifacts/godot-ios-metal/gcloud-firebase-test.stderr.txt
          status=$?
          set -e
          matrix_id="$(grep -Eo 'matrix-[a-z0-9]+' artifacts/godot-ios-metal/gcloud-firebase-test.stderr.txt | head -n 1 || true)"
          if [ -n "$matrix_id" ]; then
            access_token="$(gcloud auth print-access-token)"
            curl -fsS \
              -H "Authorization: Bearer $access_token" \
              "https://testing.googleapis.com/v1/projects/${FTL_PROJECT_ID}/testMatrices/${matrix_id}" \
              > artifacts/godot-ios-metal/firebase-test-matrix.json || true
            if python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/godot-ios-metal/firebase-test-matrix.json")
          if not path.is_file():
              raise SystemExit(1)
          matrix = json.loads(path.read_text(encoding="utf-8"))
          executions = matrix.get("testExecutions", [])
          passed = (
              matrix.get("state") == "FINISHED"
              and matrix.get("outcomeSummary") == "SUCCESS"
              and executions
              and all(item.get("state") == "FINISHED" for item in executions)
          )
          raise SystemExit(0 if passed else 1)
          PY
            then
              status=0
            fi
          fi
          printf '%s\n' "$status" > artifacts/godot-ios-metal/gcloud-exit-code.txt
          mkdir -p artifacts/godot-ios-metal/ftl-results
          gcloud storage cp --recursive \
            "gs://${FTL_RESULTS_BUCKET}/${results_dir}" \
            artifacts/godot-ios-metal/ftl-results \
            > artifacts/godot-ios-metal/gcloud-storage-cp.stdout.txt \
            2> artifacts/godot-ios-metal/gcloud-storage-cp.stderr.txt || true
          exit "$status"

      - name: Record Godot iOS Metal render metrics
        id: godot_ios_metrics
        if: always()
        continue-on-error: true
        run: |
          status=0
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-render.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/godot-ios-metal-sample1.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-render-metrics.json || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-full-depth.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/godot-ios-metal-full-depth.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-full-depth-metrics.json \
            --diagnostic-overlay-output artifacts/godot-ios-metal/godot-ios-metal-full-depth-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/godot-ios-metal-ordered-overlay.json \
            --json-output artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-metrics.json \
            --diagnostic-overlay-output artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-diagnostic.png || status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-ios-metal/godot-ios-sample-play.png \
            --reference tests/baselines/render/godot-windows-vulkan-sample-play.png \
            --contract tests/baselines/render/godot-ios-metal-sample-play.json \
            --json-output artifacts/godot-ios-metal/godot-ios-sample-play-metrics.json || status=$?
          exit "$status"

      - name: Classify Godot iOS Metal evidence
        id: godot_ios_classification
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/classify_godot_ios_metal.py \
            --artifact-dir artifacts/godot-ios-metal \
            --runtime-outcome "${{ steps.godot_ios_runtime.outcome }}" \
            --output artifacts/godot-ios-metal/godot-ios-metal-status.json \
            --full-depth-status-output artifacts/godot-ios-metal/full-depth-status.json \
            --ordered-overlay-status-output artifacts/godot-ios-metal/ordered-overlay-status.json

      - name: Write Godot iOS Metal render reports
        if: always()
        continue-on-error: true
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-render-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-render.png \
            --output-dir artifacts/godot-ios-metal/captures/render \
            --markdown-output artifacts/godot-ios-metal/render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-full-depth-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-full-depth.png \
            --status-json artifacts/godot-ios-metal/full-depth-status.json \
            --output-dir artifacts/godot-ios-metal/captures/full-depth \
            --markdown-output artifacts/godot-ios-metal/full-depth-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-metal-ordered-overlay.png \
            --status-json artifacts/godot-ios-metal/ordered-overlay-status.json \
            --output-dir artifacts/godot-ios-metal/captures/ordered-overlay \
            --markdown-output artifacts/godot-ios-metal/ordered-overlay-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/godot-ios-metal/godot-ios-sample-play-metrics.json \
            --candidate-capture artifacts/godot-ios-metal/godot-ios-sample-play.png \
            --output-dir artifacts/godot-ios-metal/captures/sample-play \
            --markdown-output artifacts/godot-ios-metal/sample-play-render-report.md

      - name: Write Godot iOS package manifest
        if: always()
        run: |
          result=passed
          failure_class=''
          if [ "${{ steps.godot_ios_extension.outcome }}" != success ] || [ "${{ steps.godot_ios_tools.outcome }}" != success ] || [ "${{ steps.godot_ios_export.outcome }}" != success ] || [ "${{ steps.godot_ios_compile.outcome }}" != success ]; then
            result=failed
            failure_class=packaging
          fi
          python3 tests/tools/write_ci_manifest.py \
            --status "$result" \
            --failure-class "$failure_class" \
            --output artifacts/godot-ios-metal/application-build/manifest.json \
            --product godot \
            --platform-name ios \
            --mode application-build \
            --renderer metal \
            --include artifacts/godot-ios-metal/application-build-contract.txt \
            --include artifacts/godot-ios-metal/godot-export.log \
            --include artifacts/godot-ios-metal/xcodebuild.log

      - name: Write Godot iOS Metal visual manifest
        if: always()
        run: |
          python3 tests/tools/write_ci_manifest.py \
            --status "${{ steps.godot_ios_classification.outcome }}" \
            --classification-json artifacts/godot-ios-metal/godot-ios-metal-status.json \
            --output artifacts/godot-ios-metal/manifest.json \
            --product godot \
            --platform-name ios \
            --mode non-vr \
            --renderer metal \
            --include artifacts/godot-ios-metal

      - name: Collect Godot iOS diagnostics
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/godot-ios-metal --require-manifest --output artifacts/godot-ios-metal/artifact-summary.json

      - name: Upload Godot iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GodotIOSMetal
          path: artifacts/godot-ios-metal
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Godot iOS package result
        if: always()
        run: |
          test "${{ steps.godot_ios_extension.outcome }}" = success
          test "${{ steps.godot_ios_tools.outcome }}" = success
          test "${{ steps.godot_ios_export.outcome }}" = success
          test "${{ steps.godot_ios_compile.outcome }}" = success
          test "${{ steps.godot_ios_package.outcome }}" = success
          test "${{ steps.godot_ios_metal_simulator_engine.outcome }}" = success
          test "${{ steps.godot_ios_metal_simulator_engine_install.outcome }}" = success
          test "${{ steps.godot_ios_simulator_compile.outcome }}" = success
          test "${{ steps.godot_ios_simulator_boot.outcome }}" = success
          # The stock Compatibility probe is a diagnostic control. The custom
          # Metal Simulator runtime and its retained visual contracts are the
          # authoritative iOS Godot result.
          if [ "${{ contains(github.event.head_commit.message, '[CI IOS GODOT DEVICE]') }}" = true ]; then
            test "${{ steps.godot_ios_ftl.outcome }}" = success
          fi
          test "${{ steps.godot_ios_runtime.outcome }}" = success
          test "${{ steps.godot_ios_metrics.outcome }}" = success
          test "${{ steps.godot_ios_classification.outcome }}" = success
