      - name: Save Unity PackageCache cache
        if: always() && steps.cache_packagecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Save Unity Library cache
        if: always() && steps.cache_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-windows-vulkan-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload Unity Vulkan smoke player
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsVulkanPlayer
          path: artifacts/unity-windows-vulkan-player/player
          if-no-files-found: error
          retention-days: 1

      - name: Upload Unity Vulkan build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsVulkanPlayerBuildEvidence
          path: artifacts/unity-windows-vulkan-player
          if-no-files-found: ignore
          retention-days: 14

  unity-windows-vulkan-ordered-overlay:
    name: Unity Windows Vulkan Ordered Overlay
    if: inputs.hardware && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: [self-hosted, windows]
    timeout-minutes: 25
    needs: unity-windows-vulkan-player-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Unity Vulkan runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile unity-windows-vulkan --output artifacts\unity-windows-vulkan-ordered-overlay\preflight.json

      - name: Capture Unity Vulkan diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\unity-windows-vulkan-ordered-overlay | Out-Null
          $out = "artifacts\unity-windows-vulkan-ordered-overlay\vulkaninfo.txt"
          $vulkanInfo = Get-Command vulkaninfo -ErrorAction SilentlyContinue
          if (-not $vulkanInfo) {
            "vulkaninfo not found" | Out-File -FilePath $out
            exit 0
          }
          "VK_ICD_FILENAMES=$env:VK_ICD_FILENAMES" | Out-File -FilePath $out
          "VK_DRIVER_FILES=$env:VK_DRIVER_FILES" | Out-File -FilePath $out -Append
          "VK_ADD_DRIVER_FILES=$env:VK_ADD_DRIVER_FILES" | Out-File -FilePath $out -Append
          if ($env:VK_ICD_FILENAMES) {
            "ICD exists=$(Test-Path $env:VK_ICD_FILENAMES)" | Out-File -FilePath $out -Append
            if (Test-Path $env:VK_ICD_FILENAMES) {
              Get-Content -Raw $env:VK_ICD_FILENAMES | Out-File -FilePath $out -Append
            }
          }
          $env:VK_LOADER_DEBUG = "error,warn"
          & $vulkanInfo.Source --summary *>> $out
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $out -Append
          exit 0

      - name: Download Unity Vulkan smoke player
        uses: actions/download-artifact@v4
        with:
          name: UnityWindowsVulkanPlayer
          path: artifacts/unity-windows-vulkan-ordered-overlay/player

      - name: Run Unity Vulkan ordered overlay smoke
        timeout-minutes: 10
        shell: pwsh
        run: |
          $artifactDir = Resolve-Path artifacts\unity-windows-vulkan-ordered-overlay
          $player = Join-Path $artifactDir "player\ImmUnitySmoke.exe"
          if (-not (Test-Path $player)) {
            throw "Unity Vulkan smoke player was not built: $player"
          }
          $capturePath = Join-Path $artifactDir "unity-windows-vulkan-ordered-overlay.png"
          $renderCapturePath = Join-Path $artifactDir "unity-windows-vulkan-render.png"
          $renderPlayerLog = Join-Path $artifactDir "unity-render-player.log"
          $playerLog = Join-Path $artifactDir "unity-player.log"
          $renderPlayerArgs = @(
            "-logFile", $renderPlayerLog,
            "-screen-width", "1280",
            "-screen-height", "720",
            "-screen-fullscreen", "0",
            "-force-vulkan",
            "-immSmokeCapturePath", $renderCapturePath,
            "-immSmokeFrames", "360",
            "-immSmokeQuit", "1",
            "-immSmokeExpectedGraphicsApi", "Vulkan",
            "-immSmokeCompositionProbe", "0"
          )
          $renderProcess = Start-Process -FilePath $player -ArgumentList $renderPlayerArgs -PassThru
          if (-not $renderProcess.WaitForExit(240000)) {
            Stop-Process -Id $renderProcess.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $renderPlayerLog) {
              Get-Content $renderPlayerLog
            }
            throw "Unity Vulkan render-only smoke timed out"
          }
          if (Test-Path $renderPlayerLog) {
            Get-Content $renderPlayerLog
          }
          if (-not (Test-Path $renderCapturePath)) {
            throw "Unity Vulkan render-only capture was not written: $renderCapturePath"
          }
          if ($renderProcess.ExitCode -ne 0) {
            throw "Unity Vulkan render-only smoke failed with exit code $($renderProcess.ExitCode)"
          }
          $env:IMM_UNITY_SMOKE_OVERLAY_FIXTURE = "1"
          $env:IMM_UNITY_SKIP_DOCUMENT_BACKGROUND_COLOR = "1"
          $env:IMM_UNITY_EXPECT_GRAPHICS_API = "Vulkan"
          $playerArgs = @(
            "-logFile", $playerLog,
            "-screen-width", "1280",
            "-screen-height", "720",
            "-screen-fullscreen", "0",
            "-force-vulkan",
            "-immSmokeCapturePath", $capturePath,
            "-immSmokeFrames", "360",
            "-immSmokeQuit", "1",
            "-immSmokeExpectedGraphicsApi", "Vulkan",
            "-immSmokeCompositionProbe", "1",
            "-immSmokeOverlayProbe", "1"
          )
          $process = Start-Process -FilePath $player -ArgumentList $playerArgs -PassThru
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $playerLog) {
              Get-Content $playerLog
            }
            throw "Unity Vulkan ordered overlay smoke timed out"
          }
          if (Test-Path $playerLog) {
            Get-Content $playerLog
          }
          $nativeLog = Join-Path $env:TEMP "Immersive Foundation\IMM Unity Test\imm_player_log.txt"
          if (Test-Path $nativeLog) {
            Copy-Item $nativeLog (Join-Path $artifactDir "imm_player_log.txt") -Force
            Get-Content $nativeLog
          }
          if (-not (Test-Path $capturePath)) {
            throw "Unity Vulkan ordered overlay capture was not written: $capturePath"
          }
          if ($process.ExitCode -ne 0) {
            throw "Unity Vulkan ordered overlay smoke failed with exit code $($process.ExitCode)"
          }

      - name: Classify Unity Vulkan ordered overlay status
        if: always()
        shell: pwsh
        run: >
          python tests\tools\classify_unity_visual_smoke.py
          --log artifacts\unity-windows-vulkan-ordered-overlay\unity-player.log
          --capture artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay.png
          --composition-mode ordered_overlay
          --output artifacts\unity-windows-vulkan-ordered-overlay\composition-status.json

      - name: Write Unity Vulkan ordered overlay report
        if: always()
        shell: pwsh
        run: |
          python tests\tools\compare_render_metrics.py `
            artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-render.png `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\windows-directx-sample1.json `
            --json-output artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-render-metrics.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\tools\compare_render_metrics.py `
            artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay.png `
            --json-output artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay-metrics.json
          python tests\tools\write_render_report.py `
            --metrics-json artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay-metrics.json `
            --candidate-capture artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay.png `
            --status-json artifacts\unity-windows-vulkan-ordered-overlay\composition-status.json `
            --output-dir artifacts\unity-windows-vulkan-ordered-overlay\captures `
            --markdown-output artifacts\unity-windows-vulkan-ordered-overlay\render-report.md
          python tests\tools\write_render_report.py `
            --metrics-json artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-render-metrics.json `
            --candidate-capture artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-render.png `
            --output-dir artifacts\unity-windows-vulkan-ordered-overlay\captures\render `
            --markdown-output artifacts\unity-windows-vulkan-ordered-overlay\render-baseline-report.md

      - name: Stage Unity Vulkan ordered overlay capture evidence
        if: always()
        shell: pwsh
        run: |
          $captureDir = "artifacts\unity-windows-vulkan-ordered-overlay\captures\unity-windows-vulkan-ordered-overlay"
          New-Item -ItemType Directory -Force $captureDir | Out-Null
          if (Test-Path "artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay.png") {
            Copy-Item "artifacts\unity-windows-vulkan-ordered-overlay\unity-windows-vulkan-ordered-overlay.png" (Join-Path $captureDir "unity-windows-vulkan-ordered-overlay.png") -Force
          }

      - name: Verify Unity Vulkan ordered overlay log contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-ordered-overlay\unity-player.log
          --label unity-windows-vulkan-ordered-overlay
          --require "[IMM_UNITY_SMOKE] capture="
          --require "scene composition overlay probe passed"
          --output artifacts\unity-windows-vulkan-ordered-overlay\unity-vulkan-overlay-log-contract.json

      - name: Verify Unity Vulkan ordered overlay render-only log contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-ordered-overlay\unity-render-player.log
          --label unity-windows-vulkan-ordered-overlay-render-only
          --require "[IMM_UNITY_SMOKE] graphics api expected=Vulkan actual=Vulkan"
          --require "[IMM_UNITY_SMOKE] capture="
          --forbid "[IMM_DIAG] Failed to load"
          --forbid "Failed to load from StreamingAssets"
          --output artifacts\unity-windows-vulkan-ordered-overlay\unity-vulkan-overlay-render-log-contract.json

      - name: Verify Unity Vulkan ordered overlay native render contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-ordered-overlay\imm_player_log.txt
          --label unity-windows-vulkan-ordered-overlay-native
          --require "Unity Vulkan host render:"
          --require "rendered=1"
          --require "paintDrawCalls="
          --require "picture360DrawCalls="
          --forbid "Unity Vulkan host render skipped"
          --output artifacts\unity-windows-vulkan-ordered-overlay\unity-vulkan-overlay-native-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class compositing --output artifacts\unity-windows-vulkan-ordered-overlay\manifest.json --product unity --platform-name windows --mode non-vr --renderer vulkan --include artifacts\unity-windows-vulkan-ordered-overlay

      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\unity-windows-vulkan-ordered-overlay --require-manifest --output artifacts\unity-windows-vulkan-ordered-overlay\artifact-summary.json

      - name: Upload Unity Vulkan ordered overlay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsVulkanOrderedOverlay
          path: artifacts/unity-windows-vulkan-ordered-overlay
          if-no-files-found: ignore
          retention-days: 14

