  unity-windows-directx-composition:
    name: Unity Windows DirectX Composition
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unity-windows-directx-player-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Unity DirectX runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile unity-windows-directx --output artifacts\unity-windows-directx-composition\preflight.json

      - name: Prepare Unity DirectX artifact directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\unity-windows-directx-composition | Out-Null

      - name: Download Unity DirectX smoke player
        uses: actions/download-artifact@v4
        with:
          name: UnityWindowsDirectXPlayer
          path: artifacts/unity-windows-directx-composition/player

      - name: Run Unity DirectX composition smoke
        timeout-minutes: 10
        shell: pwsh
        run: |
          $artifactDir = Resolve-Path artifacts\unity-windows-directx-composition
          $player = Join-Path $artifactDir "player\ImmUnitySmoke.exe"
          if (-not (Test-Path $player)) {
            throw "Unity DirectX smoke player was not built: $player"
          }

          function Invoke-UnitySmoke {
            param(
              [string] $CaptureName,
              [string] $LogName,
              [string] $CompositionProbe
            )

            $capturePath = Join-Path $artifactDir $CaptureName
            $playerLog = Join-Path $artifactDir $LogName
            $playerArgs = @(
              "-logFile", $playerLog,
              "-screen-width", "1280",
              "-screen-height", "720",
              "-screen-fullscreen", "0",
              "-force-d3d11",
              "-immSmokeCapturePath", $capturePath,
              "-immSmokeFrames", "360",
              "-immSmokeQuit", "1",
              "-immSmokeCompositionProbe", $CompositionProbe
            )
            $process = Start-Process -FilePath $player -ArgumentList $playerArgs -PassThru
            if (-not $process.WaitForExit(240000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $playerLog) {
                Get-Content $playerLog
              }
              throw "Unity DirectX smoke player timed out for $CaptureName"
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $playerLog) {
                Get-Content $playerLog
              }
              throw "Unity DirectX smoke player failed with exit code $($process.ExitCode) for $CaptureName"
            }
            if (-not (Test-Path $capturePath)) {
              if (Test-Path $playerLog) {
                Get-Content $playerLog
              }
              throw "Unity DirectX smoke capture was not written: $capturePath"
            }
          }

          Invoke-UnitySmoke -CaptureName "unity-windows-directx-render.png" -LogName "unity-render-player.log" -CompositionProbe "0"
          Invoke-UnitySmoke -CaptureName "unity-windows-directx-composition.png" -LogName "unity-player.log" -CompositionProbe "1"

      - name: Classify Unity DirectX composition status
        if: always()
        shell: pwsh
        run: >
          python tests\tools\classify_unity_visual_smoke.py
          --log artifacts\unity-windows-directx-composition\unity-player.log
          --capture artifacts\unity-windows-directx-composition\unity-windows-directx-composition.png
          --composition-mode full_depth
          --output artifacts\unity-windows-directx-composition\composition-status.json

      - name: Compare Unity DirectX render metrics against committed DirectX baseline
        if: always()
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py
          artifacts\unity-windows-directx-composition\unity-windows-directx-render.png
          --reference tests\baselines\render\windows-directx-sample1.ppm
          --contract tests\baselines\render\unity-windows-directx-sample1.json
          --json-output artifacts\unity-windows-directx-composition\unity-windows-directx-composition-metrics.json

      - name: Write Unity DirectX composition report
        if: always()
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\unity-windows-directx-composition\unity-windows-directx-composition-metrics.json
          --reference-capture tests\baselines\render\windows-directx-sample1.ppm
          --candidate-capture artifacts\unity-windows-directx-composition\unity-windows-directx-render.png
          --status-json artifacts\unity-windows-directx-composition\composition-status.json
          --output-dir artifacts\unity-windows-directx-composition\captures
          --markdown-output artifacts\unity-windows-directx-composition\render-report.md

      - name: Verify Unity DirectX composition log contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-directx-composition\unity-player.log
          --label unity-windows-directx-composition
          --require "[IMM_UNITY_SMOKE] capture="
          --output artifacts\unity-windows-directx-composition\unity-composition-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\unity-windows-directx-composition\manifest.json --product unity --platform-name windows --mode non-vr --renderer directx --include artifacts\unity-windows-directx-composition

      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\unity-windows-directx-composition --require-manifest --output artifacts\unity-windows-directx-composition\artifact-summary.json

      - name: Upload Unity DirectX composition artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsDirectXComposition
          path: artifacts/unity-windows-directx-composition
          if-no-files-found: ignore
          retention-days: 14

  unity-windows-vulkan-player-build:
    name: Unity Windows Vulkan Player Build
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unity-windows-native-plugin-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download same-commit Unity native plugin
        uses: actions/download-artifact@v4
        with:
          name: UnityWindowsNativePluginSourceBuild
          path: code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/x86_64

      - name: Restore Unity Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-windows-vulkan-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-windows-vulkan-${{ env.UNITY_VERSION }}-

      - name: Restore Unity PackageCache cache
        id: cache_packagecache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityPackageCache-${{ env.UNITY_VERSION }}-

      - name: Preflight Unity Vulkan runner
        run: python tests/tools/preflight_runner.py --profile unity --output artifacts/unity-windows-vulkan-player/preflight.json

