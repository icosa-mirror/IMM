            Get-Content $renderPlayerLog
          }
          if (-not (Test-Path $renderCapturePath)) {
            throw "Unity Vulkan render-only capture was not written: $renderCapturePath"
          }
          if ($renderProcess.ExitCode -ne 0) {
            throw "Unity Vulkan render-only smoke failed with exit code $($renderProcess.ExitCode)"
          }
          $env:IMM_UNITY_SKIP_DOCUMENT_BACKGROUND_COLOR = "1"
          $env:IMM_UNITY_EXPECT_GRAPHICS_API = "Vulkan"
          $env:IMM_UNITY_VK_USE_HOST_DEPTH = "1"
          $env:IMM_UNITY_VK_HOST_RENDER_PASS_HAS_DEPTH = "1"
          $env:IMM_UNITY_VK_CAMERA_EVENT = "AfterForwardOpaque"
          $playerArgs = @(
            "-logFile", $playerLog,
            "-screen-width", "1280",
            "-screen-height", "720",
            "-screen-fullscreen", "0",
            "-force-vulkan",
            "-immSmokeCapturePath", $capturePath,
            "-immSmokeFrames", "360",
            "-immSmokeQuit", "1",
            "-immSmokeExpectedGraphicsApi", "Vulkan",
            "-immSmokeCompositionProbe", "1"
          )
          $process = Start-Process -FilePath $player -ArgumentList $playerArgs -PassThru
          if (-not $process.WaitForExit(240000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $playerLog) {
              Get-Content $playerLog
            }
            throw "Unity Vulkan full depth smoke timed out"
          }
          if (Test-Path $playerLog) {
            Get-Content $playerLog
          }
          $nativeLog = Join-Path $env:TEMP "Immersive Foundation\IMM Unity Test\imm_player_log.txt"
          if (Test-Path $nativeLog) {
            Copy-Item $nativeLog (Join-Path $artifactDir "imm_player_log.txt") -Force
            Get-Content $nativeLog
          }
          if (-not (Test-Path $capturePath)) {
            throw "Unity Vulkan full depth capture was not written: $capturePath"
          }
          if ($process.ExitCode -ne 0) {
            throw "Unity Vulkan full depth smoke failed with exit code $($process.ExitCode)"
          }

      - name: Classify Unity Vulkan full depth status
        if: always()
        shell: pwsh
        run: >
          python tests\tools\classify_unity_visual_smoke.py
          --log artifacts\unity-windows-vulkan-full-depth\unity-player.log
          --capture artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth.png
          --composition-mode full_depth
          --output artifacts\unity-windows-vulkan-full-depth\composition-status.json

      - name: Write Unity Vulkan full depth report
        if: always()
        shell: pwsh
        run: |
          python tests\tools\compare_render_metrics.py `
            artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-render.png `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\windows-directx-sample1.json `
            --json-output artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-render-metrics.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests\tools\compare_render_metrics.py `
            artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth.png `
            --json-output artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth-metrics.json
          python tests\tools\write_render_report.py `
            --metrics-json artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth-metrics.json `
            --candidate-capture artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth.png `
            --status-json artifacts\unity-windows-vulkan-full-depth\composition-status.json `
            --output-dir artifacts\unity-windows-vulkan-full-depth\captures `
            --markdown-output artifacts\unity-windows-vulkan-full-depth\render-report.md
          python tests\tools\write_render_report.py `
            --metrics-json artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-render-metrics.json `
            --candidate-capture artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-render.png `
            --output-dir artifacts\unity-windows-vulkan-full-depth\captures\render `
            --markdown-output artifacts\unity-windows-vulkan-full-depth\render-baseline-report.md

      - name: Stage Unity Vulkan full depth capture evidence
        if: always()
        shell: pwsh
        run: |
          $captureDir = "artifacts\unity-windows-vulkan-full-depth\captures\unity-windows-vulkan-full-depth"
          New-Item -ItemType Directory -Force $captureDir | Out-Null
          if (Test-Path "artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth.png") {
            Copy-Item "artifacts\unity-windows-vulkan-full-depth\unity-windows-vulkan-full-depth.png" (Join-Path $captureDir "unity-windows-vulkan-full-depth.png") -Force
          }

      - name: Verify Unity Vulkan full depth log contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-full-depth\unity-player.log
          --label unity-windows-vulkan-full-depth
          --require "[IMM_UNITY_SMOKE] capture="
          --require "composition playback freeze documents="
          --require "source=display"
          --require "scene composition probe passed"
          --output artifacts\unity-windows-vulkan-full-depth\unity-vulkan-full-depth-log-contract.json

      - name: Verify Unity Vulkan full depth render-only log contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-full-depth\unity-render-player.log
          --label unity-windows-vulkan-full-depth-render-only
          --require "[IMM_UNITY_SMOKE] graphics api expected=Vulkan actual=Vulkan"
          --require "[IMM_UNITY_SMOKE] capture="
          --forbid "[IMM_DIAG] Failed to load"
          --forbid "Failed to load from StreamingAssets"
          --output artifacts\unity-windows-vulkan-full-depth\unity-vulkan-full-depth-render-log-contract.json

      - name: Verify Unity Vulkan full depth native render contract
        if: always()
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-vulkan-full-depth\imm_player_log.txt
          --label unity-windows-vulkan-full-depth-native
          --require "Vulkan renderer began host render pass frame with host depth"
          --require "hostRenderPassHasDepth=1"
          --require "assumeHostDepth=0"
          --require "Unity Vulkan host render:"
          --require "rendered=1"
          --require "paintDrawCalls="
          --require "picture360DrawCalls="
          --forbid "Unity Vulkan host render skipped"
          --output artifacts\unity-windows-vulkan-full-depth\unity-vulkan-full-depth-native-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class compositing --output artifacts\unity-windows-vulkan-full-depth\manifest.json --product unity --platform-name windows --mode non-vr --renderer vulkan --include artifacts\unity-windows-vulkan-full-depth

      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\unity-windows-vulkan-full-depth --require-manifest --output artifacts\unity-windows-vulkan-full-depth\artifact-summary.json

      - name: Upload Unity Vulkan full depth artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsVulkanFullDepth
          path: artifacts/unity-windows-vulkan-full-depth
          if-no-files-found: ignore
          retention-days: 14

  unity-android-vulkan:
    name: Unity Android Vulkan
    if: >-
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engine-ci') ||
      contains(github.event.pull_request.labels.*.name, 'device-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK for APK re-signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download same-commit Android Unity native plugin
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Unity
          path: artifacts/unity-android-vulkan/native-plugin

      - name: Stage same-commit Android Unity native plugin
        shell: bash
        run: |
          set -euo pipefail
          plugin="$(find artifacts/unity-android-vulkan/native-plugin -name libImmUnityPlugin.so -type f | head -n 1)"
          if [ -z "$plugin" ]; then
            echo "Same-commit Android Unity native plugin was not present in ImmPlayerPlugin-Unity"
            exit 1
          fi
          destination="code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/Android/libs/arm64-v8a/libImmUnityPlugin.so"
          cp "$plugin" "$destination"

      - name: Prepare clean non-XR Unity Android project
        run: >
          python tests/tools/prepare_unity_ci_project.py
          --source code/ImmUnitySampleProject
          --output .ci-workspace/unity-android-vulkan-nonxr

      - name: Restore cached Unity Android Vulkan shell APK
        id: cache_unity_android_vulkan_shell
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/unity-android-vulkan-shell/ImmUnitySmoke.apk
          key: UnityAndroidVulkanShell-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-${{ hashFiles('tests/tools/prepare_unity_ci_project.py', 'code/ImmUnitySampleProject/Assets/**', 'code/ImmUnitySampleProject/Packages/**', 'code/ImmUnitySampleProject/ProjectSettings/**', '!code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/Android/libs/arm64-v8a/libImmUnityPlugin.so') }}

      - name: Restore Unity Android Library cache
        id: cache_unity_android_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: .ci-workspace/unity-android-vulkan-nonxr/Library
          key: UnityLibrary-android-vulkan-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-android-vulkan-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-

      - name: Restore Unity PackageCache cache
        id: cache_unity_android_packagecache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: .ci-workspace/unity-android-vulkan-nonxr/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityPackageCache-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-

      - name: Preflight Unity Android Vulkan runner
        run: python tests/tools/preflight_runner.py --profile unity --output artifacts/unity-android-vulkan/preflight.json

      - name: Build Unity Android Vulkan smoke player
        id: unity_android_vulkan_build
        if: steps.cache_unity_android_vulkan_shell.outputs.cache-hit != 'true'
        timeout-minutes: 30
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: .ci-workspace/unity-android-vulkan-nonxr
          unityVersion: ${{ env.UNITY_ANDROID_VULKAN_VERSION }}
          targetPlatform: Android
          versioning: None
          buildMethod: ImmPlayer.Editor.BuildAutomation.BuildAndroidVulkanSmokePlayer
          customParameters: -logFile /github/workspace/artifacts/unity-android-vulkan/unity-editor.log -immSmokePlayerPath /github/workspace/.ci-cache/unity-android-vulkan-shell/ImmUnitySmoke.apk

      - name: Save Unity Android Vulkan shell APK cache
        if: steps.cache_unity_android_vulkan_shell.outputs.cache-hit != 'true' && steps.unity_android_vulkan_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/unity-android-vulkan-shell/ImmUnitySmoke.apk
          # Reuse the pre-build key. Unity mutates project files during a build,
          # so recomputing hashFiles here would save under an unrestorable key.
          key: ${{ steps.cache_unity_android_vulkan_shell.outputs.cache-primary-key }}

      - name: Inject same-commit plugin into Unity Android Vulkan shell APK
        shell: bash
        run: |
          set -euo pipefail
          shell_apk=".ci-cache/unity-android-vulkan-shell/ImmUnitySmoke.apk"
          plugin="code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/Android/libs/arm64-v8a/libImmUnityPlugin.so"
          # game-ci's Docker container can leave .ci-cache root-owned. Keep all
          # mutable repack/signing files in GitHub's runner-owned temp directory.
          work_dir="${RUNNER_TEMP}/unity-android-vulkan-repack"
          unsigned_apk="$work_dir/ImmUnitySmoke-unsigned.apk"
          aligned_apk="$work_dir/ImmUnitySmoke-aligned.apk"
          output_apk="artifacts/unity-android-vulkan/ImmUnitySmoke.apk"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -z "$build_tools" ] || [ ! -x "$build_tools/zipalign" ] || [ ! -x "$build_tools/apksigner" ]; then
            echo "Android SDK zipalign/apksigner tools were not found"
            exit 1
          fi
          mkdir -p "$work_dir" "$(dirname "$output_apk")"
          python tests/tools/repack_android_native_library.py \
            --input-apk "$shell_apk" \
            --library "$plugin" \
            --entry lib/arm64-v8a/libImmUnityPlugin.so \
            --output-apk "$unsigned_apk"
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned_apk" "$aligned_apk"
          if [ ! -f "$work_dir/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$work_dir/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          "$build_tools/apksigner" sign \
            --ks "$work_dir/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$output_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$output_apk"

      - name: Verify Unity Android APK is non-XR
        shell: bash
        run: |
          set -euo pipefail
          apk="artifacts/unity-android-vulkan/ImmUnitySmoke.apk"
          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          manifest_dump="artifacts/unity-android-vulkan/android-manifest.txt"
          "$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml | tee "$manifest_dump"
          grep -q "android.intent.category.LAUNCHER" "$manifest_dump"
          if grep -Eiq "oculus|openxr|vr\.headtracking|HAND_TRACKING" "$manifest_dump"; then
            echo "Unity Android Vulkan 2D APK still contains XR manifest declarations"
            exit 1
          fi

      - name: Check Firebase Test Lab configuration
        env:
          FTL_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FTL_PROJECT_ID:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_PROJECT_ID"
            missing=1
          fi
          if [ -z "${FTL_RESULTS_BUCKET:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_RESULTS_BUCKET"
            missing=1
          fi
          if [ -z "${FTL_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Missing repository secret FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Firebase Adreno device target
        shell: bash
        run: |
          set -euo pipefail
          model_id="${FTL_UNITY_DEVICE#model=}"
          model_id="${model_id%%,*}"
          gcloud firebase test android models describe "$model_id"

      - name: Install physical-device video validator dependency
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version

      - name: Run Unity Android Vulkan smoke in Firebase Test Lab
        timeout-minutes: 30
        shell: bash
        run: >
          python tests/tools/run_firebase_test_lab_android.py
          --project "$FTL_PROJECT_ID"
          --results-bucket "$FTL_RESULTS_BUCKET"
          --results-dir "imm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-unity-android-vulkan"
          --device "$FTL_UNITY_DEVICE"
          --app artifacts/unity-android-vulkan/ImmUnitySmoke.apk
          --test-type robo
          --robo-script tests/fixtures/firebase/unity_android_vulkan_wait.roboscript
          --artifact-dir artifacts/unity-android-vulkan
          --timeout 5m
          --directory-to-pull /sdcard/Android/data/com.ImmersiveFoundation.IMMUnityTest/files
          --required-marker "[IMM_UNITY_SMOKE] Android Vulkan CI smoke installed"
          --required-marker "[IMM_UNITY_VK_VALIDATION_ARGS_20260731]"
          --required-marker "[IMM_UNITY_SMOKE] graphics api expected=Vulkan actual=Vulkan"
          --required-marker "[IMM_UNITY_VK_QUEUE_20260802] dedicatedQueueAllowed=1"
          --required-marker "[IMM_UNITY_VK_QUEUE_20260802] mode=dedicated queueIndex=1"
          --required-marker "Vulkan renderer initialized with external device"
          --required-marker "[IMM_UNITY_VK_RT_SRC_20260612]"
          --required-marker "source=offscreenRT"
          --required-marker "Vulkan renderer began external image frame"
          --required-marker "Unity Vulkan render:"
          --required-marker "Loaded in CPU"
          --required-marker "Loaded in GPU"
          --required-marker "[IMM_UNITY_SMOKE] render source=unity-vulkan-presented-screen"
          --required-marker "[IMM_UNITY_SMOKE] scene composition probe passed"
          --required-marker "[IMM_UNITY_ANDROID_VK_COMPOSITION_RT_20260801]"
          --required-marker "[IMM_UNITY_VK_ONRENDERIMAGE_20260802]"
          --required-marker "[IMM_UNITY_VK_DEPTH_SAMPLE_20260803]"
          --required-marker "[IMM_UNITY_VK_DEPTH_COMPOSITE_20260803]"
          --required-marker "shader=Unlit/Transparent supported=True"
          --required-marker "[IMM_UNITY_ANDROID_VK_COMPOSITION_HOLD_20260731]"
          --required-marker "[IMM_UNITY_SMOKE] render candidate capture="
          --required-marker "[IMM_UNITY_SMOKE] capture="
          --required-capture-name unity-android-vulkan-render.png
          --required-capture-name unity-android-vulkan.png
          --external-screen-capture-name unity-android-vulkan-robo-final.png
          --client-label "IMM Unity Android Vulkan"

      - name: Record Unity Android Vulkan visual metrics
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          $renderCapture = Get-ChildItem -Path artifacts/unity-android-vulkan/ftl-results -Recurse -Filter unity-android-vulkan-render.png -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($renderCapture) {
            python tests/tools/compare_render_metrics.py $renderCapture.FullName `
              --reference tests/baselines/render/windows-directx-sample1.ppm `
              --contract tests/baselines/render/unity-android-vulkan-sample1.json `
              --json-output artifacts/unity-android-vulkan/unity-android-vulkan-screenshot-metrics.json
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } else {
            '{"passed":false,"errors":["missing Firebase Test Lab unity-android-vulkan-render.png"],"candidate":{}}' | Set-Content -Encoding utf8 artifacts/unity-android-vulkan/unity-android-vulkan-screenshot-metrics.json
            Write-Warning "Missing Firebase Test Lab unity-android-vulkan-render.png"
            $failed = $true
          }

          $compositionCapture = Get-ChildItem -Path artifacts/unity-android-vulkan/ftl-results -Recurse -Filter unity-android-vulkan.png -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($compositionCapture) {
            python tests/tools/compare_render_metrics.py $compositionCapture.FullName `
              --reference tests/baselines/render/windows-directx-sample1.ppm `
              --contract tests/baselines/render/unity-android-vulkan-composition-sample1.json `
              --json-output artifacts/unity-android-vulkan/unity-android-vulkan-composition-metrics.json
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          } else {
            '{"passed":false,"errors":["missing Firebase Test Lab unity-android-vulkan.png"],"candidate":{}}' | Set-Content -Encoding utf8 artifacts/unity-android-vulkan/unity-android-vulkan-composition-metrics.json
            Write-Warning "Missing Firebase Test Lab unity-android-vulkan.png"
            $failed = $true
          }

          $deviceVideo = Get-ChildItem -Path artifacts/unity-android-vulkan/ftl-results -Recurse -Filter video.mp4 -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($deviceVideo) {
            python tests/tools/validate_render_video.py $deviceVideo.FullName `
              --reference tests/baselines/render/windows-directx-sample1.ppm `
              --contract tests/baselines/render/unity-android-vulkan-external-render-sample1.json `
              --capture-output artifacts/unity-android-vulkan/unity-android-vulkan-external-render.png `
              --json-output artifacts/unity-android-vulkan/unity-android-vulkan-external-render-video-validation.json `
              --sample-interval-seconds 2 `
              --minimum-consecutive-frames 2
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            $externalRenderCapture = Get-Item artifacts/unity-android-vulkan/unity-android-vulkan-external-render.png -ErrorAction SilentlyContinue
            if ($externalRenderCapture) {
              python tests/tools/compare_render_metrics.py $externalRenderCapture.FullName `
                --reference tests/baselines/render/windows-directx-sample1.ppm `
                --contract tests/baselines/render/unity-android-vulkan-external-render-sample1.json `
                --json-output artifacts/unity-android-vulkan/unity-android-vulkan-external-render-metrics.json
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }

            python tests/tools/validate_render_video.py $deviceVideo.FullName `
              --reference tests/baselines/render/windows-directx-sample1.ppm `
              --contract tests/baselines/render/unity-android-vulkan-external-sample1.json `
              --capture-output artifacts/unity-android-vulkan/unity-android-vulkan-external.png `
              --json-output artifacts/unity-android-vulkan/unity-android-vulkan-external-video-validation.json `
              --sample-interval-seconds 2 `
              --minimum-consecutive-frames 5
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            $externalCapture = Get-Item artifacts/unity-android-vulkan/unity-android-vulkan-external.png -ErrorAction SilentlyContinue
            if ($externalCapture) {
              python tests/tools/compare_render_metrics.py $externalCapture.FullName `
                --reference tests/baselines/render/windows-directx-sample1.ppm `
                --contract tests/baselines/render/unity-android-vulkan-external-sample1.json `
                --json-output artifacts/unity-android-vulkan/unity-android-vulkan-external-metrics.json
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          } else {
            '{"passed":false,"errors":["missing Firebase physical-device video"],"frames":[]}' | Set-Content -Encoding utf8 artifacts/unity-android-vulkan/unity-android-vulkan-external-render-video-validation.json
            '{"passed":false,"errors":["missing Firebase physical-device video"],"frames":[]}' | Set-Content -Encoding utf8 artifacts/unity-android-vulkan/unity-android-vulkan-external-video-validation.json
            Write-Warning "Missing Firebase physical-device video"
            $failed = $true
          }

          if ($failed) { exit 1 }

      - name: Write Unity Android Vulkan screenshot report
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/unity-android-vulkan/ftl-results -Recurse -Filter unity-android-vulkan-render.png -ErrorAction SilentlyContinue | Select-Object -First 1
          $captureArg = if ($capture) { $capture.FullName } else { "artifacts/unity-android-vulkan/missing-unity-android-vulkan-render.png" }
          python tests/tools/write_render_report.py `
            --metrics-json artifacts/unity-android-vulkan/unity-android-vulkan-screenshot-metrics.json `
            --candidate-capture $captureArg `
            --output-dir artifacts/unity-android-vulkan/captures `
            --markdown-output artifacts/unity-android-vulkan/render-report.md
          $compositionCapture = Get-ChildItem -Path artifacts/unity-android-vulkan/ftl-results -Recurse -Filter unity-android-vulkan.png -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($compositionCapture) {
            New-Item -ItemType Directory -Force artifacts/unity-android-vulkan/captures/composition | Out-Null
            Copy-Item -LiteralPath $compositionCapture.FullName -Destination artifacts/unity-android-vulkan/captures/composition/unity-android-vulkan-composition.png -Force
          }
          $externalRenderCapture = Get-Item artifacts/unity-android-vulkan/unity-android-vulkan-external-render.png -ErrorAction SilentlyContinue
          if ($externalRenderCapture) {
            New-Item -ItemType Directory -Force artifacts/unity-android-vulkan/captures/external-render | Out-Null
            Copy-Item -LiteralPath $externalRenderCapture.FullName -Destination artifacts/unity-android-vulkan/captures/external-render/unity-android-vulkan-external-render.png -Force
          }
          $externalCapture = Get-Item artifacts/unity-android-vulkan/unity-android-vulkan-external.png -ErrorAction SilentlyContinue
          if ($externalCapture) {
            python tests/tools/write_render_report.py `
              --metrics-json artifacts/unity-android-vulkan/unity-android-vulkan-external-metrics.json `
              --candidate-capture $externalCapture.FullName `
              --output-dir artifacts/unity-android-vulkan/captures/external `
              --markdown-output artifacts/unity-android-vulkan/external-render-report.md
          }

      - name: Write CI manifest
        if: always()
        run: python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class compositing --output artifacts/unity-android-vulkan/manifest.json --product unity --platform-name android --mode non-vr --renderer vulkan --include artifacts/unity-android-vulkan

      - name: Collect artifact summary
        if: always()
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/unity-android-vulkan --require-manifest --output artifacts/unity-android-vulkan/artifact-summary.json

      - name: Save Unity PackageCache cache
        if: always() && steps.cache_unity_android_packagecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: .ci-workspace/unity-android-vulkan-nonxr/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Save Unity Android Library cache
        if: always() && steps.cache_unity_android_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: .ci-workspace/unity-android-vulkan-nonxr/Library
          key: UnityLibrary-android-vulkan-${{ env.UNITY_ANDROID_VULKAN_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload Unity Android Vulkan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityAndroidVulkan
          path: artifacts/unity-android-vulkan
          if-no-files-found: ignore
          retention-days: 14

  unity-windows-openxr-vr:
    name: Unity Windows OpenXR VR
    # Keep lane code in place; run only when headset-capable CI is explicitly enabled.
    if: inputs.hardware && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_VR_CHECKS == 'true'
    needs: unity-windows-native-plugin-build
    runs-on: [self-hosted, windows, unity, vr]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download same-commit Windows native plugin
        uses: actions/download-artifact@v4
        with:
          name: UnityWindowsNativePluginSourceBuild
          path: code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/x86_64

      - name: Preflight Unity OpenXR VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile unity-windows-openxr-vr --output artifacts\unity-windows-openxr-vr\preflight.json --require-env UNITY_EXE

      - name: Run Unity OpenXR VR smoke
        timeout-minutes: 25
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\unity-windows-openxr-vr | Out-Null
          $env:IMM_UNITY_EDITOR_SMOKE_CAPTURE_PATH = (Resolve-Path artifacts\unity-windows-openxr-vr).Path + "\unity-windows-openxr-vr.png"
          & $env:UNITY_EXE -batchmode -projectPath code\ImmUnitySampleProject -executeMethod ImmPlayer.Editor.BuildAutomation.RunWindowsOpenXREditorPlayModeSmoke -logFile artifacts\unity-windows-openxr-vr\unity-editor.log
          if ($LASTEXITCODE -ne 0) {
            throw "Unity OpenXR VR smoke failed with exit code $LASTEXITCODE"
          }

      - name: Record Unity OpenXR VR metrics
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py
          artifacts\unity-windows-openxr-vr\unity-windows-openxr-vr.png
          --json-output artifacts\unity-windows-openxr-vr\unity-windows-openxr-vr-metrics.json

      - name: Write Unity OpenXR VR render report
        if: always()
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\unity-windows-openxr-vr\unity-windows-openxr-vr-metrics.json
          --candidate-capture artifacts\unity-windows-openxr-vr\unity-windows-openxr-vr.png
          --output-dir artifacts\unity-windows-openxr-vr\captures
          --markdown-output artifacts\unity-windows-openxr-vr\render-report.md

      - name: Verify Unity OpenXR VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\unity-windows-openxr-vr\unity-editor.log
          --label unity-windows-openxr-vr
          --require "[IMM_UNITY_SMOKE] xr probe passed"
          --require "[IMM_EDITOR_SMOKE] passed:"
          --forbid "[IMM_UNITY_SMOKE] xr probe failed"
          --output artifacts\unity-windows-openxr-vr\unity-openxr-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\unity-windows-openxr-vr\manifest.json --product unity --platform-name windows --mode vr --renderer openxr --include artifacts\unity-windows-openxr-vr

      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\unity-windows-openxr-vr --require-manifest --output artifacts\unity-windows-openxr-vr\artifact-summary.json

      - name: Upload Unity OpenXR VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsOpenXRVR
          path: artifacts/unity-windows-openxr-vr
          if-no-files-found: ignore
          retention-days: 14

  godot-package-import:
    name: Godot Package Import
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Godot local verifier
        env:
          IMM_GODOT_SKIP_NATIVE_SYNTAX: '1'
        run: python code/appImmGodotGDExtension/verify_local.py

      - name: Verify Godot package import harness
        run: >
          python tests/tools/verify_engine_package_import.py godot
          --package code/ImmGodotSampleProject
          --workspace artifacts/GodotPackageImportHarness

      - name: Write CI manifest
        if: always()
        run: python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class api --output artifacts/godot-package-import/manifest.json --product godot --platform-name all --mode package-import --renderer preflight --include code/ImmGodotSampleProject/addons/imm_viewer/imm_viewer.gdextension
      - name: Collect artifact summary
        if: always()
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/godot-package-import --require-manifest --output artifacts/godot-package-import/artifact-summary.json

      - name: Upload Godot package import artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GodotPackageImport
          path: artifacts/godot-package-import
          if-no-files-found: ignore
          retention-days: 14

  engine-evidence-report:
    name: Engine Evidence Report
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'engine-ci') ||
      contains(github.event.pull_request.labels.*.name, 'device-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - unity-windows-native-plugin-build
      - unity-package-import
      - unity-macos-metal-composition
      - unity-windows-directx-player-build
      - unity-windows-directx-composition
      - unity-windows-vulkan-player-build
      - unity-windows-vulkan-ordered-overlay
      - unity-windows-vulkan-full-depth
      - unity-android-vulkan
      - unity-windows-openxr-vr
      - godot-package-import
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download engine artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "Unity*"
          path: artifacts/engine-evidence/input

      - name: Download Godot engine artifacts
        uses: actions/download-artifact@v4
        with:
          name: GodotPackageImport
          path: artifacts/engine-evidence/input/GodotPackageImport

      - name: Verify engine matrix evidence
        run: >
          python tests/tools/verify_matrix_evidence.py tests/matrix_status.json
          --gate-prefix "CI Engine Matrix /"
          --evidence-root artifacts/engine-evidence/input
          --json-output artifacts/engine-evidence/matrix-evidence.json
          --markdown-output artifacts/engine-evidence/matrix-evidence.md

      - name: Write engine visual evidence report
        if: always()
        run: >
          python tests/tools/write_visual_evidence_report.py
          --input-root artifacts/engine-evidence/input
          --output-dir artifacts/engine-evidence/view
          --markdown-output artifacts/engine-evidence/view/ENGINE_VALIDATION_REPORT.md

      - name: Write engine aggregate status manifests
        if: always()
        run: |
          mkdir -p artifacts/engine-evidence/view/status-manifests/unity-non-vr
          unity_status="passed"
          unity_failure_class=""
          for result in \
            "${{ needs.unity-package-import.result }}" \
            "${{ needs.unity-macos-metal-composition.result }}" \
            "${{ needs.unity-windows-directx-player-build.result }}" \
            "${{ needs.unity-windows-directx-composition.result }}" \
            "${{ needs.unity-windows-vulkan-player-build.result }}"
          do
            if [ "$result" = "failure" ]; then
              unity_status="failed"
              unity_failure_class="build"
            elif [ "$result" = "cancelled" ] && [ "$unity_status" != "failed" ]; then
              unity_status="cancelled"
              unity_failure_class="build"
            fi
          done
          if [ "${{ needs.unity-windows-vulkan-ordered-overlay.result }}" = "failure" ]; then
            unity_status="failed"
            unity_failure_class="compositing"
          elif [ "${{ needs.unity-windows-vulkan-ordered-overlay.result }}" = "cancelled" ] && [ "$unity_status" != "failed" ]; then
            unity_status="cancelled"
            unity_failure_class="compositing"
          fi
          if [ "${{ needs.unity-windows-vulkan-full-depth.result }}" = "failure" ]; then
            unity_status="failed"
            unity_failure_class="compositing"
          elif [ "${{ needs.unity-windows-vulkan-full-depth.result }}" = "cancelled" ] && [ "$unity_status" != "failed" ]; then
            unity_status="cancelled"
            unity_failure_class="compositing"
          fi
          if [ "${{ needs.unity-android-vulkan.result }}" = "failure" ]; then
            unity_status="failed"
            unity_failure_class="compositing"
          elif [ "${{ needs.unity-android-vulkan.result }}" = "cancelled" ] && [ "$unity_status" != "failed" ]; then
            unity_status="cancelled"
            unity_failure_class="compositing"
          fi
          if [ "${{ needs.unity-package-import.result }}" != "skipped" ] || \
             [ "${{ needs.unity-macos-metal-composition.result }}" != "skipped" ] || \
             [ "${{ needs.unity-windows-directx-player-build.result }}" != "skipped" ] || \
             [ "${{ needs.unity-windows-directx-composition.result }}" != "skipped" ] || \
             [ "${{ needs.unity-windows-vulkan-player-build.result }}" != "skipped" ] || \
             [ "${{ needs.unity-windows-vulkan-ordered-overlay.result }}" != "skipped" ] || \
             [ "${{ needs.unity-windows-vulkan-full-depth.result }}" != "skipped" ] || \
             [ "${{ needs.unity-android-vulkan.result }}" != "skipped" ]; then
            python tests/tools/write_ci_manifest.py \
              --status "$unity_status" \
              --failure-class "$unity_failure_class" \
              --output artifacts/engine-evidence/view/status-manifests/unity-non-vr/manifest.json \
              --product unity \
              --platform-name all \
              --mode non-vr \
              --renderer native \
              --include artifacts/engine-evidence/view/ENGINE_VALIDATION_REPORT.md
          fi

      - name: Upload engine visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EngineValidationEvidence
          path: artifacts/engine-evidence/view
          if-no-files-found: error
          retention-days: 14

      - name: Upload engine debug artifacts
        if: ${{ always() && vars.CI_VALIDATION_DEBUG_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: EngineMatrixDebugArtifacts
          path: artifacts/engine-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Hide per-lane engine artifacts
        if: ${{ always() && vars.CI_VALIDATION_DEBUG_ARTIFACTS != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python tests/tools/delete_ci_artifacts.py
          --name UnityPackageImport
          --name UnityMacOSMetalComposition
          --name UnityWindowsDirectXPlayer
          --name UnityWindowsDirectXPlayerBuildEvidence
          --name UnityWindowsDirectXComposition
          --name UnityWindowsVulkanPlayer
          --name UnityWindowsVulkanPlayerBuildEvidence
          --name UnityWindowsVulkanOrderedOverlay
          --name UnityWindowsVulkanFullDepth
          --name UnityWindowsOpenXRVR
          --name GodotPackageImport
