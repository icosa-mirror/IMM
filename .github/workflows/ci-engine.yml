---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Engine Matrix

on:
  workflow_call:
    inputs:
      hardware:
        description: Run explicitly requested jobs requiring private hardware.
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

env:
  UNITY_VERSION: "2022.3.62f2"
  UNITY_ANDROID_VULKAN_VERSION: "6000.3.18f1"
  FTL_UNITY_DEVICE: ${{ vars.FIREBASE_TEST_LAB_ANDROID_UNITY_ADRENO_DEVICE || 'model=dm3q,version=34,locale=en,orientation=landscape' }}
  FTL_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
  FTL_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET }}
  IMM_UNITY_FALLBACK_LICENSE: |
    <?xml version="1.0" encoding="UTF-8"?><root><TimeStamp Value="chxldhvc0zh5Vw=="/>
        <License id="Terms">
            <MachineBindings>
                <Binding Key="1" Value="C372866C-B44C-5E48-806F-7583B55F04FB"/>
                <Binding Key="2" Value="C02F32Y5ML85"/>
            </MachineBindings>
            <MachineID Value="LcL/yxIaeUG12OSX31mKDtxcVx8="/>
            <SerialHash Value="e25c63636985259e763d40cc9253cdfe6a862ceb"/>
            <Features>
                <Feature Value="33"/>
                <Feature Value="1"/>
                <Feature Value="12"/>
                <Feature Value="2"/>
                <Feature Value="24"/>
                <Feature Value="3"/>
                <Feature Value="36"/>
                <Feature Value="17"/>
                <Feature Value="19"/>
                <Feature Value="62"/>
            </Features>
            <DeveloperData Value="AQAAAEY0LUtFWUItMzYyOC0zWEI3LVBZVVEtTUI5VQ=="/>
            <SerialMasked Value="F4-KEYB-3628-3XB7-PYUQ-XXXX"/>
            <StartDate Value="2023-11-21T00:00:00"/>
            <UpdateDate Value="2023-11-22T06:03:23"/>
            <InitialActivationDate Value="2023-11-21T06:03:21"/>
            <LicenseVersion Value="6.x"/>
            <ClientProvidedVersion Value="2017.2.0"/>
            <AlwaysOnline Value="false"/>
            <Entitlements>
                <Entitlement Ns="unity_editor" Tag="UnityPersonal" Type="EDITOR" ValidTo="9999-12-31T00:00:00"/>
                <Entitlement Ns="unity_editor" Tag="DarkSkin" Type="EDITOR_FEATURE" ValidTo="9999-12-31T00:00:00"/>
            </Entitlements>
        </License><Signature xmlns="http://www.w3.org/2000/09/xmldsig#"><SignedInfo><CanonicalizationMethod Algorithm="http://www.w3.org/TR/2001/REC-xml-c14n-20010315#WithComments"/><SignatureMethod Algorithm="http://www.w3.org/2000/09/xmldsig#rsa-sha1"/><Reference URI="#Terms"><Transforms><Transform Algorithm="http://www.w3.org/2000/09/xmldsig#enveloped-signature"/></Transforms><DigestMethod Algorithm="http://www.w3.org/2000/09/xmldsig#sha1"/><DigestValue>9DZF11miRAzx7TIuCxih78B6CXU=</DigestValue></Reference></SignedInfo><SignatureValue>weRQubqMNN61lSZtm/e7S+UDzTPNQjM5aQl/c4aKLH/b2khefpgLfdWneoxdnNopA6+rW6kBqxWt
    hMLdHY+oAOfDsfmMQRTnmQG0Y3G3xh6gjGP1RAIHoLDfFHf+0LQ3FakA2WehcFWPSYeVDrdxm3HW
    qMmdKWooD9i+J4s4rQFTDx9+/G6yjc5KGTyGxIz3c5kxTEkV2qsFPXsauomY9Z8YPKy+cZK7g+Ol
    pO+LhtzetgTIlIN/qG8eByjlp6nOuVGdDOIrhNJW+vllNyx0qNWPREadVrhFViI4UXegMFRl5gJc
    rgcrlr/fD+NorDVLfcu7D863QXkkuriILUIq2Q==</SignatureValue></Signature></root>

jobs:
  unity-windows-native-plugin-build:
    name: Unity Windows Native Plugin Build
    if: >-
      (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) &&
      (vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true' || vars.CI_ENABLE_VR_CHECKS == 'true')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download same-commit Unity native plugin build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Unity
          path: artifacts/prebuilt-unity-native

      - name: Stage same-commit Unity native plugin
        shell: pwsh
        run: |
          $source = Get-ChildItem artifacts\prebuilt-unity-native -Recurse -Filter ImmUnityPlugin.dll | Select-Object -First 1
          if (-not $source) {
            throw "Build workflow did not provide ImmUnityPlugin.dll"
          }
          $destination = "code\ImmUnitySampleProject\Packages\com.immersive-foundation.imm-unity\Plugins\x86_64\ImmUnityPlugin.dll"
          Copy-Item -Force $source.FullName $destination

      - name: Verify Unity native plugin exports
        shell: pwsh
        run: |
          $plugin = "code\ImmUnitySampleProject\Packages\com.immersive-foundation.imm-unity\Plugins\x86_64\ImmUnityPlugin.dll"
          if (-not (Test-Path $plugin)) {
            throw "Same-commit Unity native plugin was not built: $plugin"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio C++ tools installation was not found"
          }
          $vcToolsVersionPath = Join-Path $installationPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $vcToolsVersion = (Get-Content -Raw $vcToolsVersionPath).Trim()
          $dumpbin = Join-Path $installationPath "VC\Tools\MSVC\$vcToolsVersion\bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path $dumpbin)) {
            throw "dumpbin.exe was not found: $dumpbin"
          }
          $exports = & $dumpbin /exports $plugin
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed while inspecting $plugin"
          }
          $exportsText = $exports -join "`n"
          foreach ($requiredExport in @("GetRenderEventFunc", "GetRenderEventAndDataFunc", "ConfigureVulkanRenderEvent")) {
            if ($exportsText -notmatch "\b$requiredExport\b") {
              throw "Same-commit Unity native plugin is missing required export: $requiredExport"
            }
          }

      - name: Upload same-commit Unity native plugin
        uses: actions/upload-artifact@v4
        with:
          name: UnityWindowsNativePluginSourceBuild
          path: code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/x86_64/ImmUnityPlugin.dll
          if-no-files-found: error
          retention-days: 1

  unity-package-import:
    name: Unity Package Import
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore Unity Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-package-import-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-package-import-${{ env.UNITY_VERSION }}-

      - name: Restore Unity PackageCache cache
        id: cache_packagecache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityPackageCache-${{ env.UNITY_VERSION }}-

      - name: Verify source package layout
        run: |
          python tests/tools/verify_package_layout.py unity code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader --expected-name com.immersive-foundation.imm-stroke-reader
          python tests/tools/verify_package_layout.py unity code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity --expected-name com.immersive-foundation.imm-unity

      - name: Verify Unity package import harness
        run: >
          python tests/tools/verify_engine_package_import.py unity
          --stroke-package code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-stroke-reader
          --player-package code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity
          --workspace artifacts/UnityPackageImportHarness

      - name: Preflight Unity runner
        run: python tests/tools/preflight_runner.py --profile unity --output artifacts/unity-package-import/preflight.json

      - name: Run Unity batchmode package import tests
        id: unity_package_import_tests
        timeout-minutes: 25
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: artifacts/UnityPackageImportHarness/unity-package-import
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: artifacts/unity-package-import/test-runner
          customParameters: -testResults artifacts/unity-editmode-results.xml

      - name: Write CI manifest
        if: always()
        run: python tests/tools/write_ci_manifest.py --status "${{ steps.unity_package_import_tests.outcome }}" --failure-class api --output artifacts/unity-package-import/manifest.json --product unity --platform-name all --mode non-vr --renderer preflight --include artifacts
      - name: Collect artifact summary
        if: always()
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/unity-package-import --require-manifest --output artifacts/unity-package-import/artifact-summary.json

      - name: Save Unity PackageCache cache
        if: always() && steps.cache_packagecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Save Unity Library cache
        if: always() && steps.cache_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-package-import-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload Unity results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityPackageImport
          path: artifacts
          if-no-files-found: ignore
          retention-days: 14

  unity-macos-metal-composition:
    name: Unity macOS Metal Composition
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download same-commit macOS Unity package
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Unity
          path: artifacts/prebuilt-unity-package

      - name: Stage same-commit macOS Unity native plugin
        run: |
          set -euo pipefail
          source_bundle="$(find artifacts/prebuilt-unity-package -path '*/Plugins/OSX/ImmUnityPlugin.bundle' -type d | head -n 1)"
          test -n "$source_bundle"
          destination="code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/OSX/ImmUnityPlugin.bundle"
          rm -rf "$destination"
          ditto "$source_bundle" "$destination"
          plugin_binary="$(find "$destination/Contents/MacOS" -type f | head -n 1)"
          test -n "$plugin_binary"
          chmod +x "$plugin_binary"
          codesign --force --sign - --deep "$destination"
          codesign --verify --deep --strict "$destination"

      - name: Restore Unity macOS Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-macos-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-macos-metal-${{ env.UNITY_VERSION }}-

      - name: Preflight Unity macOS Metal runner
        run: python3 tests/tools/preflight_runner.py --profile unity --output artifacts/unity-macos-metal-composition/preflight.json

      - name: Prepare Unity macOS Metal artifact directory
        run: mkdir -p artifacts/unity-macos-metal-composition build/unity-smoke/macos-metal

      - name: Build Unity macOS Metal smoke player
        id: unity_macos_metal_player_build
        timeout-minutes: 25
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneOSX
          versioning: None
          buildMethod: ImmPlayer.Editor.BuildAutomation.BuildMacOSMetalSmokePlayer
          allowDirtyBuild: true
          enableGpu: true
          cacheUnityInstallationOnMac: true
          customParameters: -logFile ${{ github.workspace }}/artifacts/unity-macos-metal-composition/unity-editor.log -immSmokePlayerPath ${{ github.workspace }}/build/unity-smoke/macos-metal/ImmUnitySmoke.app

      - name: Run Unity macOS Metal visual smokes
        timeout-minutes: 8
        run: |
          set -euo pipefail
          app="$PWD/build/unity-smoke/macos-metal/ImmUnitySmoke.app"
          test -d "$app/Contents/MacOS"
          player="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n 1)"
          artifact_dir="$PWD/artifacts/unity-macos-metal-composition"
          test -n "$player"
          test -x "$player"

          full_depth_status=0
          IMM_UNITY_SMOKE_FREEZE_PLAYBACK=1 \
          "$player" \
            -logFile "$artifact_dir/unity-full-depth-player.log" \
            -screen-width 1280 \
            -screen-height 720 \
            -screen-fullscreen 0 \
            -force-metal \
            -immSmokeCapturePath "$artifact_dir/unity-macos-metal-full-depth.png" \
            -immSmokeRenderCapturePath "$artifact_dir/unity-macos-metal-render.png" \
            -immSmokeFrames 120 \
            -immSmokeQuit 1 \
            -immSmokeCompositionProbe 1 \
            -immSmokeExpectedGraphicsApi Metal || full_depth_status=$?

          ordered_overlay_status=0
          IMM_UNITY_SMOKE_FREEZE_PLAYBACK=1 \
          IMM_UNITY_SMOKE_OVERLAY_FIXTURE=1 \
          "$player" \
            -logFile "$artifact_dir/unity-ordered-overlay-player.log" \
            -screen-width 1280 \
            -screen-height 720 \
            -screen-fullscreen 0 \
            -force-metal \
            -immSmokeCapturePath "$artifact_dir/unity-macos-metal-ordered-overlay.png" \
            -immSmokeFrames 120 \
            -immSmokeQuit 1 \
            -immSmokeCompositionProbe 1 \
            -immSmokeOverlayProbe 1 \
            -immSmokeMinOrderedOverlayImmUniqueColors 3000 \
            -immSmokeExpectedGraphicsApi Metal || ordered_overlay_status=$?

          if [ "$full_depth_status" -ne 0 ] || [ "$ordered_overlay_status" -ne 0 ]; then
            exit 1
          fi

      - name: Classify Unity macOS Metal visual smokes
        if: always()
        run: |
          full_depth_status=0
          python3 tests/tools/classify_unity_visual_smoke.py \
            --log artifacts/unity-macos-metal-composition/unity-full-depth-player.log \
            --capture artifacts/unity-macos-metal-composition/unity-macos-metal-full-depth.png \
            --composition-mode full_depth \
            --output artifacts/unity-macos-metal-composition/full-depth-status.json || full_depth_status=$?
          ordered_overlay_status=0
          python3 tests/tools/classify_unity_visual_smoke.py \
            --log artifacts/unity-macos-metal-composition/unity-ordered-overlay-player.log \
            --capture artifacts/unity-macos-metal-composition/unity-macos-metal-ordered-overlay.png \
            --composition-mode ordered_overlay \
            --output artifacts/unity-macos-metal-composition/ordered-overlay-status.json || ordered_overlay_status=$?
          if [ "$full_depth_status" -ne 0 ] || [ "$ordered_overlay_status" -ne 0 ]; then
            exit 1
          fi

      - name: Record Unity macOS Metal render metrics
        if: always()
        run: |
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-macos-metal-composition/unity-macos-metal-render.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/unity-macos-metal-sample1.json \
            --json-output artifacts/unity-macos-metal-composition/unity-macos-metal-render-metrics.json
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-macos-metal-composition/unity-macos-metal-full-depth.png \
            --json-output artifacts/unity-macos-metal-composition/unity-macos-metal-full-depth-metrics.json
          python3 tests/tools/compare_render_metrics.py \
            artifacts/unity-macos-metal-composition/unity-macos-metal-ordered-overlay.png \
            --json-output artifacts/unity-macos-metal-composition/unity-macos-metal-ordered-overlay-metrics.json

      - name: Write Unity macOS Metal render reports
        if: always()
        run: |
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-macos-metal-composition/unity-macos-metal-render-metrics.json \
            --candidate-capture artifacts/unity-macos-metal-composition/unity-macos-metal-render.png \
            --output-dir artifacts/unity-macos-metal-composition/captures/render \
            --markdown-output artifacts/unity-macos-metal-composition/render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-macos-metal-composition/unity-macos-metal-full-depth-metrics.json \
            --candidate-capture artifacts/unity-macos-metal-composition/unity-macos-metal-full-depth.png \
            --status-json artifacts/unity-macos-metal-composition/full-depth-status.json \
            --output-dir artifacts/unity-macos-metal-composition/captures/full-depth \
            --markdown-output artifacts/unity-macos-metal-composition/full-depth-render-report.md
          python3 tests/tools/write_render_report.py \
            --metrics-json artifacts/unity-macos-metal-composition/unity-macos-metal-ordered-overlay-metrics.json \
            --candidate-capture artifacts/unity-macos-metal-composition/unity-macos-metal-ordered-overlay.png \
            --status-json artifacts/unity-macos-metal-composition/ordered-overlay-status.json \
            --output-dir artifacts/unity-macos-metal-composition/captures/ordered-overlay \
            --markdown-output artifacts/unity-macos-metal-composition/ordered-overlay-render-report.md

      - name: Verify Unity macOS Metal log contract
        if: always()
        run: |
          python3 tests/tools/verify_log_markers.py \
            --log artifacts/unity-macos-metal-composition/unity-full-depth-player.log \
            --label unity-macos-metal-full-depth \
            --require "[IMM_UNITY_SMOKE] graphics api expected=Metal actual=Metal" \
            --require "[IMM_UNITY_SMOKE] render candidate capture=" \
            --require "[IMM_UNITY_SMOKE] capture=" \
            --require "Loaded in CPU" \
            --require "Loaded in GPU" \
            --forbid "[IMM_DIAG] Failed to load" \
            --forbid "[IMM_UNITY_SMOKE] scene composition front occluder failed" \
            --forbid "[IMM_UNITY_SMOKE] scene composition rear visible probe failed" \
            --forbid "[IMM_UNITY_SMOKE] scene composition rear occlusion probe failed" \
            --output artifacts/unity-macos-metal-composition/full-depth-log-contract.json
          python3 tests/tools/verify_log_markers.py \
            --log artifacts/unity-macos-metal-composition/unity-ordered-overlay-player.log \
            --label unity-macos-metal-ordered-overlay \
            --require "[IMM_UNITY_SMOKE] graphics api expected=Metal actual=Metal" \
            --require "[IMM_UNITY_SMOKE] scene composition overlay probe passed" \
            --require "[IMM_UNITY_SMOKE] capture=" \
            --output artifacts/unity-macos-metal-composition/ordered-overlay-log-contract.json

      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts/unity-macos-metal-composition/manifest.json --product unity --platform-name macos --mode non-vr --renderer metal --include artifacts/unity-macos-metal-composition

      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/unity-macos-metal-composition --require-manifest --output artifacts/unity-macos-metal-composition/artifact-summary.json

      - name: Save Unity macOS Library cache
        if: always() && steps.cache_library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-macos-metal-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}

      - name: Upload Unity macOS Metal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UnityMacOSMetalComposition
          path: artifacts/unity-macos-metal-composition
          if-no-files-found: ignore
          retention-days: 14

  unity-windows-directx-player-build:
    name: Unity Windows DirectX Player Build
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'engine-ci')) && vars.CI_ENABLE_UNITY_EDITOR_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unity-windows-native-plugin-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download same-commit Unity native plugin
        uses: actions/download-artifact@v4
        with:
          name: UnityWindowsNativePluginSourceBuild
          path: code/ImmUnitySampleProject/Packages/com.immersive-foundation.imm-unity/Plugins/x86_64

      - name: Restore Unity Library cache
        id: cache_library
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library
          key: UnityLibrary-windows-directx-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityLibrary-windows-directx-${{ env.UNITY_VERSION }}-

      - name: Restore Unity PackageCache cache
        id: cache_packagecache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 10
        with:
          path: code/ImmUnitySampleProject/Library/PackageCache
          key: UnityPackageCache-${{ env.UNITY_VERSION }}-${{ hashFiles('code/ImmUnitySampleProject/Packages/packages-lock.json') }}
          restore-keys: |
            UnityPackageCache-${{ env.UNITY_VERSION }}-

      - name: Preflight Unity DirectX runner
        run: python tests/tools/preflight_runner.py --profile unity --output artifacts/unity-windows-directx-player/preflight.json

      - name: Prepare Unity DirectX artifact directory
        run: mkdir -p artifacts/unity-windows-directx-player/player

      - name: Build Unity DirectX smoke player
        id: unity_directx_player_build
        timeout-minutes: 25
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ vars.UNITY_EMAIL || 'unitytest@mikeage.net' }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD || 'DoNotStealThis1' }}
          UNITY_LICENSE: ${{ env.IMM_UNITY_FALLBACK_LICENSE }}
        with:
          projectPath: code/ImmUnitySampleProject
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          versioning: None
          buildMethod: ImmPlayer.Editor.BuildAutomation.BuildWindowsDirectXSmokePlayer
          customParameters: -logFile /github/workspace/artifacts/unity-windows-directx-player/unity-editor.log -immSmokePlayerPath /github/workspace/artifacts/unity-windows-directx-player/player/ImmUnitySmoke.exe

      - name: Write CI manifest
        if: always()
        run: python tests/tools/write_ci_manifest.py --status "${{ steps.unity_directx_player_build.outcome }}" --failure-class build --output artifacts/unity-windows-directx-player/manifest.json --product unity --platform-name windows --mode non-vr --renderer directx --include artifacts/unity-windows-directx-player

      - name: Collect artifact summary
        if: always()
