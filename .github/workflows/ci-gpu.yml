---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI GPU Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled]

jobs:
  windows-standalone-vulkan:
    name: Windows Standalone Vulkan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, windows, gpu, vulkan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight GPU runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-gpu-vulkan --output artifacts\windows-standalone-vulkan\preflight.json --require-command msbuild --require-command glslangValidator --require-command spirv-val

      - name: Build Windows viewer
        working-directory: code/projects/windows
        run: msbuild imm.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Capture DirectX baseline
        shell: pwsh
        run: .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 -Configuration Release -SkipBuild -OutputPath .\build\baseline-captures\windows-directx-playerframe60.ppm

      - name: Run Vulkan smoke against baseline
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-vulkan-sample1-smoke.ps1 -Configuration Release -SkipBuild -KeepArtifacts

      - name: Compare Vulkan render metrics against DirectX baseline
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py .\code\appImmViewer\exe\vulkan_sample1_smoke.ppm
          --reference .\build\baseline-captures\windows-directx-playerframe60.ppm
          --contract tests\baselines\render\windows-directx-sample1.json
          --json-output artifacts\windows-standalone-vulkan\vulkan-vs-directx-render-metrics.json

      - name: Stage Vulkan capture evidence
        shell: pwsh
        run: Copy-Item -Force .\code\appImmViewer\exe\vulkan_sample1_smoke.ppm artifacts\windows-standalone-vulkan\vulkan_sample1_smoke.ppm

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\windows-standalone-vulkan\manifest.json --product standalone --platform-name windows --mode non-vr --renderer vulkan --include build\baseline-captures --include code\appImmViewer\exe\vulkan_sample1_smoke.ppm
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-vulkan --require-manifest --output artifacts\windows-standalone-vulkan\artifact-summary.json

      - name: Upload GPU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneVulkan-GPU
          path: |
            artifacts/windows-standalone-vulkan
            build/baseline-captures
            code/appImmViewer/exe/debug.txt
            code/appImmViewer/exe/vulkan_sample1_smoke.ppm
          if-no-files-found: ignore
          retention-days: 14

  windows-standalone-openxr-vr:
    name: Windows Standalone OpenXR VR
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, windows, gpu, vr, openxr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Windows OpenXR VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-openxr-vr --output artifacts\windows-standalone-openxr-vr\preflight.json --require-command msbuild

      - name: Run Windows OpenXR VR smoke
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-windows-openxr-vr-smoke.ps1 -Configuration Release -LogDir artifacts\windows-standalone-openxr-vr

      - name: Verify Windows OpenXR VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\windows-standalone-openxr-vr\debug.txt
          --label windows-standalone-openxr-vr
          --require "XR Runtime: OpenXR"
          --require "Rendering in VR: yes"
          --require "IMM_OPENXR_STANDALONE createInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE getHmdSystemResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE enumerateStereoViewsFillResult=0"
          --require "IMM_OPENXR_STANDALONE createSessionResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE beginSessionResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE waitFrameResult=0 resultName=XR_SUCCESS shouldRender=1"
          --require "IMM_OPENXR_STANDALONE beginFrameResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE endFrameResult=0 resultName=XR_SUCCESS layerCount=1 projectionViews=2"
          --require "OpenXR standalone startup probe passed"
          --forbid "OpenXR standalone startup probe failed"
          --forbid "Cannot do VR"
          --output artifacts\windows-standalone-openxr-vr\openxr-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\windows-standalone-openxr-vr\manifest.json --product standalone --platform-name windows --mode vr --renderer openxr --include artifacts\windows-standalone-openxr-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-openxr-vr --require-manifest --output artifacts\windows-standalone-openxr-vr\artifact-summary.json

      - name: Upload OpenXR VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneOpenXRVR-GPU
          path: artifacts/windows-standalone-openxr-vr
          if-no-files-found: ignore
          retention-days: 14

  windows-standalone-opengl-vr:
    name: Windows Standalone OpenGL VR
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, windows, gpu, vr, opengl]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Windows OpenGL VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-opengl-vr --output artifacts\windows-standalone-opengl-vr\preflight.json --require-command msbuild

      - name: Run Windows OpenGL VR smoke
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-windows-opengl-vr-smoke.ps1 -Configuration Release -LogDir artifacts\windows-standalone-opengl-vr

      - name: Verify Windows OpenGL VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\windows-standalone-opengl-vr\debug.txt
          --label windows-standalone-opengl-vr
          --require "Rendering Backened: OpenGL"
          --require "XR Runtime: Legacy"
          --require "Rendering in VR: yes"
          --require "IMM_LEGACY_VR_SMOKE hmd_initialized"
          --require "Viewer initialized"
          --require "IMM_LEGACY_VR_SMOKE frame_submitted"
          --forbid "Cannot do VR"
          --forbid "Viewer init failed"
          --forbid "Failed to create render target"
          --output artifacts\windows-standalone-opengl-vr\opengl-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\windows-standalone-opengl-vr\manifest.json --product standalone --platform-name windows --mode vr --renderer opengl --include artifacts\windows-standalone-opengl-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-opengl-vr --require-manifest --output artifacts\windows-standalone-opengl-vr\artifact-summary.json

      - name: Upload OpenGL VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneOpenGLVR-GPU
          path: artifacts/windows-standalone-opengl-vr
          if-no-files-found: ignore
          retention-days: 14

  windows-godot-vulkan:
    name: Windows Godot Vulkan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, windows, gpu, godot, vulkan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Godot Vulkan runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-godot-vulkan --output artifacts\godot-smoke-windows-vulkan\preflight.json --require-command msbuild --require-env GODOT_EXE

      - name: Build Godot extension
        shell: pwsh
        run: .\code\projects\windows\build-godot-extension.ps1 -Configuration Release -BootstrapGodotCpp -BuildGodotCpp

      - name: Build Windows viewer
        working-directory: code/projects/windows
        run: msbuild imm.sln /t:appImmViewer /p:Configuration=Release /p:Platform=x64 /m

      - name: Capture DirectX reference
        shell: pwsh
        run: .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 -Configuration Release -SkipBuild -OutputPath .\build\baseline-captures\windows-directx-playerframe60.ppm

      - name: Run Godot Vulkan visual baseline smoke
        shell: pwsh
        run: >
          .\code\projects\windows\run-godot-vulkan-visual-baseline-smoke.ps1
          -Configuration Release
          -SkipBuild
          -ReferencePath .\build\baseline-captures\windows-directx-playerframe60.ppm
          -CapturePath artifacts\godot-smoke-windows-vulkan\godot-vulkan-visual.ppm
          -LogDir artifacts\godot-smoke-windows-vulkan

      - name: Compare Godot Vulkan render metrics against DirectX baseline
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py artifacts\godot-smoke-windows-vulkan\godot-vulkan-visual.ppm
          --reference .\build\baseline-captures\windows-directx-playerframe60.ppm
          --contract tests\baselines\render\windows-directx-sample1.json
          --json-output artifacts\godot-smoke-windows-vulkan\godot-vulkan-vs-directx-render-metrics.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\godot-smoke-windows-vulkan\manifest.json --product godot --platform-name windows --mode non-vr --renderer vulkan --include artifacts\godot-smoke-windows-vulkan
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\godot-smoke-windows-vulkan --require-manifest --output artifacts\godot-smoke-windows-vulkan\artifact-summary.json

      - name: Upload Godot Vulkan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsGodotVulkan-GPU
          path: artifacts/godot-smoke-windows-vulkan
          if-no-files-found: ignore
          retention-days: 14

  windows-godot-openxr-vr:
    name: Windows Godot OpenXR VR
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, windows, gpu, godot, vr, openxr]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Godot OpenXR VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-godot-openxr-vr --output artifacts\godot-openxr-vr\preflight.json --require-command msbuild --require-env GODOT_EXE

      - name: Build Godot extension
        shell: pwsh
        run: .\code\projects\windows\build-godot-extension.ps1 -Configuration Release -BootstrapGodotCpp -BuildGodotCpp

      - name: Run Godot OpenXR VR smoke
        shell: pwsh
        run: .\code\projects\windows\run-godot-openxr-vr-smoke.ps1 -Configuration Release -SkipBuild -LogDir artifacts\godot-openxr-vr

      - name: Verify Godot OpenXR VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\godot-openxr-vr\godot-openxr-vr-output.log
          --label godot-openxr-vr
          --require "IMM_GODOT_OPENXR_SMOKE begin"
          --require "IMM_GODOT_OPENXR_SMOKE interface_initialized"
          --require "IMM_GODOT_OPENXR_SMOKE viewport_use_xr=1"
          --require "IMM_GODOT_OPENXR_SMOKE primary_interface=OpenXR"
          --require "IMM_GODOT_OPENXR_SMOKE viewer_initialized"
          --require "IMM_GODOT_OPENXR_SMOKE load_document_result=0"
          --require "IMM_GODOT_OPENXR_SMOKE document_ready"
          --require "IMM_GODOT_OPENXR_SMOKE frame_submitted"
          --require "IMM Godot OpenXR VR smoke passed"
          --forbid "IMM_GODOT_OPENXR_SMOKE failed"
          --forbid "OpenXR interface was not found"
          --forbid "OpenXR interface initialize() returned false"
          --forbid "ImmViewer did not load"
          --forbid "ImmViewer sequence was not ready"
          --output artifacts\godot-openxr-vr\godot-openxr-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\godot-openxr-vr\manifest.json --product godot --platform-name windows --mode vr --renderer openxr --include artifacts\godot-openxr-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\godot-openxr-vr --require-manifest --output artifacts\godot-openxr-vr\artifact-summary.json

      - name: Upload Godot OpenXR VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsGodotOpenXRVR-GPU
          path: artifacts/godot-openxr-vr
          if-no-files-found: ignore
          retention-days: 14

  macos-godot-metal:
    name: macOS Godot Metal
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: [self-hosted, macos, gpu, metal, godot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight Godot Metal runner
        run: python3 tests/tools/preflight_runner.py --profile macos-godot-metal --output artifacts/godot-smoke-macos-metal/preflight.json --require-command cmake --require-command git --require-env GODOT_EXE

      - name: Configure macOS build
        run: cmake -S code/projects/macos -B build/macos -DIMM_BUILD_VIEWER=ON

      - name: Build macOS Godot native plugin
        run: cmake --build build/macos --target ImmGodotPlugin --config Release

      - name: Build macOS Godot GDExtension
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages scons
          if [ ! -d thirdparty/godot-cpp ]; then
            git clone --depth 1 --branch godot-4.5-stable https://github.com/godotengine/godot-cpp.git thirdparty/godot-cpp
          fi
          arch="$(uname -m)"
          python3 -m SCons -C thirdparty/godot-cpp platform=macos target=template_release arch="$arch" generate_bindings=yes
          python3 -m SCons -C code/appImmGodotGDExtension platform=macos target=template_release arch="$arch" godot_cpp="$PWD/thirdparty/godot-cpp" imm_godot_lib="$PWD/build/macos/godot/libImmGodotPlugin.dylib" imm_godot_runtime="$PWD/build/macos/godot/libImmGodotPlugin.dylib"

      - name: Run Godot Metal visual smoke
        run: |
          set -euo pipefail
          : "${GODOT_EXE:?GODOT_EXE must point to a Godot 4.5+ executable on this self-hosted runner}"
          mkdir -p artifacts/godot-smoke-macos-metal
          IMM_GODOT_VISUAL_SMOKE=1 \
          IMM_GODOT_VISUAL_SMOKE_PNG="$PWD/artifacts/godot-smoke-macos-metal/metal_visual_smoke.png" \
          "$GODOT_EXE" --path code/ImmGodotSampleProject --rendering-driver metal --rendering-method forward_plus --scene res://scenes/VisualSmokeScene.tscn --fixed-fps 30 \
            > artifacts/godot-smoke-macos-metal/godot-metal-smoke.log 2>&1
          grep -q "IMM Godot Metal visual smoke passed" artifacts/godot-smoke-macos-metal/godot-metal-smoke.log

      - name: Record Godot Metal render metrics
        run: >
          python3 tests/tools/compare_render_metrics.py
          artifacts/godot-smoke-macos-metal/metal_visual_smoke.png
          --json-output artifacts/godot-smoke-macos-metal/godot-metal-render-metrics.json

      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts/godot-smoke-macos-metal/manifest.json --product godot --platform-name macos --mode non-vr --renderer metal --include artifacts/godot-smoke-macos-metal
      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/godot-smoke-macos-metal --require-manifest --output artifacts/godot-smoke-macos-metal/artifact-summary.json

      - name: Upload Godot Metal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOSGodotMetal-GPU
          path: artifacts/godot-smoke-macos-metal
          if-no-files-found: ignore
          retention-days: 14

  gpu-evidence-report:
    name: GPU Evidence Report
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci'))
    runs-on: ubuntu-latest
    needs:
      - windows-standalone-vulkan
      - windows-standalone-openxr-vr
      - windows-standalone-opengl-vr
      - windows-godot-vulkan
      - windows-godot-openxr-vr
      - macos-godot-metal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GPU artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/gpu-evidence/input

      - name: Verify GPU matrix evidence
        run: >
          python tests/tools/verify_matrix_evidence.py tests/matrix_status.json
          --gate-prefix "CI GPU Matrix /"
          --evidence-root artifacts/gpu-evidence/input
          --json-output artifacts/gpu-evidence/matrix-evidence.json
          --markdown-output artifacts/gpu-evidence/matrix-evidence.md

      - name: Upload GPU evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPUMatrixEvidence
          path: artifacts/gpu-evidence
          if-no-files-found: ignore
          retention-days: 14
