      - name: Preflight Windows OpenGL VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-opengl-vr --output artifacts\windows-standalone-opengl-vr\preflight.json

      - name: Run Windows OpenGL VR smoke
        timeout-minutes: 10
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-windows-opengl-vr-smoke.ps1 -Configuration Release -SkipBuild -LogDir artifacts\windows-standalone-opengl-vr

      - name: Verify Windows OpenGL VR log contract
        shell: pwsh
