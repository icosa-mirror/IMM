---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI GPU Matrix

on:
  workflow_call:
    inputs:
      hardware:
        description: Run explicitly requested jobs requiring private hardware.
        required: false
        default: false
        type: boolean
      evidence_scope:
        description: Matrix evidence scope selected by the calling workflow.
        required: false
        default: hosted
        type: string

permissions:
  actions: write
  contents: read

env:
  MATRIX_EVIDENCE_SCOPE: ${{ inputs.evidence_scope }}

jobs:
  windows-standalone-directx:
    name: Windows Standalone DirectX
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-Windows
          path: artifacts/prebuilt-windows-viewer

      - name: Stage Windows viewer build artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts\prebuilt-windows-viewer -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            Copy-Item -Destination code\appImmViewer\exe -Force

      - name: Preflight DirectX runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-standalone-directx --output artifacts\windows-standalone-directx\preflight.json

      - name: Capture DirectX sample1
        timeout-minutes: 5
        shell: pwsh
        run: .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 -Configuration Release -SkipBuild -OutputPath .\artifacts\windows-standalone-directx\windows-directx-sample1.ppm

      - name: Capture and classify DirectX face orientation
        shell: pwsh
        run: |
          .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 `
            -Configuration Release -SkipBuild -PlayerFrame 0 `
            -SamplePath .\exampleImmFiles\face-orientation.imm `
            -OutputPath .\artifacts\windows-standalone-directx\face-orientation.ppm `
            -MinPictureDrawCalls 0 -MinPicture360DrawCalls 0 -MinPicture360EquirectDrawCalls 0
          python tests\tools\classify_face_orientation_capture.py `
            artifacts\windows-standalone-directx\face-orientation.ppm `
            --status-output artifacts\windows-standalone-directx\face-orientation-status.json `
            --capture-output artifacts\windows-standalone-directx\captures\face-orientation\directx.png `
            --overlay-output artifacts\windows-standalone-directx\captures\face-orientation\directx-overlay.png

      - name: Compare DirectX render metrics against committed DirectX baseline
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py artifacts\windows-standalone-directx\windows-directx-sample1.ppm
          --reference tests\baselines\render\windows-directx-sample1.ppm
          --contract tests\baselines\render\windows-directx-sample1.json
          --json-output artifacts\windows-standalone-directx\directx-vs-committed-directx-render-metrics.json

      - name: Write DirectX render report
        if: always()
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\windows-standalone-directx\directx-vs-committed-directx-render-metrics.json
          --reference-capture tests\baselines\render\windows-directx-sample1.ppm
          --candidate-capture artifacts\windows-standalone-directx\windows-directx-sample1.ppm
          --output-dir artifacts\windows-standalone-directx\captures
          --markdown-output artifacts\windows-standalone-directx\render-report.md

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\windows-standalone-directx\manifest.json --product standalone --platform-name windows --mode non-vr --renderer directx --include artifacts\windows-standalone-directx
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-directx --require-manifest --output artifacts\windows-standalone-directx\artifact-summary.json

      - name: Upload DirectX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneDirectX-GPU
          path: artifacts/windows-standalone-directx
          if-no-files-found: ignore
          retention-days: 14

  windows-standalone-vulkan:
    name: Windows Standalone Vulkan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-Windows
          path: artifacts/prebuilt-windows-viewer

      - name: Stage Windows viewer build artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts\prebuilt-windows-viewer -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            Copy-Item -Destination code\appImmViewer\exe -Force

      - name: Install Mesa lavapipe
        id: msys2-standalone-vulkan
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-mesa
            mingw-w64-x86_64-spirv-tools

      - name: Configure Mesa lavapipe Vulkan ICD
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2-standalone-vulkan.outputs.msys2-location }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-standalone-vulkan | Out-Null
          $setupLog = "artifacts\windows-standalone-vulkan\vulkan-driver-setup.txt"
          $searchRoots = @($env:MSYS2_LOCATION, "C:\msys64") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $mingwBin = Join-Path ($searchRoots | Select-Object -First 1) "mingw64\bin"
          if (Test-Path $mingwBin) {
            $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          "MSYS2_LOCATION=$env:MSYS2_LOCATION" | Out-File -FilePath $setupLog
          "MINGW64_BIN=$mingwBin" | Out-File -FilePath $setupLog -Append
          "Search roots:" | Out-File -FilePath $setupLog -Append
          $searchRoots | Out-File -FilePath $setupLog -Append
          $icds = @($searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "lvp_icd*.json" -ErrorAction SilentlyContinue })
          $dlls = @($searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "vulkan_lvp.dll" -ErrorAction SilentlyContinue })
          "ICD candidates:" | Out-File -FilePath $setupLog -Append
          $icds.FullName | Out-File -FilePath $setupLog -Append
          "DLL candidates:" | Out-File -FilePath $setupLog -Append
          $dlls.FullName | Out-File -FilePath $setupLog -Append
          $sourceIcd = $icds | Where-Object { $_.FullName -like "*\mingw64\*" } | Select-Object -First 1
          if (-not $sourceIcd) {
            $sourceIcd = $icds | Select-Object -First 1
          }
          if (-not $sourceIcd) {
            throw "Mesa lavapipe ICD was not found under: $($searchRoots -join ', ')"
          }
          $driverRoot = $sourceIcd.FullName -replace "\\share\\vulkan\\icd\.d\\.*$", ""
          $sourceDll = Join-Path $driverRoot "bin\vulkan_lvp.dll"
          if (-not (Test-Path $sourceDll)) {
            $sourceDll = ($dlls | Where-Object { $_.FullName -like "$driverRoot\*" } | Select-Object -First 1).FullName
          }
          if (-not $sourceDll -or -not (Test-Path $sourceDll)) {
            throw "Mesa lavapipe DLL was not found for $($sourceIcd.FullName)"
          }
          $icdDir = Join-Path $env:GITHUB_WORKSPACE "lavapipe-vulkan"
          New-Item -ItemType Directory -Force -Path $icdDir | Out-Null
          $workspaceIcd = Join-Path $icdDir "lvp_icd.x86_64.json"
          $icdJson = Get-Content -Raw $sourceIcd.FullName | ConvertFrom-Json
          $icdJson.ICD.library_path = $sourceDll.Replace("\", "/")
          $icdJson | ConvertTo-Json -Depth 10 | Out-File -FilePath $workspaceIcd -Encoding utf8
          "Selected ICD=$($sourceIcd.FullName)" | Out-File -FilePath $setupLog -Append
          "Selected DLL=$sourceDll" | Out-File -FilePath $setupLog -Append
          "Workspace ICD=$workspaceIcd" | Out-File -FilePath $setupLog -Append
          Get-Content -Raw $workspaceIcd | Out-File -FilePath $setupLog -Append
          "VK_ICD_FILENAMES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_DRIVER_FILES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_ADD_DRIVER_FILES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          $registryTargets = @(
            "HKCU\Software\Khronos\Vulkan\Drivers",
            "HKLM\SOFTWARE\Khronos\Vulkan\Drivers",
            "HKLM\SOFTWARE\WOW6432Node\Khronos\Vulkan\Drivers"
          )
          $icdTargets = @($workspaceIcd, $sourceIcd.FullName) | Select-Object -Unique
          foreach ($registryTarget in $registryTargets) {
            reg add $registryTarget /f | Out-File -FilePath $setupLog -Append
            foreach ($icdTarget in $icdTargets) {
              reg add $registryTarget /v "$icdTarget" /t REG_DWORD /d 0 /f | Out-File -FilePath $setupLog -Append
              "Registered Vulkan ICD $icdTarget in $registryTarget" | Out-File -FilePath $setupLog -Append
            }
            reg query $registryTarget | Out-File -FilePath $setupLog -Append
          }
          (Split-Path -Parent $sourceDll) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Preflight GPU runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-gpu-vulkan --output artifacts\windows-standalone-vulkan\preflight.json --require-command glslangValidator --require-command spirv-val --require-env VK_ICD_FILENAMES

      - name: Capture Vulkan diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-standalone-vulkan | Out-Null
          $out = "artifacts\windows-standalone-vulkan\vulkaninfo.txt"
          $vulkanInfo = Get-Command vulkaninfo -ErrorAction SilentlyContinue
          if (-not $vulkanInfo) {
            "vulkaninfo not found" | Out-File -FilePath $out
            exit 0
          }
          "VK_ICD_FILENAMES=$env:VK_ICD_FILENAMES" | Out-File -FilePath $out
          "VK_DRIVER_FILES=$env:VK_DRIVER_FILES" | Out-File -FilePath $out -Append
          "VK_ADD_DRIVER_FILES=$env:VK_ADD_DRIVER_FILES" | Out-File -FilePath $out -Append
          "ICD exists=$(Test-Path $env:VK_ICD_FILENAMES)" | Out-File -FilePath $out -Append
          Get-Content -Raw $env:VK_ICD_FILENAMES | Out-File -FilePath $out -Append
          $env:VK_LOADER_DEBUG = "error,warn"
          & $vulkanInfo.Source --summary *>> $out
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $out -Append
          exit 0

      - name: Capture DirectX baseline
        shell: pwsh
        run: .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 -Configuration Release -SkipBuild -OutputPath .\build\baseline-captures\windows-directx-playerframe60.ppm

      - name: Run Vulkan smoke against baseline
        timeout-minutes: 12
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-vulkan-sample1-smoke.ps1 -Configuration Release -SkipBuild -KeepArtifacts -DurationSeconds 420 -PresentSeconds 120 -MaxFrame 7200

      - name: Capture and classify Vulkan face orientation
        shell: pwsh
        run: |
          .\code\appImmViewer\scripts\capture_windows_vulkan_validation.ps1 `
            -Configuration Release -SkipBuild -PlayerFrame 0 `
            -SamplePath .\exampleImmFiles\face-orientation.imm `
            -OutputPath .\artifacts\windows-standalone-vulkan\face-orientation.ppm `
            -MinPictureDrawCalls 0 -MinPicture360DrawCalls 0 -MinPicture360EquirectDrawCalls 0
          python tests\tools\classify_face_orientation_capture.py `
            artifacts\windows-standalone-vulkan\face-orientation.ppm `
            --status-output artifacts\windows-standalone-vulkan\face-orientation-status.json `
            --capture-output artifacts\windows-standalone-vulkan\captures\face-orientation\vulkan.png `
            --overlay-output artifacts\windows-standalone-vulkan\captures\face-orientation\vulkan-overlay.png

      - name: Compare Vulkan render metrics against committed DirectX baseline
        if: always()
        shell: pwsh
        run: |
          $candidate = ".\code\appImmViewer\exe\vulkan_sample1_smoke.ppm"
          $reference = ".\tests\baselines\render\windows-directx-sample1.ppm"
          if ((Test-Path $candidate) -and (Test-Path $reference)) {
            python tests\tools\compare_render_metrics.py $candidate `
              --reference $reference `
              --contract tests\baselines\render\windows-directx-sample1.json `
              --json-output artifacts\windows-standalone-vulkan\vulkan-vs-committed-directx-render-metrics.json
          }
          else {
            Write-Host "Skipping Vulkan metrics comparison because capture evidence is incomplete."
            Write-Host "candidate_exists=$(Test-Path $candidate)"
            Write-Host "reference_exists=$(Test-Path $reference)"
          }

      - name: Stage Vulkan capture evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-standalone-vulkan | Out-Null
          $captures = @(
            @{
              Source = ".\code\appImmViewer\exe\vulkan_sample1_smoke.ppm"
              Target = "artifacts\windows-standalone-vulkan\vulkan_sample1_smoke.ppm"
            },
            @{
              Source = ".\build\baseline-captures\windows-directx-playerframe60.ppm"
              Target = "artifacts\windows-standalone-vulkan\windows-directx-playerframe60.ppm"
            },
            @{
              Source = ".\tests\baselines\render\windows-directx-sample1.ppm"
              Target = "artifacts\windows-standalone-vulkan\windows-directx-sample1-committed.ppm"
            }
          )
          foreach ($capture in $captures) {
            if (Test-Path $capture.Source) {
              Copy-Item -Force $capture.Source $capture.Target
              Write-Host "Staged capture evidence: $($capture.Target)"
            }
            else {
              Write-Host "Capture evidence missing: $($capture.Source)"
            }
          }

      - name: Write Vulkan render report
        if: always()
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\windows-standalone-vulkan\vulkan-vs-committed-directx-render-metrics.json
          --reference-capture artifacts\windows-standalone-vulkan\windows-directx-sample1-committed.ppm
          --candidate-capture artifacts\windows-standalone-vulkan\vulkan_sample1_smoke.ppm
          --output-dir artifacts\windows-standalone-vulkan\captures
          --markdown-output artifacts\windows-standalone-vulkan\render-report.md

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\windows-standalone-vulkan\manifest.json --product standalone --platform-name windows --mode non-vr --renderer vulkan --include artifacts\windows-standalone-vulkan
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-vulkan --require-manifest --output artifacts\windows-standalone-vulkan\artifact-summary.json

      - name: Upload GPU artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneVulkan-GPU
          path: |
            artifacts/windows-standalone-vulkan
            code/appImmViewer/exe/debug.txt
          if-no-files-found: ignore
          retention-days: 14

  windows-standalone-opengl:
    name: Windows Standalone OpenGL
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-Windows
          path: artifacts/prebuilt-windows-viewer

      - name: Stage Windows viewer build artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts\prebuilt-windows-viewer -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            Copy-Item -Destination code\appImmViewer\exe -Force

      - name: Install Mesa llvmpipe OpenGL
        id: msys2-standalone-opengl
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-mesa

      - name: Configure Mesa llvmpipe OpenGL
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2-standalone-opengl.outputs.msys2-location }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows-standalone-opengl | Out-Null
          $setupLog = "artifacts\windows-standalone-opengl\opengl-driver-setup.txt"
          $searchRoots = @($env:MSYS2_LOCATION, "C:\msys64") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          "MSYS2_LOCATION=$env:MSYS2_LOCATION" | Out-File -FilePath $setupLog
          "Search roots:" | Out-File -FilePath $setupLog -Append
          $searchRoots | Out-File -FilePath $setupLog -Append
          $openglDll = @($searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "opengl32.dll" -ErrorAction SilentlyContinue }) |
            Where-Object { $_.FullName -like "*\mingw64\bin\*" } |
            Select-Object -First 1
          if (-not $openglDll) {
            throw "Mesa opengl32.dll was not found under: $($searchRoots -join ', ')"
          }
          $mesaBin = Split-Path -Parent $openglDll.FullName
          $viewerDir = "code\appImmViewer\exe"
          New-Item -ItemType Directory -Force -Path $viewerDir | Out-Null
          Copy-Item -Force $openglDll.FullName (Join-Path $viewerDir "opengl32.dll")
          "Selected Mesa OpenGL DLL=$($openglDll.FullName)" | Out-File -FilePath $setupLog -Append
          "Viewer OpenGL DLL=$(Join-Path $viewerDir "opengl32.dll")" | Out-File -FilePath $setupLog -Append
          $mesaBin | Out-File -FilePath $env:GITHUB_PATH -Append
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBGL_ALWAYS_SOFTWARE=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Preflight OpenGL runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-standalone-opengl --output artifacts\windows-standalone-opengl\preflight.json

      - name: Capture OpenGL sample1
        timeout-minutes: 5
        shell: pwsh
        run: >
          .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1
          -Configuration Release
          -SkipBuild
          -SettingsPath .\code\appImmViewer\exe\settings-baseline-opengl-sample1.json
          -OutputPath .\artifacts\windows-standalone-opengl\windows-opengl-sample1.ppm

      - name: Capture and classify OpenGL face orientation
        shell: pwsh
        run: |
          .\code\appImmViewer\scripts\capture_windows_directx_baseline.ps1 `
            -Configuration Release -SkipBuild -PlayerFrame 0 `
            -SettingsPath .\code\appImmViewer\exe\settings-baseline-opengl-sample1.json `
            -SamplePath .\exampleImmFiles\face-orientation.imm `
            -OutputPath .\artifacts\windows-standalone-opengl\face-orientation.ppm `
            -MinPictureDrawCalls 0 -MinPicture360DrawCalls 0 -MinPicture360EquirectDrawCalls 0
          python tests\tools\classify_face_orientation_capture.py `
            artifacts\windows-standalone-opengl\face-orientation.ppm `
            --status-output artifacts\windows-standalone-opengl\face-orientation-status.json `
            --capture-output artifacts\windows-standalone-opengl\captures\face-orientation\opengl.png `
            --overlay-output artifacts\windows-standalone-opengl\captures\face-orientation\opengl-overlay.png

      - name: Compare OpenGL render metrics against committed DirectX baseline
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py artifacts\windows-standalone-opengl\windows-opengl-sample1.ppm
          --reference tests\baselines\render\windows-directx-sample1.ppm
          --contract tests\baselines\render\windows-directx-sample1.json
          --json-output artifacts\windows-standalone-opengl\opengl-vs-committed-directx-render-metrics.json

      - name: Write OpenGL render report
        if: always()
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\windows-standalone-opengl\opengl-vs-committed-directx-render-metrics.json
          --reference-capture tests\baselines\render\windows-directx-sample1.ppm
          --candidate-capture artifacts\windows-standalone-opengl\windows-opengl-sample1.ppm
          --output-dir artifacts\windows-standalone-opengl\captures
          --markdown-output artifacts\windows-standalone-opengl\render-report.md

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts\windows-standalone-opengl\manifest.json --product standalone --platform-name windows --mode non-vr --renderer opengl --include artifacts\windows-standalone-opengl
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-opengl --require-manifest --output artifacts\windows-standalone-opengl\artifact-summary.json

      - name: Upload OpenGL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneOpenGL-GPU
          path: artifacts/windows-standalone-opengl
          if-no-files-found: ignore
          retention-days: 14

  windows-standalone-openxr-vr:
    name: Windows Standalone OpenXR VR
    # Keep lane code in place; run only when headset-capable CI is explicitly enabled.
    if: inputs.hardware && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')) && vars.CI_ENABLE_VR_CHECKS == 'true'
    runs-on: [self-hosted, windows, gpu, vr, openxr]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-Windows
          path: artifacts/prebuilt-windows-viewer

      - name: Stage Windows viewer build artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts\prebuilt-windows-viewer -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            Copy-Item -Destination code\appImmViewer\exe -Force

      - name: Preflight Windows OpenXR VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-openxr-vr --output artifacts\windows-standalone-openxr-vr\preflight.json

      - name: Run Windows OpenXR VR smoke
        timeout-minutes: 10
        shell: pwsh
        run: .\code\appImmViewer\scripts\run-windows-openxr-vr-smoke.ps1 -Configuration Release -SkipBuild -LogDir artifacts\windows-standalone-openxr-vr

      - name: Verify Windows OpenXR VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\windows-standalone-openxr-vr\debug.txt
          --label windows-standalone-openxr-vr
          --require "XR Runtime: OpenXR"
          --require "Rendering in VR: yes"
          --require "IMM_OPENXR_STANDALONE createInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE getHmdSystemResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE enumerateStereoViewsFillResult=0"
          --require "IMM_OPENXR_STANDALONE createSessionResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE beginSessionResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE waitFrameResult=0 resultName=XR_SUCCESS shouldRender=1"
          --require "IMM_OPENXR_STANDALONE beginFrameResult=0 resultName=XR_SUCCESS"
          --require "IMM_OPENXR_STANDALONE endFrameResult=0 resultName=XR_SUCCESS layerCount=1 projectionViews=2"
          --require "OpenXR standalone startup probe passed"
          --forbid "OpenXR standalone startup probe failed"
          --forbid "Cannot do VR"
          --output artifacts\windows-standalone-openxr-vr\openxr-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\windows-standalone-openxr-vr\manifest.json --product standalone --platform-name windows --mode vr --renderer openxr --include artifacts\windows-standalone-openxr-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-openxr-vr --require-manifest --output artifacts\windows-standalone-openxr-vr\artifact-summary.json

      - name: Upload OpenXR VR artifacts
