          --require "XR Runtime: Legacy"
          --require "Rendering in VR: yes"
          --require "IMM_LEGACY_VR_SMOKE hmd_initialized"
          --require "Viewer initialized"
          --require "IMM_LEGACY_VR_SMOKE frame_submitted"
          --forbid "Cannot do VR"
          --forbid "Viewer init failed"
          --forbid "Failed to create render target"
          --output artifacts\windows-standalone-opengl-vr\opengl-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\windows-standalone-opengl-vr\manifest.json --product standalone --platform-name windows --mode vr --renderer opengl --include artifacts\windows-standalone-opengl-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\windows-standalone-opengl-vr --require-manifest --output artifacts\windows-standalone-opengl-vr\artifact-summary.json

      - name: Upload OpenGL VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsStandaloneOpenGLVR-GPU
          path: artifacts/windows-standalone-opengl-vr
          if-no-files-found: ignore
          retention-days: 14

  windows-godot-vulkan:
    name: Windows Godot Vulkan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-Windows
          path: artifacts/prebuilt-windows-viewer

      - name: Stage Windows viewer build artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts\prebuilt-windows-viewer -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") } |
            Copy-Item -Destination code\appImmViewer\exe -Force

      - name: Download Windows Godot extension build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Godot
          path: artifacts/prebuilt-godot-windows

      - name: Stage Windows Godot extension build artifact
        shell: pwsh
        run: |
          $destinationRoot = "code\ImmGodotSampleProject\addons\imm_viewer\bin\windows"
          foreach ($variant in @("debug", "release")) {
            $destination = Join-Path $destinationRoot $variant
            New-Item -ItemType Directory -Force $destination | Out-Null
            Get-ChildItem $destination -Filter *.dll -File -ErrorAction SilentlyContinue | Remove-Item -Force
            $sources = @(Get-ChildItem artifacts\prebuilt-godot-windows -Recurse -Filter *.dll -File |
              Where-Object { $_.FullName -match "[\\/]$variant[\\/]" })
            if (-not $sources) {
              throw "Build workflow did not provide $variant Windows Godot DLLs"
            }
            $sources | Copy-Item -Destination $destination -Force
          }

      - name: Install Mesa lavapipe
        id: msys2-godot-vulkan
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-mesa
            mingw-w64-x86_64-spirv-tools

      - name: Configure Mesa lavapipe Vulkan ICD
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2-godot-vulkan.outputs.msys2-location }}
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\godot-smoke-windows-vulkan | Out-Null
          $setupLog = "artifacts\godot-smoke-windows-vulkan\vulkan-driver-setup.txt"
          $searchRoots = @($env:MSYS2_LOCATION, "C:\msys64") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $mingwBin = Join-Path ($searchRoots | Select-Object -First 1) "mingw64\bin"
          if (Test-Path $mingwBin) {
            $mingwBin | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          "MSYS2_LOCATION=$env:MSYS2_LOCATION" | Out-File -FilePath $setupLog
          "MINGW64_BIN=$mingwBin" | Out-File -FilePath $setupLog -Append
          "Search roots:" | Out-File -FilePath $setupLog -Append
          $searchRoots | Out-File -FilePath $setupLog -Append
          $icds = @($searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "lvp_icd*.json" -ErrorAction SilentlyContinue })
          $dlls = @($searchRoots | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter "vulkan_lvp.dll" -ErrorAction SilentlyContinue })
          "ICD candidates:" | Out-File -FilePath $setupLog -Append
          $icds.FullName | Out-File -FilePath $setupLog -Append
          "DLL candidates:" | Out-File -FilePath $setupLog -Append
          $dlls.FullName | Out-File -FilePath $setupLog -Append
          $sourceIcd = $icds | Where-Object { $_.FullName -like "*\mingw64\*" } | Select-Object -First 1
          if (-not $sourceIcd) {
            $sourceIcd = $icds | Select-Object -First 1
          }
          if (-not $sourceIcd) {
            throw "Mesa lavapipe ICD was not found under: $($searchRoots -join ', ')"
          }
          $driverRoot = $sourceIcd.FullName -replace "\\share\\vulkan\\icd\.d\\.*$", ""
          $sourceDll = Join-Path $driverRoot "bin\vulkan_lvp.dll"
          if (-not (Test-Path $sourceDll)) {
            $sourceDll = ($dlls | Where-Object { $_.FullName -like "$driverRoot\*" } | Select-Object -First 1).FullName
          }
          if (-not $sourceDll -or -not (Test-Path $sourceDll)) {
            throw "Mesa lavapipe DLL was not found for $($sourceIcd.FullName)"
          }
          $icdDir = Join-Path $env:GITHUB_WORKSPACE "lavapipe-vulkan"
          New-Item -ItemType Directory -Force -Path $icdDir | Out-Null
          $workspaceIcd = Join-Path $icdDir "lvp_icd.x86_64.json"
          $icdJson = Get-Content -Raw $sourceIcd.FullName | ConvertFrom-Json
          $icdJson.ICD.library_path = $sourceDll.Replace("\", "/")
          $icdJson | ConvertTo-Json -Depth 10 | Out-File -FilePath $workspaceIcd -Encoding utf8
          "Selected ICD=$($sourceIcd.FullName)" | Out-File -FilePath $setupLog -Append
          "Selected DLL=$sourceDll" | Out-File -FilePath $setupLog -Append
          "Workspace ICD=$workspaceIcd" | Out-File -FilePath $setupLog -Append
          Get-Content -Raw $workspaceIcd | Out-File -FilePath $setupLog -Append
          "VK_ICD_FILENAMES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_DRIVER_FILES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VK_ADD_DRIVER_FILES=$workspaceIcd" | Out-File -FilePath $env:GITHUB_ENV -Append
          $registryTargets = @(
            "HKCU\Software\Khronos\Vulkan\Drivers",
            "HKLM\SOFTWARE\Khronos\Vulkan\Drivers",
            "HKLM\SOFTWARE\WOW6432Node\Khronos\Vulkan\Drivers"
          )
          $icdTargets = @($workspaceIcd, $sourceIcd.FullName) | Select-Object -Unique
          foreach ($registryTarget in $registryTargets) {
            reg add $registryTarget /f | Out-File -FilePath $setupLog -Append
            foreach ($icdTarget in $icdTargets) {
              reg add $registryTarget /v "$icdTarget" /t REG_DWORD /d 0 /f | Out-File -FilePath $setupLog -Append
              "Registered Vulkan ICD $icdTarget in $registryTarget" | Out-File -FilePath $setupLog -Append
            }
            reg query $registryTarget | Out-File -FilePath $setupLog -Append
          }
          (Split-Path -Parent $sourceDll) | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Download Godot 4.5
        shell: pwsh
        run: |
          $version = "4.5-stable"
          $zipName = "Godot_v$($version)_win64.exe.zip"
          $url = "https://github.com/godotengine/godot-builds/releases/download/$version/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          Expand-Archive -Path $zipName -DestinationPath godot
          $godotExe = Get-ChildItem -Path godot -Filter "Godot*.exe" | Select-Object -First 1
          if (-not $godotExe) {
            throw "Godot executable not found after extracting $zipName"
          }
          "GODOT_EXE=$($godotExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Preflight Godot Vulkan runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-godot-vulkan --output artifacts\godot-smoke-windows-vulkan\preflight.json --require-env GODOT_EXE --require-env VK_ICD_FILENAMES

      - name: Capture Godot Vulkan diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\godot-smoke-windows-vulkan | Out-Null
          $out = "artifacts\godot-smoke-windows-vulkan\vulkaninfo.txt"
          $vulkanInfo = Get-Command vulkaninfo -ErrorAction SilentlyContinue
          if (-not $vulkanInfo) {
            "vulkaninfo not found" | Out-File -FilePath $out
            exit 0
          }
          "VK_ICD_FILENAMES=$env:VK_ICD_FILENAMES" | Out-File -FilePath $out
          "VK_DRIVER_FILES=$env:VK_DRIVER_FILES" | Out-File -FilePath $out -Append
          "VK_ADD_DRIVER_FILES=$env:VK_ADD_DRIVER_FILES" | Out-File -FilePath $out -Append
          "ICD exists=$(Test-Path $env:VK_ICD_FILENAMES)" | Out-File -FilePath $out -Append
          Get-Content -Raw $env:VK_ICD_FILENAMES | Out-File -FilePath $out -Append
          $env:VK_LOADER_DEBUG = "error,warn"
          & $vulkanInfo.Source --summary *>> $out
          "exit_code=$LASTEXITCODE" | Out-File -FilePath $out -Append
          exit 0

      - name: Run Godot project Run-button smoke
        id: godot_sample_play
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: >
          .\code\projects\windows\run-godot-sample-play-smoke.ps1
          -GodotExe $env:GODOT_EXE
          -CapturePath artifacts\godot-smoke-windows-vulkan\godot-sample-play.png
          -LogDir artifacts\godot-smoke-windows-vulkan\sample-play
          -TimeoutSeconds 180

      - name: Record Godot project Run-button render metrics
        id: godot_sample_play_metrics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\compare_render_metrics.py
          artifacts\godot-smoke-windows-vulkan\godot-sample-play.png
          --reference tests\baselines\render\godot-windows-vulkan-sample-play.png
          --contract tests\baselines\render\godot-windows-vulkan-sample-play.json
          --json-output artifacts\godot-smoke-windows-vulkan\godot-sample-play-metrics.json

      - name: Write Godot project Run-button render report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\godot-smoke-windows-vulkan\godot-sample-play-metrics.json
          --reference-capture tests\baselines\render\godot-windows-vulkan-sample-play.png
          --candidate-capture artifacts\godot-smoke-windows-vulkan\godot-sample-play.png
          --output-dir artifacts\godot-smoke-windows-vulkan\captures\sample-play
          --markdown-output artifacts\godot-smoke-windows-vulkan\sample-play-report.md

      - name: Verify Godot project Run-button log contract
        id: godot_sample_play_log
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\godot-smoke-windows-vulkan\sample-play\godot-sample-play-controller.log
          --label godot-windows-vulkan-sample-play
          --require "[IMM_GODOT_SAMPLE_PLAY_20260803] passed"
          --forbid "[IMM_GODOT_SAMPLE_PLAY_20260803] failed"
          --output artifacts\godot-smoke-windows-vulkan\godot-sample-play-log-contract.json

      - name: Run Godot Vulkan render-only baseline smoke
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: >
          .\code\projects\windows\run-godot-vulkan-visual-baseline-smoke.ps1
          -Configuration Release
          -SkipBuild
          -CompositionMode render_only
          -ReferencePath .\tests\baselines\render\windows-directx-sample1.ppm
          -CapturePath artifacts\godot-smoke-windows-vulkan\godot-vulkan-render.ppm
          -RenderCapturePath artifacts\godot-smoke-windows-vulkan-render-only\godot-vulkan-render-precheck.ppm
          -LogDir artifacts\godot-smoke-windows-vulkan-render-only

      - name: Capture and classify Godot Vulkan face orientation
        continue-on-error: true
        shell: pwsh
        run: |
          $smokeStatus = 0
          try {
            .\code\projects\windows\run-godot-vulkan-visual-baseline-smoke.ps1 `
              -Configuration Release -SkipBuild -CompositionMode render_only -PlayerFrame 0 `
              -DocumentPath res://../../exampleImmFiles/face-orientation.imm `
              -ReferencePath .\tests\baselines\render\windows-directx-sample1.ppm `
              -CapturePath artifacts\godot-smoke-windows-vulkan\face-orientation-scene.ppm `
              -RenderCapturePath artifacts\godot-smoke-windows-vulkan\face-orientation.ppm `
              -LogDir artifacts\godot-smoke-windows-vulkan\face-orientation
          } catch {
            $smokeStatus = 1
          }
          "godot_exit=$smokeStatus" | Set-Content artifacts\godot-smoke-windows-vulkan\face-orientation-runtime-status.txt
          if (!(Test-Path artifacts\godot-smoke-windows-vulkan\face-orientation.ppm)) {
            throw "Godot Vulkan face-orientation capture is missing"
          }
          python tests\tools\classify_face_orientation_capture.py `
            artifacts\godot-smoke-windows-vulkan\face-orientation.ppm `
            --status-output artifacts\godot-smoke-windows-vulkan\face-orientation-status.json `
            --capture-output artifacts\godot-smoke-windows-vulkan\captures\face-orientation\godot-vulkan.png `
            --overlay-output artifacts\godot-smoke-windows-vulkan\captures\face-orientation\godot-vulkan-overlay.png

      - name: Run Godot Vulkan visual baseline smoke
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $passed = $false
          foreach ($attempt in 1..2) {
            try {
              .\code\projects\windows\run-godot-vulkan-visual-baseline-smoke.ps1 `
                -Configuration Release `
                -SkipBuild `
                -ReferencePath .\tests\baselines\render\windows-directx-sample1.ppm `
                -CapturePath artifacts\godot-smoke-windows-vulkan\godot-vulkan-visual.ppm `
                -RenderCapturePath artifacts\godot-smoke-windows-vulkan\godot-vulkan-full-depth-preprobe.ppm `
                -LogDir artifacts\godot-smoke-windows-vulkan
              $passed = $true
              break
            }
            catch {
              Write-Warning "[IMM_GODOT_CI_RETRY_20260811] full-depth attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 2) { throw }
            }
          }
          if (-not $passed) { throw "Godot Vulkan full-depth smoke did not complete" }

      - name: Record Godot Vulkan full depth metrics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $validationFailed = $false
          python tests\tools\compare_render_metrics.py `
            artifacts\godot-smoke-windows-vulkan\godot-vulkan-render.ppm `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\godot-windows-vulkan-sample1.json `
            --json-output artifacts\godot-smoke-windows-vulkan\godot-vulkan-render-metrics.json
          if ($LASTEXITCODE -ne 0) { $validationFailed = $true }
          python tests\tools\compare_render_metrics.py `
            artifacts\godot-smoke-windows-vulkan\godot-vulkan-visual.ppm `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\sample1-full-depth.json `
            --json-output artifacts\godot-smoke-windows-vulkan\godot-vulkan-full-depth-render-metrics.json `
            --diagnostic-overlay-output artifacts\godot-smoke-windows-vulkan\godot-vulkan-full-depth-diagnostic.png
          if ($LASTEXITCODE -ne 0) { $validationFailed = $true }
          if ($validationFailed) { exit 1 }

      - name: Run Godot Vulkan ordered overlay smoke
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: >
          .\code\projects\windows\run-godot-vulkan-visual-baseline-smoke.ps1
          -Configuration Release
          -SkipBuild
          -CompositionMode ordered_overlay
          -CapturePath artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay.ppm
          -RenderCapturePath artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay-preprobe.ppm
          -LogDir artifacts\godot-smoke-windows-vulkan-ordered-overlay

      - name: Record Godot Vulkan ordered overlay metrics
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $validationFailed = $false
          python tests\tools\compare_render_metrics.py `
            artifacts\godot-smoke-windows-vulkan\godot-vulkan-render.ppm `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\godot-windows-vulkan-sample1.json `
            --json-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-render-metrics.json
          if ($LASTEXITCODE -ne 0) { $validationFailed = $true }
          python tests\tools\compare_render_metrics.py `
            artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay.ppm `
            --reference tests\baselines\render\windows-directx-sample1.ppm `
            --contract tests\baselines\render\sample1-ordered-overlay.json `
            --json-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay-metrics.json `
            --diagnostic-overlay-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay-diagnostic.png
          if ($LASTEXITCODE -ne 0) { $validationFailed = $true }
          if ($validationFailed) { exit 1 }

      - name: Classify Windows Godot Vulkan evidence
        if: always()
        shell: pwsh
        run: >
          python tests\tools\classify_windows_godot_vulkan.py
          --artifact-dir artifacts\godot-smoke-windows-vulkan
          --render-only-dir artifacts\godot-smoke-windows-vulkan-render-only
          --ordered-overlay-dir artifacts\godot-smoke-windows-vulkan-ordered-overlay
          --output artifacts\godot-smoke-windows-vulkan\windows-godot-vulkan-status.json
          --full-depth-status-output artifacts\godot-smoke-windows-vulkan\composition-status.json
          --ordered-overlay-status-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\composition-status.json

      - name: Write Godot Vulkan render report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\godot-smoke-windows-vulkan\godot-vulkan-full-depth-render-metrics.json
          --candidate-capture artifacts\godot-smoke-windows-vulkan\godot-vulkan-visual.ppm
          --status-json artifacts\godot-smoke-windows-vulkan\composition-status.json
          --output-dir artifacts\godot-smoke-windows-vulkan\captures
          --markdown-output artifacts\godot-smoke-windows-vulkan\render-report.md
      - name: Write Godot Vulkan render baseline report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\godot-smoke-windows-vulkan\godot-vulkan-render-metrics.json
          --candidate-capture artifacts\godot-smoke-windows-vulkan\godot-vulkan-render.ppm
          --output-dir artifacts\godot-smoke-windows-vulkan\captures\render
          --markdown-output artifacts\godot-smoke-windows-vulkan\render-baseline-report.md

      - name: Write Godot Vulkan ordered overlay report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay-metrics.json
          --candidate-capture artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-ordered-overlay.ppm
          --status-json artifacts\godot-smoke-windows-vulkan-ordered-overlay\composition-status.json
          --output-dir artifacts\godot-smoke-windows-vulkan-ordered-overlay\captures
          --markdown-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\render-report.md
      - name: Write Godot Vulkan ordered overlay baseline report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: >
          python tests\tools\write_render_report.py
          --metrics-json artifacts\godot-smoke-windows-vulkan-ordered-overlay\godot-vulkan-render-metrics.json
          --candidate-capture artifacts\godot-smoke-windows-vulkan\godot-vulkan-render.ppm
          --output-dir artifacts\godot-smoke-windows-vulkan-ordered-overlay\captures\render
          --markdown-output artifacts\godot-smoke-windows-vulkan-ordered-overlay\render-baseline-report.md

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --classification-json artifacts\godot-smoke-windows-vulkan\windows-godot-vulkan-status.json --output artifacts\godot-smoke-windows-vulkan\manifest.json --product godot --platform-name windows --mode non-vr --renderer vulkan --include artifacts\godot-smoke-windows-vulkan --include artifacts\godot-smoke-windows-vulkan-render-only --include artifacts\godot-smoke-windows-vulkan-ordered-overlay
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\godot-smoke-windows-vulkan --require-manifest --output artifacts\godot-smoke-windows-vulkan\artifact-summary.json

      - name: Upload Godot Vulkan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsGodotVulkan-GPU
          path: |
            artifacts/godot-smoke-windows-vulkan
            artifacts/godot-smoke-windows-vulkan-render-only
            artifacts/godot-smoke-windows-vulkan-ordered-overlay
          if-no-files-found: ignore
          retention-days: 14

  windows-godot-openxr-vr:
    name: Windows Godot OpenXR VR
    # Keep lane code in place; run only when headset-capable CI is explicitly enabled.
    if: inputs.hardware && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')) && vars.CI_ENABLE_VR_CHECKS == 'true'
    runs-on: [self-hosted, windows, gpu, godot, vr, openxr]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows Godot extension build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Godot
          path: artifacts/prebuilt-godot-windows

      - name: Stage Windows Godot extension build artifact
        shell: pwsh
        run: |
          $destinationRoot = "code\ImmGodotSampleProject\addons\imm_viewer\bin\windows"
          foreach ($variant in @("debug", "release")) {
            $destination = Join-Path $destinationRoot $variant
            New-Item -ItemType Directory -Force $destination | Out-Null
            Get-ChildItem $destination -Filter *.dll -File -ErrorAction SilentlyContinue | Remove-Item -Force
            $sources = @(Get-ChildItem artifacts\prebuilt-godot-windows -Recurse -Filter *.dll -File |
              Where-Object { $_.FullName -match "[\\/]$variant[\\/]" })
            if (-not $sources) {
              throw "Build workflow did not provide $variant Windows Godot DLLs"
            }
            $sources | Copy-Item -Destination $destination -Force
          }

      - name: Preflight Godot OpenXR VR runner
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile windows-godot-openxr-vr --output artifacts\godot-openxr-vr\preflight.json --require-env GODOT_EXE

      - name: Run Godot OpenXR VR smoke
        timeout-minutes: 10
        shell: pwsh
        run: .\code\projects\windows\run-godot-openxr-vr-smoke.ps1 -Configuration Release -SkipBuild -LogDir artifacts\godot-openxr-vr

      - name: Verify Godot OpenXR VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\godot-openxr-vr\godot-openxr-vr-output.log
          --label godot-openxr-vr
          --require "IMM_GODOT_OPENXR_SMOKE begin"
          --require "IMM_GODOT_OPENXR_SMOKE interface_initialized"
          --require "IMM_GODOT_OPENXR_SMOKE viewport_use_xr=1"
          --require "IMM_GODOT_OPENXR_SMOKE primary_interface=OpenXR"
          --require "IMM_GODOT_OPENXR_SMOKE viewer_initialized"
          --require "IMM_GODOT_OPENXR_SMOKE load_document_result=0"
          --require "IMM_GODOT_OPENXR_SMOKE document_ready"
          --require "IMM_GODOT_OPENXR_SMOKE frame_submitted"
          --require "IMM Godot OpenXR VR smoke passed"
          --forbid "IMM_GODOT_OPENXR_SMOKE failed"
          --forbid "OpenXR interface was not found"
          --forbid "OpenXR interface initialize() returned false"
          --forbid "ImmViewer did not load"
          --forbid "ImmViewer sequence was not ready"
          --output artifacts\godot-openxr-vr\godot-openxr-vr-log-contract.json

      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\godot-openxr-vr\manifest.json --product godot --platform-name windows --mode vr --renderer openxr --include artifacts\godot-openxr-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\godot-openxr-vr --require-manifest --output artifacts\godot-openxr-vr\artifact-summary.json

      - name: Upload Godot OpenXR VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WindowsGodotOpenXRVR-GPU
          path: artifacts/godot-openxr-vr
          if-no-files-found: ignore
          retention-days: 14

  macos-standalone-metal:
    name: macOS Standalone Metal
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download macOS viewer build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmViewer-macOS
          path: artifacts/prebuilt-macos-viewer

      - name: Preflight macOS Metal runner
        run: python3 tests/tools/preflight_runner.py --profile macos-standalone-metal --output artifacts/macos-standalone-metal/preflight.json --require-command git

      - name: Verify macOS Metal build artifact
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test -f artifacts/prebuilt-macos-viewer/appImmViewerMetal.app/Contents/MacOS/appImmViewerMetal
          test -f artifacts/prebuilt-macos-viewer/validation/macos-metal-static.ppm

      - name: Stage macOS Metal face-orientation evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/macos-standalone-metal/captures/face-orientation
          cp artifacts/prebuilt-macos-viewer/validation/face-orientation-status.json artifacts/macos-standalone-metal/face-orientation-status.json
          cp artifacts/prebuilt-macos-viewer/validation/captures/face-orientation/metal.png artifacts/macos-standalone-metal/captures/face-orientation/metal.png
          cp artifacts/prebuilt-macos-viewer/validation/captures/face-orientation/metal-overlay.png artifacts/macos-standalone-metal/captures/face-orientation/metal-overlay.png

      - name: Record macOS Metal render metrics
        run: >
          python3 tests/tools/compare_render_metrics.py artifacts/prebuilt-macos-viewer/validation/macos-metal-static.ppm
          --reference tests/baselines/render/windows-directx-sample1.ppm
          --contract tests/baselines/render/macos-standalone-metal-sample1.json
          --json-output artifacts/macos-standalone-metal/macos-metal-render-metrics.json

      - name: Write macOS Metal render report
        if: always()
        run: >
          python3 tests/tools/write_render_report.py
          --metrics-json artifacts/macos-standalone-metal/macos-metal-render-metrics.json
          --candidate-capture artifacts/prebuilt-macos-viewer/validation/macos-metal-static.ppm
          --output-dir artifacts/macos-standalone-metal/captures
          --markdown-output artifacts/macos-standalone-metal/render-report.md

      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class visual --output artifacts/macos-standalone-metal/manifest.json --product standalone --platform-name macos --mode non-vr --renderer metal --include artifacts/macos-standalone-metal

      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/macos-standalone-metal --require-manifest --output artifacts/macos-standalone-metal/artifact-summary.json

      - name: Upload macOS Standalone Metal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOSStandaloneMetal-GPU
          path: artifacts/macos-standalone-metal
          if-no-files-found: ignore
          retention-days: 14

  macos-godot-metal:
    name: macOS Godot Metal
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot for macOS
        run: |
          set -euo pipefail
          version="${GODOT_VERSION:-4.5-stable}"
          zip_name="Godot_v${version}_macos.universal.zip"
          url="https://github.com/godotengine/godot-builds/releases/download/${version}/${zip_name}"
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors "$url" -o "$zip_name"
          mkdir -p godot-macos
          unzip -q "$zip_name" -d godot-macos
          godot_exe="$(find godot-macos -path '*/Godot.app/Contents/MacOS/Godot' -type f | head -n 1)"
          if [ -z "$godot_exe" ]; then
            echo "Godot executable not found after extracting $zip_name" >&2
            exit 1
          fi
          echo "GODOT_EXE=$PWD/$godot_exe" >> "$GITHUB_ENV"

      - name: Preflight Godot Metal runner
        run: python3 tests/tools/preflight_runner.py --profile macos-godot-metal --output artifacts/godot-smoke-macos-metal/preflight.json --require-command git --require-env GODOT_EXE

      - name: Download macOS Godot extension build artifact
        uses: actions/download-artifact@v4
        with:
          name: ImmPlayerPlugin-Godot
          path: artifacts/prebuilt-godot-macos

      - name: Stage macOS Godot extension build artifact
        run: |
          set -euo pipefail
          extension="$(find artifacts/prebuilt-godot-macos -name libimm_godot_extension.dylib -type f | head -n 1)"
          native="$(find artifacts/prebuilt-godot-macos -name libImmGodotPlugin.dylib -type f | head -n 1)"
          test -n "$extension"
          test -n "$native"
          rm -f code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/release/libimm_godot_extension.dylib
          rm -f code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/release/libImmGodotPlugin.dylib
          rm -f code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/debug/libimm_godot_extension.dylib
          rm -f code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/debug/libImmGodotPlugin.dylib
          mkdir -p code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/release
          mkdir -p code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/debug
          cp "$extension" code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/release/libimm_godot_extension.dylib
          cp "$native" code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/release/libImmGodotPlugin.dylib
          cp "$extension" code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/debug/libimm_godot_extension.dylib
          cp "$native" code/ImmGodotSampleProject/addons/imm_viewer/bin/macos/debug/libImmGodotPlugin.dylib

      - name: Run Godot Metal visual smoke
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -euo pipefail
          : "${GODOT_EXE:?GODOT_EXE must point to a Godot 4.5+ executable}"
          mkdir -p artifacts/godot-smoke-macos-metal
          smoke_status=0
          IMM_GODOT_VISUAL_SMOKE=1 \
          IMM_GODOT_VISUAL_SMOKE_WIDTH=1024 \
          IMM_GODOT_VISUAL_SMOKE_HEIGHT=576 \
          IMM_GODOT_VISUAL_SMOKE_USE_SPAWN_AREA=1 \
          IMM_GODOT_RENDER_GRAPH_DEPTH_COMPOSITION=1 \
          IMM_GODOT_DEBUG=1 \
          IMM_GODOT_LOG_FILE="$PWD/artifacts/godot-smoke-macos-metal/imm-godot-native.log" \
          IMM_GODOT_VISUAL_SMOKE_RENDER_PNG="$PWD/artifacts/godot-smoke-macos-metal/metal_render_baseline.png" \
          IMM_GODOT_VISUAL_SMOKE_PNG="$PWD/artifacts/godot-smoke-macos-metal/metal_visual_smoke.png" \
          "$GODOT_EXE" --path code/ImmGodotSampleProject --rendering-driver metal --rendering-method forward_plus --resolution 1024x576 --scene res://scenes/VisualSmokeScene.tscn --fixed-fps 30 \
            > artifacts/godot-smoke-macos-metal/godot-metal-smoke.log 2>&1 || smoke_status=$?
          python3 tests/tools/classify_godot_visual_smoke.py \
            --log artifacts/godot-smoke-macos-metal/godot-metal-smoke.log \
            --renderer metal \
            --composition-mode full_depth \
            --output artifacts/godot-smoke-macos-metal/composition-status.json
          if [ "$smoke_status" -ne 0 ]; then
            exit "$smoke_status"
          fi

      - name: Capture and classify Godot Metal face orientation
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${GODOT_EXE:?GODOT_EXE must point to a Godot 4.5+ executable}"
          mkdir -p artifacts/godot-smoke-macos-metal/captures/face-orientation
          smoke_status=0
          IMM_GODOT_VISUAL_SMOKE=1 \
          IMM_GODOT_VISUAL_DOCUMENT_PATH="res://../../exampleImmFiles/face-orientation.imm" \
          IMM_GODOT_VISUAL_SMOKE_PLAYER_FRAME=0 \
          IMM_GODOT_VISUAL_SMOKE_COMPOSITION_MODE=render_only \
          IMM_GODOT_VISUAL_SMOKE_USE_SPAWN_AREA=1 \
          IMM_GODOT_VISUAL_SMOKE_RELOAD_CYCLES=0 \
          IMM_GODOT_LOG_FILE="$PWD/artifacts/godot-smoke-macos-metal/face-orientation-native.log" \
          IMM_GODOT_VISUAL_SMOKE_RENDER_PNG="$PWD/artifacts/godot-smoke-macos-metal/face-orientation.png" \
          IMM_GODOT_VISUAL_SMOKE_PNG="$PWD/artifacts/godot-smoke-macos-metal/face-orientation-scene.png" \
          "$GODOT_EXE" --path code/ImmGodotSampleProject --rendering-driver metal --rendering-method forward_plus --resolution 1280x720 --scene res://scenes/VisualSmokeScene.tscn --fixed-fps 30 \
            > artifacts/godot-smoke-macos-metal/face-orientation.log 2>&1 || smoke_status=$?
          printf 'godot_exit=%s\n' "$smoke_status" > artifacts/godot-smoke-macos-metal/face-orientation-runtime-status.txt
          test -s artifacts/godot-smoke-macos-metal/face-orientation.png
          python3 tests/tools/classify_face_orientation_capture.py \
            artifacts/godot-smoke-macos-metal/face-orientation.png \
            --status-output artifacts/godot-smoke-macos-metal/face-orientation-status.json \
            --capture-output artifacts/godot-smoke-macos-metal/captures/face-orientation/godot-metal.png \
            --overlay-output artifacts/godot-smoke-macos-metal/captures/face-orientation/godot-metal-overlay.png

      - name: Verify Godot Metal audio pipeline
        if: always()
        run: |
          python3 tests/tools/verify_log_markers.py \
            --log artifacts/godot-smoke-macos-metal/imm-godot-native.log \
            --label godot-macos-metal-audio \
            --require "[IMM_AUDIO_PIPELINE_20260812] requested=AVFoundation active=AVFoundation" \
            --require "Decoded Ogg Opus sound to PCM temp WAV for AVFoundation" \
            --forbid "[IMM_AUDIO_PIPELINE_20260812] requested=AVFoundation active=Null" \
            --output artifacts/godot-smoke-macos-metal/audio-log-contract.json

      - name: Record Godot Metal render metrics
        if: always()
        continue-on-error: true
        run: |
          metrics_status=0
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-smoke-macos-metal/metal_render_baseline.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/macos-metal-sample1.json \
            --json-output artifacts/godot-smoke-macos-metal/godot-metal-render-metrics.json || metrics_status=$?
          python3 tests/tools/compare_render_metrics.py \
            artifacts/godot-smoke-macos-metal/metal_visual_smoke.png \
            --reference tests/baselines/render/windows-directx-sample1.ppm \
            --contract tests/baselines/render/sample1-full-depth.json \
            --json-output artifacts/godot-smoke-macos-metal/godot-metal-composition-metrics.json \
            --diagnostic-overlay-output artifacts/godot-smoke-macos-metal/godot-metal-composition-diagnostic.png || metrics_status=$?
          exit "$metrics_status"

      - name: Classify Godot Metal visual evidence
        if: always()
        run: >
          python3 tests/tools/classify_godot_visual_smoke.py
          --log artifacts/godot-smoke-macos-metal/godot-metal-smoke.log
          --renderer metal
          --composition-mode full_depth
          --render-capture artifacts/godot-smoke-macos-metal/metal_render_baseline.png
          --composition-capture artifacts/godot-smoke-macos-metal/metal_visual_smoke.png
          --render-metrics artifacts/godot-smoke-macos-metal/godot-metal-render-metrics.json
          --composition-metrics artifacts/godot-smoke-macos-metal/godot-metal-composition-metrics.json
          --output artifacts/godot-smoke-macos-metal/composition-status.json

      - name: Write Godot Metal render report
        if: always()
        continue-on-error: true
        run: >
          python3 tests/tools/write_render_report.py
          --metrics-json artifacts/godot-smoke-macos-metal/godot-metal-render-metrics.json
          --candidate-capture artifacts/godot-smoke-macos-metal/metal_render_baseline.png
          --output-dir artifacts/godot-smoke-macos-metal/captures/render
          --markdown-output artifacts/godot-smoke-macos-metal/render-report.md
      - name: Write Godot Metal composition report
        if: always()
        continue-on-error: true
        run: >
          python3 tests/tools/write_render_report.py
          --metrics-json artifacts/godot-smoke-macos-metal/godot-metal-composition-metrics.json
          --candidate-capture artifacts/godot-smoke-macos-metal/metal_visual_smoke.png
          --status-json artifacts/godot-smoke-macos-metal/composition-status.json
          --output-dir artifacts/godot-smoke-macos-metal/captures/composition
          --markdown-output artifacts/godot-smoke-macos-metal/composition-render-report.md

      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --classification-json artifacts/godot-smoke-macos-metal/composition-status.json --output artifacts/godot-smoke-macos-metal/manifest.json --product godot --platform-name macos --mode non-vr --renderer metal --include artifacts/godot-smoke-macos-metal
      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/godot-smoke-macos-metal --require-manifest --output artifacts/godot-smoke-macos-metal/artifact-summary.json

      - name: Upload Godot Metal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOSGodotMetal-GPU
          path: artifacts/godot-smoke-macos-metal
          if-no-files-found: ignore
          retention-days: 14

  gpu-evidence-report:
    name: GPU Evidence Report
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - windows-standalone-directx
      - windows-standalone-vulkan
      - windows-standalone-opengl
      - windows-standalone-openxr-vr
      - windows-standalone-opengl-vr
      - windows-godot-vulkan
      - windows-godot-openxr-vr
      - macos-standalone-metal
      - macos-godot-metal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download GPU artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-GPU"
          path: artifacts/gpu-evidence/input

      - name: Verify GPU matrix evidence
        run: >
          python tests/tools/verify_matrix_evidence.py tests/matrix_status.json
          --scope "$MATRIX_EVIDENCE_SCOPE"
          --gate-prefix "CI GPU Matrix /"
          --evidence-root artifacts/gpu-evidence/input
          --json-output artifacts/gpu-evidence/matrix-evidence.json
          --markdown-output artifacts/gpu-evidence/matrix-evidence.md

      - name: Upload GPU evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPUMatrixEvidence
          path: artifacts/gpu-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Hide per-lane GPU artifacts
        if: ${{ success() && vars.CI_VALIDATION_DEBUG_ARTIFACTS != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python tests/tools/delete_ci_artifacts.py
          --name WindowsStandaloneDirectX-GPU
          --name WindowsStandaloneVulkan-GPU
          --name WindowsStandaloneOpenGL-GPU
          --name WindowsStandaloneOpenXRVR-GPU
          --name WindowsStandaloneOpenGLVR-GPU
          --name WindowsGodotVulkan-GPU
          --name WindowsGodotOpenXRVR-GPU
          --name macOSStandaloneMetal-GPU
          --name macOSGodotMetal-GPU
