          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Build Android Vulkan APKs
        working-directory: code/projects/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :libImmCore:assembleDebug :libImmImporter:assembleDebug :libImmPlayer:assembleDebug :appImmViewer:assembleDebug :appImmViewer:assembleDebugAndroidTest -PimmNonVr=ON -PimmRendererApi=Vulkan -PimmBuildDir=build_vulkan_ftl
      - name: Run Android Vulkan smoke in Firebase Test Lab
        timeout-minutes: 30
        shell: bash
        run: >
          python tests/tools/run_firebase_test_lab_android.py
          --project "$FTL_PROJECT_ID"
          --results-bucket "$FTL_RESULTS_BUCKET"
          --results-dir "imm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-android-standalone-vulkan"
          --device "$FTL_DEVICE"
          --app code/projects/android/appImmViewer/build_vulkan_ftl/outputs/apk/debug/appImmViewer-debug.apk
          --test code/projects/android/appImmViewer/build_vulkan_ftl/outputs/apk/androidTest/debug/appImmViewer-debug-androidTest.apk
          --test-type instrumentation
          --artifact-dir artifacts/android-standalone-vulkan
          --timeout 5m
          --environment-variable renderer=Vulkan,waitSeconds=25
          --directory-to-pull /sdcard/Android/data/org.linuxfoundation.imm.player/files/imm-ftl
          --required-marker "IMM Android renderer API: Vulkan"
          --required-marker "IMMAVAL loadPath result=1"
          --required-marker "Loaded in CPU"
          --required-marker "Loaded in GPU"
          --required-marker "Vulkan renderer created Android surface"
          --required-marker "Vulkan renderer initialized with owned device"
          --required-marker "Vulkan renderer submitted picture draw commands"
          --required-marker "Vulkan renderer submitted static paint draw commands"
          --required-capture-name screencap_after.png
          --client-label "IMM Android Standalone Vulkan"
      - name: Record Android Vulkan screenshot metrics
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-standalone-vulkan/ftl-results -Recurse -Filter screencap_after.png -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($capture) {
            python tests/tools/compare_render_metrics.py $capture.FullName --json-output artifacts/android-standalone-vulkan/android-vulkan-screenshot-metrics.json
          } else {
            New-Item -ItemType Directory -Force artifacts/android-standalone-vulkan | Out-Null
            '{"passed":false,"errors":["missing Firebase Test Lab screencap_after.png"],"candidate":{}}' | Set-Content -Encoding utf8 artifacts/android-standalone-vulkan/android-vulkan-screenshot-metrics.json
          }
      - name: Write Android Vulkan screenshot report
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-standalone-vulkan/ftl-results -Recurse -Filter screencap_after.png -ErrorAction SilentlyContinue | Select-Object -First 1
          $captureArg = if ($capture) { $capture.FullName } else { "artifacts/android-standalone-vulkan/missing-screencap_after.png" }
          python tests/tools/write_render_report.py --metrics-json artifacts/android-standalone-vulkan/android-vulkan-screenshot-metrics.json --candidate-capture $captureArg --output-dir artifacts/android-standalone-vulkan/captures --markdown-output artifacts/android-standalone-vulkan/render-report.md
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts/android-standalone-vulkan/manifest.json --product standalone --platform-name android --mode non-vr --renderer vulkan --include artifacts/android-standalone-vulkan
