---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Device Matrix

on:
  workflow_call:

permissions:
  actions: write
  contents: read

env:
  FTL_GLES_DEVICE: ${{ vars.FIREBASE_TEST_LAB_ANDROID_GLES_DEVICE || 'model=redfin,version=30,locale=en,orientation=landscape' }}
  FTL_VULKAN_DEVICE: ${{ vars.FIREBASE_TEST_LAB_ANDROID_VULKAN_DEVICE || 'model=Pixel2.arm,version=33,locale=en,orientation=landscape' }}
  FTL_GODOT_DEVICE: ${{ vars.FIREBASE_TEST_LAB_ANDROID_GODOT_DEVICE || 'model=akita,version=34,locale=en,orientation=landscape' }}
  FTL_PROJECT_ID: ${{ vars.FIREBASE_TEST_LAB_PROJECT_ID }}
  FTL_RESULTS_BUCKET: ${{ vars.FIREBASE_TEST_LAB_RESULTS_BUCKET }}

jobs:
  android-standalone-gles:
    name: Android Standalone GLES
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        shell: bash
        run: bash tests/tools/setup_android_sdk.sh
      - name: Install Android SDK components
        shell: bash
        run: bash tests/tools/install_android_sdk_components.sh "ndk;26.1.10909125" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Check Firebase Test Lab configuration
        env:
          FTL_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FTL_PROJECT_ID:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_PROJECT_ID"
            missing=1
          fi
          if [ -z "${FTL_RESULTS_BUCKET:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_RESULTS_BUCKET"
            missing=1
          fi
          if [ -z "${FTL_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Missing repository secret FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Build Android GLES APKs
        working-directory: code/projects/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :libImmCore:assembleDebug :libImmImporter:assembleDebug :libImmPlayer:assembleDebug :appImmViewer:assembleDebug :appImmViewer:assembleDebugAndroidTest -PimmNonVr=ON -PimmRendererApi=GLES -PimmBuildDir=build_gles_ftl
      - name: Run Android GLES smoke in Firebase Test Lab
        timeout-minutes: 30
        shell: bash
        run: >
          python tests/tools/run_firebase_test_lab_android.py
          --project "$FTL_PROJECT_ID"
          --results-bucket "$FTL_RESULTS_BUCKET"
          --results-dir "imm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-android-standalone-gles"
          --device "$FTL_GLES_DEVICE"
          --app code/projects/android/appImmViewer/build_gles_ftl/outputs/apk/debug/appImmViewer-debug.apk
          --test code/projects/android/appImmViewer/build_gles_ftl/outputs/apk/androidTest/debug/appImmViewer-debug-androidTest.apk
          --test-type instrumentation
          --artifact-dir artifacts/android-standalone-gles
          --timeout 5m
          --environment-variable renderer=GLES,waitSeconds=25,ValidationFixedDt=0.0333333333333333,ValidationPlayerFrame=60
          --directory-to-pull /sdcard/Android/data/org.linuxfoundation.imm.player/files/imm-ftl
          --required-marker "IMM Android renderer API: GLES"
          --required-marker "IMMAVAL loadPath result=1"
          --required-marker "IMMAVAL native render capture written"
          --required-marker "Loaded in CPU"
          --required-marker "Loaded in GPU"
          --required-capture-name native-render-after.ppm
          --client-label "IMM Android Standalone GLES"
      - name: Record Android GLES screenshot metrics
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-standalone-gles/ftl-results -Recurse -Filter native-render-after.ppm -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $capture) {
            $capture = Get-ChildItem -Path artifacts/android-standalone-gles/ftl-results -Recurse -Filter native-render-rejected.ppm -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($capture) {
            python tests/tools/compare_render_metrics.py $capture.FullName `
              --reference tests/baselines/render/windows-directx-sample1.ppm `
              --contract tests/baselines/render/windows-directx-sample1.json `
              --json-output artifacts/android-standalone-gles/android-gles-screenshot-metrics.json
          } else {
            New-Item -ItemType Directory -Force artifacts/android-standalone-gles | Out-Null
            '{"passed":false,"errors":["missing Firebase Test Lab native-render-after.ppm"],"candidate":{}}' | Set-Content -Encoding utf8 artifacts/android-standalone-gles/android-gles-screenshot-metrics.json
          }
      - name: Write Android GLES screenshot report
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-standalone-gles/ftl-results -Recurse -Filter native-render-after.ppm -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $capture) {
            $capture = Get-ChildItem -Path artifacts/android-standalone-gles/ftl-results -Recurse -Filter native-render-rejected.ppm -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          $captureArg = if ($capture) { $capture.FullName } else { "artifacts/android-standalone-gles/missing-native-render-after.ppm" }
          python tests/tools/write_render_report.py --metrics-json artifacts/android-standalone-gles/android-gles-screenshot-metrics.json --candidate-capture $captureArg --output-dir artifacts/android-standalone-gles/captures --markdown-output artifacts/android-standalone-gles/render-report.md
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: |
          python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts/android-standalone-gles/manifest.json --product standalone --platform-name android --mode non-vr --renderer gles --include artifacts/android-standalone-gles
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/android-standalone-gles --require-manifest --output artifacts/android-standalone-gles/artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidStandaloneGLES-Device
          path: artifacts/android-standalone-gles
          if-no-files-found: ignore
          retention-days: 14

