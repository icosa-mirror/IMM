---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Device Matrix

on:
  workflow_call:

jobs:
  android-standalone-gles:
    name: Android Standalone GLES
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        shell: bash
        run: bash tests/tools/setup_android_sdk.sh
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
          sdkmanager --install "ndk;26.1.10909125" "ndk;28.1.13356709" "platform-tools" "platforms;android-34" "system-images;android-34;google_apis;arm64-v8a" "emulator"
      - name: Start Android emulator
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifacts/android-standalone-gles"
          mkdir -p "$ARTIFACT_DIR"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT/ANDROID_HOME is not set"
            exit 1
          fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          if ! avdmanager list avd | grep -q "Name: imm-ci-avd"; then
            echo "no" | avdmanager create avd -n imm-ci-avd -k "system-images;android-34;google_apis;arm64-v8a" -d "pixel_2" --force
          fi
          avdmanager list avd | tee "$ARTIFACT_DIR/avd-list.txt"
          if [ ! -f "$ANDROID_AVD_HOME/imm-ci-avd.ini" ]; then
            echo "AVD imm-ci-avd was not created under $ANDROID_AVD_HOME"
            find "$HOME/.android" -maxdepth 3 -type f -print || true
            exit 1
          fi

          nohup "$SDK_ROOT/emulator/emulator" -avd imm-ci-avd -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -accel off > "$ARTIFACT_DIR/emulator.log" 2>&1 &
          emulator_pid=$!
          echo $emulator_pid > "$ARTIFACT_DIR/emulator.pid"

          device_ready=0
          for i in $(seq 1 60); do
            if adb get-state 2>/dev/null | grep -q "device"; then
              device_ready=1
              break
            fi
            sleep 5
          done
          if [ "$device_ready" -ne 1 ]; then
            echo "Android emulator did not appear as an adb device"
            tail -n 200 "$ARTIFACT_DIR/emulator.log"
            exit 1
          fi
          for i in $(seq 1 180); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_completed" = "1" ]; then
              break
            fi
            if [ "$i" -eq 180 ]; then
              echo "Android emulator did not finish booting"
              tail -n 200 "$ARTIFACT_DIR/emulator.log"
              exit 1
            fi
            sleep 2
          done
      - name: Preflight Android device
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import subprocess

          pathlib.Path("artifacts/android-standalone-gles/preflight.json").parent.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(
              [
                  "python",
                  "tests/tools/preflight_runner.py",
                  "--profile", "android-device",
                  "--output", "artifacts/android-standalone-gles/preflight.json",
                  "--require-command", "adb",
                  "--adb-devices",
                  "--adb-health",
              ]
          )
          PY
      - name: Run Android GLES smoke
        shell: pwsh
        run: pwsh -NoProfile -File code/projects/android/run-android-gles-smoke.ps1 -LogDir artifacts/android-standalone-gles/logs
      - name: Record Android GLES screenshot metrics
        shell: pwsh
        run: >
          python tests/tools/compare_render_metrics.py
          artifacts/android-standalone-gles/logs/screencap_after.png
          --json-output artifacts/android-standalone-gles/android-gles-screenshot-metrics.json
      - name: Write Android GLES screenshot report
        if: always()
        shell: pwsh
        run: >
          python tests/tools/write_render_report.py
          --metrics-json artifacts/android-standalone-gles/android-gles-screenshot-metrics.json
          --candidate-capture artifacts/android-standalone-gles/logs/screencap_after.png
          --output-dir artifacts/android-standalone-gles/captures
          --markdown-output artifacts/android-standalone-gles/render-report.md
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: |
          python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts/android-standalone-gles/manifest.json --product standalone --platform-name android --mode non-vr --renderer gles --include artifacts/android-standalone-gles
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/android-standalone-gles --require-manifest --output artifacts/android-standalone-gles/artifact-summary.json
      - name: Stop Android emulator
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "artifacts/android-standalone-gles/emulator.pid" ]; then
            kill "$(cat artifacts/android-standalone-gles/emulator.pid)" || true
          fi
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidStandaloneGLES-Device
          path: artifacts/android-standalone-gles
          if-no-files-found: ignore
          retention-days: 14

