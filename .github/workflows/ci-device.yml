  android-openxr-probe:
    name: Android OpenXR Probe
    # Keep lane code in place; run only when headset-capable CI is explicitly enabled.
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')) && vars.CI_ENABLE_VR_CHECKS == 'true'
    runs-on: [self-hosted, quest, openxr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Quest OpenXR device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-openxr-probe\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Android OpenXR probe smoke
        timeout-minutes: 10
        shell: pwsh
        run: .\code\projects\android\run-android-openxr-probe-smoke.ps1 -LogDir artifacts\android-openxr-probe\logs
      - name: Verify OpenXR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\android-openxr-probe\logs\logcat.txt
          --label android-openxr-probe
          --require "IMM_ANDROID_OPENXR_PROBE begin"
          --require "IMM_ANDROID_OPENXR_PROBE initializeLoaderResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateExtensionsResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE createInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE getHmdSystemResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateStereoViewsFillResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE destroyInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE end"
          --forbid "Fatal signal"
          --forbid "Launch is blocked because"
          --forbid "RequiresControllersLaunchInterceptor"
          --output artifacts\android-openxr-probe\openxr-log-contract.json
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\android-openxr-probe\manifest.json --product standalone --platform-name android --mode vr --renderer openxr --include artifacts\android-openxr-probe
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-openxr-probe --require-manifest --output artifacts\android-openxr-probe\artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidOpenXRProbe-Device
          path: |
            artifacts/android-openxr-probe
            code/projects/android/logs
          if-no-files-found: ignore
          retention-days: 14

  android-godot-vulkan:
    name: Android Godot Vulkan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        shell: pwsh
        run: |
          $sdkRoot = $env:ANDROID_SDK_ROOT
          if (-not $sdkRoot) {
            $sdkRoot = $env:ANDROID_HOME
          }
          if (-not $sdkRoot -or -not (Test-Path $sdkRoot)) {
            throw "ANDROID_SDK_ROOT/ANDROID_HOME is not available on the Windows runner."
          }
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkRoot\cmdline-tools\latest\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$sdkRoot\platform-tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdkManager = Join-Path $env:ANDROID_SDK_ROOT "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkManager)) {
            throw "sdkmanager not found at $sdkManager"
          }
          $packages = @("ndk;26.1.10909125", "ndk;28.1.13356709", "platform-tools", "platforms;android-34", "build-tools;34.0.0")
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            "y" | & $sdkManager --licenses
            & $sdkManager --install @packages
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Write-Warning "sdkmanager install attempt $attempt failed with $LASTEXITCODE"
            Start-Sleep -Seconds (10 * $attempt)
          }
          throw "Failed to install Android SDK components after retries."
      - name: Check Firebase Test Lab configuration
        env:
          FTL_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${FTL_PROJECT_ID:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_PROJECT_ID"
            missing=1
          fi
          if [ -z "${FTL_RESULTS_BUCKET:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_RESULTS_BUCKET"
            missing=1
          fi
          if [ -z "${FTL_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Missing repository secret FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Download Godot for Android export
        shell: pwsh
        run: |
          $version = "4.5-stable"
          $templateVersion = $version.Replace("-", ".")
          $zipName = "Godot_v$($version)_win64.exe.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/$version/$zipName" -OutFile godot-android-export.zip
          Expand-Archive -Path godot-android-export.zip -DestinationPath godot-android-export
          $godotExe = Get-ChildItem -Path godot-android-export -Filter "Godot*.exe" -Recurse | Select-Object -First 1
          if (-not $godotExe) {
            throw "Could not locate downloaded Godot executable"
          }
          "GODOT_EXE=$($godotExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v$($version)_export_templates.tpz" -OutFile godot-export-templates.zip
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          tar -xf godot-export-templates.zip -C $templateDir
          $nested = Join-Path $templateDir "templates"
          if (Test-Path $nested) {
            Get-ChildItem -Path $nested | Move-Item -Destination $templateDir -Force
            Remove-Item -LiteralPath $nested -Force
          }
      - name: Build Android Godot APK
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\android-godot-vulkan"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $projectDir = Join-Path $env:RUNNER_TEMP "ImmGodotSampleProjectAndroidExport"
          Remove-Item -Recurse -Force $projectDir -ErrorAction SilentlyContinue
          Copy-Item -Recurse code\ImmGodotSampleProject $projectDir
          Copy-Item exampleImmFiles\sample1.imm (Join-Path $projectDir "sample1.imm") -Force
          Remove-Item (Join-Path $projectDir "scenes\SampleScene.tscn") -Force -ErrorAction SilentlyContinue
          $extensionPath = Join-Path $projectDir "addons\imm_viewer\imm_viewer.gdextension"
          $extension = Get-Content $extensionPath
          $extension = $extension | Where-Object { $_ -notmatch '^(windows|macos)\.' }
          Set-Content -Encoding utf8 -Path $extensionPath -Value $extension
          $projectPath = Join-Path $projectDir "project.godot"
          $project = Get-Content -Raw $projectPath
          $project = $project -replace 'run/main_scene="res://scenes/SampleScene\.tscn"', 'run/main_scene="res://scenes/VisualSmokeScene.tscn"'
          Set-Content -Encoding utf8 -NoNewline -Path $projectPath -Value $project
          if (-not ((Get-Content -Raw $projectPath).Contains('run/main_scene="res://scenes/VisualSmokeScene.tscn"'))) {
            throw "Failed to update Godot main scene for Android visual smoke"
          }
          $godotEditorArgs = @(
            "--headless",
            "--display-driver", "headless",
            "--rendering-driver", "opengl3",
            "--rendering-method", "gl_compatibility",
            "--path", $projectDir
          )
          & $env:GODOT_EXE @godotEditorArgs --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed with $LASTEXITCODE" }
          & $env:GODOT_EXE @godotEditorArgs --export-debug "Android Debug" "$artifactDir\imm-godot-sample-debug.apk"
          if ($LASTEXITCODE -ne 0) { throw "Godot Android export failed with $LASTEXITCODE" }
      - name: Run Android Godot Vulkan smoke in Firebase Test Lab
        timeout-minutes: 30
        shell: pwsh
        run: |
          $env:GCLOUD_BIN = (Get-Command gcloud.cmd -ErrorAction Stop).Source
          $resultsDir = "imm-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-android-godot-vulkan"
          python tests/tools/run_firebase_test_lab_android.py `
            --project "$env:FTL_PROJECT_ID" `
            --results-bucket "$env:FTL_RESULTS_BUCKET" `
            --results-dir "$resultsDir" `
            --device "$env:FTL_DEVICE" `
            --app artifacts/android-godot-vulkan/imm-godot-sample-debug.apk `
            --test-type robo `
            --artifact-dir artifacts/android-godot-vulkan `
            --timeout 5m `
            --directory-to-pull /sdcard/Android/data/org.linuxfoundation.imm.godot.sample/files `
            --required-marker "IMM Godot Vulkan visual smoke passed" `
            --required-marker "Loaded in CPU" `
            --required-marker "Loaded in GPU" `
            --required-marker "Vulkan renderer submitted picture draw commands" `
            --required-marker "Vulkan renderer submitted static paint draw commands" `
            --required-marker "last_vulkan_frame_started" `
            --required-capture-name vulkan_visual_smoke.png `
            --client-label "IMM Android Godot Vulkan"
      - name: Record Android Godot Vulkan screenshot metrics
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-godot-vulkan/ftl-results -Recurse -Filter vulkan_visual_smoke.png -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($capture) {
            python tests/tools/compare_render_metrics.py $capture.FullName --json-output artifacts/android-godot-vulkan/android-godot-vulkan-screenshot-metrics.json
          } else {
            New-Item -ItemType Directory -Force artifacts/android-godot-vulkan | Out-Null
            '{"passed":false,"errors":["missing Firebase Test Lab vulkan_visual_smoke.png"],"candidate":{}}' | Set-Content -Encoding utf8 artifacts/android-godot-vulkan/android-godot-vulkan-screenshot-metrics.json
          }
      - name: Write Android Godot Vulkan screenshot report
        if: always()
        shell: pwsh
        run: |
          $capture = Get-ChildItem -Path artifacts/android-godot-vulkan/ftl-results -Recurse -Filter vulkan_visual_smoke.png -ErrorAction SilentlyContinue | Select-Object -First 1
          $captureArg = if ($capture) { $capture.FullName } else { "artifacts/android-godot-vulkan/missing-vulkan_visual_smoke.png" }
          python tests/tools/write_render_report.py --metrics-json artifacts/android-godot-vulkan/android-godot-vulkan-screenshot-metrics.json --candidate-capture $captureArg --output-dir artifacts/android-godot-vulkan/captures --markdown-output artifacts/android-godot-vulkan/render-report.md
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts/android-godot-vulkan/manifest.json --product godot --platform-name android --mode non-vr --renderer vulkan --include artifacts/android-godot-vulkan
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/android-godot-vulkan --require-manifest --output artifacts/android-godot-vulkan/artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGodotVulkan-Device
          path: artifacts/android-godot-vulkan
          if-no-files-found: ignore
          retention-days: 14

  android-quest-vr:
    name: Android Quest VR
    # Keep lane code in place; run only when headset-capable CI is explicitly enabled.
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')) && vars.CI_ENABLE_VR_CHECKS == 'true'
    runs-on: [self-hosted, quest, vr]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Quest VR device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-quest-vr\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Quest VR app smoke
        timeout-minutes: 10
        shell: pwsh
        run: .\code\projects\android\run-android-quest-vr-smoke.ps1 -AttemptQuestUnblock -LogDir artifacts\android-quest-vr\logs
      - name: Verify Quest VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\android-quest-vr\logs\logcat.txt
          --label android-quest-vr
          --require "android_app_entry()"
          --require "AppState UseMultiview"
          --require "vrapi_EnterVrMode()"
          --require "Checking for sample1.imm"
          --require "Loading Quill:"
          --require "Initialized Quill Viewer"
          --require "IMM_ANDROID_VR_SMOKE viewer_initialized"
          --require "Loaded in CPU"
          --require "Loaded in GPU"
          --require "loading completed... vrapi_SetClockLevels"
          --require "IMM_ANDROID_VR_SMOKE document_frame_submitted"
          --forbid "Fatal signal"
          --forbid "FAILED to open sample1.imm"
          --forbid "Can't init Quill Viewer"
          --output artifacts\android-quest-vr\quest-vr-log-contract.json
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\android-quest-vr\manifest.json --product standalone --platform-name android --mode vr --renderer gles --include artifacts\android-quest-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-quest-vr --require-manifest --output artifacts\android-quest-vr\artifact-summary.json
      - name: Upload Quest VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidQuestVR-Device
          path: artifacts/android-quest-vr
          if-no-files-found: ignore
          retention-days: 14

  ios-device-smoke:
    name: iOS Device Smoke
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci')
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight iOS device runner
        run: python3 tests/tools/preflight_runner.py --profile ios-device --output artifacts/ios-device-smoke/preflight.json --require-command xcrun --require-command xcodebuild
      - name: Verify iOS package target
        run: |
          set -euo pipefail
          cmake -S code/projects/ios -B build/ios -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/ios --target ImmUnityIOSLinkSmoke --config Release
      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class packaging --output artifacts/ios-device-smoke/manifest.json --product unity --platform-name ios --mode package-import --renderer native --include build/ios
      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/ios-device-smoke --require-manifest --output artifacts/ios-device-smoke/artifact-summary.json
      - name: Upload iOS device smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSDeviceSmoke
          path: artifacts/ios-device-smoke
          if-no-files-found: ignore
          retention-days: 14

  device-evidence-report:
    name: Device Evidence Report
    if: always() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'device-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - android-standalone-gles
      - android-standalone-vulkan
      - android-openxr-probe
      - android-godot-vulkan
      - android-quest-vr
      - ios-device-smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download device artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/device-evidence/input

      - name: Verify device matrix evidence
        run: >
          python tests/tools/verify_matrix_evidence.py tests/matrix_status.json
          --gate-prefix "CI Device Matrix /"
          --evidence-root artifacts/device-evidence/input
          --json-output artifacts/device-evidence/matrix-evidence.json
          --markdown-output artifacts/device-evidence/matrix-evidence.md

      - name: Upload device evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeviceMatrixEvidence
          path: artifacts/device-evidence
          if-no-files-found: ignore
          retention-days: 14

      - name: Hide per-lane device artifacts
        if: ${{ always() && vars.CI_VALIDATION_DEBUG_ARTIFACTS != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          python tests/tools/delete_ci_artifacts.py
          --name AndroidStandaloneGLES-Device
          --name AndroidStandaloneVulkan-Device
          --name AndroidOpenXRProbe-Device
          --name AndroidGodotVulkan-Device
          --name AndroidQuestVR-Device
          --name iOSDeviceSmoke
