          fi
          if [ -z "${FTL_RESULTS_BUCKET:-}" ]; then
            echo "Missing repository variable FIREBASE_TEST_LAB_RESULTS_BUCKET"
            missing=1
          fi
          if [ -z "${FTL_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "Missing repository secret FIREBASE_TEST_LAB_SERVICE_ACCOUNT_JSON"
