---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Device Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * *'

jobs:
  android-standalone-gles:
    name: Android Standalone GLES
    runs-on: [self-hosted, android-device]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Android device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-standalone-gles\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Android GLES smoke
        shell: pwsh
        run: .\code\projects\android\run-android-gles-smoke.ps1
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts\android-standalone-gles\manifest.json --product standalone --platform-name android --mode non-vr --renderer gles --include code\projects\android\logs
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-standalone-gles --require-manifest --output artifacts\android-standalone-gles\artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidStandaloneGLES-Device
          path: |
            artifacts/android-standalone-gles
            code/projects/android/logs
          if-no-files-found: ignore
          retention-days: 14

  android-standalone-vulkan:
    name: Android Standalone Vulkan
    runs-on: [self-hosted, android-device, vulkan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Android Vulkan device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-standalone-vulkan\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Android Vulkan smoke
        shell: pwsh
        run: .\code\projects\android\run-android-vulkan-smoke.ps1
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts\android-standalone-vulkan\manifest.json --product standalone --platform-name android --mode non-vr --renderer vulkan --include code\projects\android\logs
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-standalone-vulkan --require-manifest --output artifacts\android-standalone-vulkan\artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidStandaloneVulkan-Device
          path: |
            artifacts/android-standalone-vulkan
            code/projects/android/logs
          if-no-files-found: ignore
          retention-days: 14

  android-openxr-probe:
    name: Android OpenXR Probe
    runs-on: [self-hosted, quest, openxr]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Quest OpenXR device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-openxr-probe\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Android OpenXR probe smoke
        shell: pwsh
        run: .\code\projects\android\run-android-openxr-probe-smoke.ps1 -LogDir artifacts\android-openxr-probe\logs
      - name: Verify OpenXR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\android-openxr-probe\logs\logcat.txt
          --label android-openxr-probe
          --require "IMM_ANDROID_OPENXR_PROBE begin"
          --require "IMM_ANDROID_OPENXR_PROBE initializeLoaderResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateExtensionsResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE createInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE getHmdSystemResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateStereoViewsFillResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE destroyInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE end"
          --forbid "Fatal signal"
          --forbid "Launch is blocked because"
          --forbid "RequiresControllersLaunchInterceptor"
          --output artifacts\android-openxr-probe\openxr-log-contract.json
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\android-openxr-probe\manifest.json --product standalone --platform-name android --mode vr --renderer openxr --include artifacts\android-openxr-probe
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-openxr-probe --require-manifest --output artifacts\android-openxr-probe\artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidOpenXRProbe-Device
          path: |
            artifacts/android-openxr-probe
            code/projects/android/logs
          if-no-files-found: ignore
          retention-days: 14

  android-godot-vulkan:
    name: Android Godot Vulkan
    runs-on: [self-hosted, android-device, godot, vulkan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Android Godot device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-godot-vulkan\preflight.json --require-command adb --require-env GODOT_EXE --adb-devices --adb-health
      - name: Run Android Godot Vulkan smoke
        shell: pwsh
        run: .\code\projects\android\run-godot-android-vulkan-smoke.ps1
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class runtime-launch --output artifacts\android-godot-vulkan\manifest.json --product godot --platform-name android --mode non-vr --renderer vulkan --include code\projects\android\logs
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-godot-vulkan --require-manifest --output artifacts\android-godot-vulkan\artifact-summary.json
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidGodotVulkan-Device
          path: |
            artifacts/android-godot-vulkan
            code/projects/android/logs
          if-no-files-found: ignore
          retention-days: 14

  android-quest-vr:
    name: Android Quest VR
    runs-on: [self-hosted, quest, vr]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight Quest VR device
        shell: pwsh
        run: python tests\tools\preflight_runner.py --profile android-device --output artifacts\android-quest-vr\preflight.json --require-command adb --adb-devices --adb-health
      - name: Run Quest VR OpenXR smoke
        shell: pwsh
        run: .\code\projects\android\run-android-openxr-probe-smoke.ps1 -VrManifest -AttemptQuestUnblock -LogDir artifacts\android-quest-vr\logs
      - name: Verify Quest VR log contract
        shell: pwsh
        run: >
          python tests\tools\verify_log_markers.py
          --log artifacts\android-quest-vr\logs\logcat.txt
          --label android-quest-vr
          --require "IMM_ANDROID_OPENXR_PROBE begin"
          --require "IMM_ANDROID_OPENXR_PROBE initializeLoaderResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateExtensionsResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE createInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE getHmdSystemResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE enumerateStereoViewsFillResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE destroyInstanceResult=0 resultName=XR_SUCCESS"
          --require "IMM_ANDROID_OPENXR_PROBE end"
          --forbid "Fatal signal"
          --forbid "Launch is blocked because"
          --forbid "RequiresControllersLaunchInterceptor"
          --output artifacts\android-quest-vr\openxr-log-contract.json
      - name: Write CI manifest
        if: always()
        shell: pwsh
        run: python tests\tools\write_ci_manifest.py --status "${{ job.status }}" --failure-class vr-device-infrastructure --output artifacts\android-quest-vr\manifest.json --product standalone --platform-name android --mode vr --renderer openxr --include artifacts\android-quest-vr
      - name: Collect artifact summary
        if: always()
        shell: pwsh
        run: python tests\tools\collect_ci_artifacts.py --artifact-dir artifacts\android-quest-vr --require-manifest --output artifacts\android-quest-vr\artifact-summary.json
      - name: Upload Quest VR artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidQuestVR-Device
          path: artifacts/android-quest-vr
          if-no-files-found: ignore
          retention-days: 14

  ios-device-smoke:
    name: iOS Device Smoke
    runs-on: [self-hosted, macos, ios-device]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Preflight iOS device runner
        run: python3 tests/tools/preflight_runner.py --profile ios-device --output artifacts/ios-device-smoke/preflight.json --require-command xcrun --require-command xcodebuild
      - name: Verify iOS package target
        run: |
          set -euo pipefail
          cmake -S code/projects/ios -B build/ios -G Xcode
          cmake --build build/ios --target ImmUnityIOSLinkSmoke --config Release
      - name: Write CI manifest
        if: always()
        run: python3 tests/tools/write_ci_manifest.py --status "${{ job.status }}" --failure-class packaging --output artifacts/ios-device-smoke/manifest.json --product unity --platform-name ios --mode package-import --renderer native --include build/ios
      - name: Collect artifact summary
        if: always()
        run: python3 tests/tools/collect_ci_artifacts.py --artifact-dir artifacts/ios-device-smoke --require-manifest --output artifacts/ios-device-smoke/artifact-summary.json
      - name: Upload iOS device smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOSDeviceSmoke
          path: artifacts/ios-device-smoke
          if-no-files-found: ignore
          retention-days: 14
