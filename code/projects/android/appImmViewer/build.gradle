plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

if (project.hasProperty("immBuildDir")) {
    buildDir = file(project.property("immBuildDir"))
}

android {
    namespace 'org.linuxfoundation.imm.player'
    compileSdk 34
    ndkVersion "26.1.10909125"
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId 'org.linuxfoundation.imm.player'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                def immNonVr = project.findProperty("immNonVr") ?: "ON"
                def immRendererApi = project.findProperty("immRendererApi") ?: (immNonVr == "ON" ? "Vulkan" : "GLES")
                def immXrRuntime = project.findProperty("immXrRuntime") ?: "Legacy"
                cppFlags "-std=c++17", "-D__ANDROID__", "-DANDROID"
                arguments "-DANDROID_STL=c++_shared",
                        "-DIMM_ANDROID_NON_VR=${immNonVr}",
                        "-DIMM_ANDROID_RENDERER_API=${immRendererApi}",
                        "-DIMM_ANDROID_XR_RUNTIME=${immXrRuntime}",
                        "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY",
                        "-DCMAKE_C_COMPILER_WORKS=1",
                        "-DCMAKE_CXX_COMPILER_WORKS=1",
                        "-DCMAKE_C_ABI_COMPILED=1",
                        "-DCMAKE_CXX_ABI_COMPILED=1"
                abiFilters "arm64-v8a"
                targets "appImmPlayer"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            def immNonVr = project.findProperty("immNonVr") ?: "ON"
            def immManifest = project.findProperty("immManifest") ?: (immNonVr == "ON" ? "nonVr" : "vr")
            def viewerSrc = "${projectDir}/../../../appImmViewer/src/android"
            manifest.srcFile immManifest == "vr" ? "src/vr/AndroidManifest.xml" : "src/nonVr/AndroidManifest.xml"
            java.srcDirs = ["${viewerSrc}/java"]
            res.srcDirs = ["${viewerSrc}/res"]
            assets.srcDirs = ["${viewerSrc}/assets", "${buildDir}/generated/assets"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.annotation:annotation:1.8.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
}

def generatedAssetsDir = "${buildDir}/generated/assets"
def sampleImmSrc = "${projectDir}/../../../../exampleImmFiles/sample1.imm"

tasks.register('copySampleImm') {
    inputs.file(sampleImmSrc)
    outputs.dir(generatedAssetsDir)
    doLast {
        def destDir = file(generatedAssetsDir)
        destDir.mkdirs()
        copy {
            from sampleImmSrc
            into destDir
        }
    }
}

preBuild.dependsOn tasks.named('copySampleImm')
