plugins {
    id 'com.android.application'
}

if (project.hasProperty("immBuildDir")) {
    buildDir = file(project.property("immBuildDir"))
}

android {
    namespace 'org.linuxfoundation.imm.godot.ftltest'
    compileSdk 34

    defaultConfig {
        applicationId 'org.linuxfoundation.imm.godot.ftltest'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}
