<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>IMM Web Player</title>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport" aria-label="IMM 3D viewport"></canvas>
      <section id="panel">
        <h1>IMM Web Player</h1>
        <p class="phase">Native Wasm + Three.js player</p>
        <label class="file-picker">
          <span>Open IMM file</span>
          <input id="file-input" type="file" accept=".imm,application/octet-stream" />
        </label>
        <form id="url-form" class="url-picker">
          <label for="url-input">IMM URL</label>
          <div>
            <input id="url-input" type="url" placeholder="https://…/scene.imm" />
            <button type="button" id="paste-url">Paste</button>
            <button type="submit">Load</button>
          </div>
        </form>
        <section id="playback-controls" class="playback-controls" aria-label="Playback controls" hidden>
          <div class="transport">
            <button id="skip-back" type="button" title="Previous chapter">⏮</button>
            <button id="play-pause" type="button">Play</button>
            <button id="continue" type="button">Continue</button>
            <button id="restart" type="button">Restart</button>
            <button id="skip-forward" type="button" title="Next chapter">⏭</button>
          </div>
          <input id="timeline" type="range" min="0" max="1" value="0" step="1" aria-label="Timeline" />
          <div class="timeline-labels"><output id="playback-time">0:00 / 0:00</output><select id="chapter" aria-label="Chapter"></select></div>
          <div class="camera-options">
            <label>Viewpoint <select id="viewpoint" aria-label="Viewpoint"></select></label>
            <label>Camera <select id="camera-mode" aria-label="Camera navigation mode"><option value="fly">Fly / free look</option><option value="orbit">Orbit</option></select></label>
          </div>
          <p class="camera-help">Drag to look · WASD move · Q/E down/up · wheel moves forward · two-finger drag moves</p>
        </section>
        <p id="status" role="status">Choose an IMM file to decode and render.</p>
        <pre id="summary" hidden></pre>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
