<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>IMM Web Player</title>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport" aria-label="IMM 3D viewport"></canvas>
      <section id="panel">
        <h1>IMM Web Player</h1>
        <p class="phase">Decoder inspection shell</p>
        <label class="file-picker">
          <span>Open IMM file</span>
          <input id="file-input" type="file" accept=".imm,application/octet-stream" />
        </label>
        <p id="status" role="status">Choose an IMM file to inspect it in the decoder worker.</p>
        <pre id="summary" hidden></pre>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
