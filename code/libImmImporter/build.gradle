plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

android {
    namespace 'com.immersive.libimmimporter'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17", "-DANDROID", "-Werror"
                arguments "-DANDROID_STL=c++_shared",
                        "-DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY",
                        "-DCMAKE_C_COMPILER_WORKS=1",
                        "-DCMAKE_CXX_COMPILER_WORKS=1",
                        "-DCMAKE_C_ABI_COMPILED=1",
                        "-DCMAKE_CXX_ABI_COMPILED=1"
                abiFilters "arm64-v8a"
                targets "libImmImporter" // Need to specify target when building a static lib
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDir 'libs'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
